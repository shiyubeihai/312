function subject(sid){
  const s=subj(sid); if(!s) return home();
  document.documentElement.style.setProperty("--accent", s.color);
  document.documentElement.style.setProperty("--soft", s.soft);
  let h='<div class="wrap fade"><div class="list-head"><h2>'+esc(s.name)+'</h2><p>'+esc(s.desc)+'</p></div>';
  s.modules.forEach((m,i)=>{
    const done=state.done.includes(m.id);
    h+='<button class="mod '+(done?"done":"")+'" onclick="go(\''+s.id+'\',\''+m.id+'\')">'+
       '<span class="no">'+esc(m.no)+'</span><span class="tx"><h4>'+esc(m.title)+'</h4><span>'+esc(m.tag)+'</span></span>'+
       '<span class="done" onclick="event.stopPropagation();toggleDone(\''+m.id+'\');this.parentElement.classList.toggle(\'done\')">✓</span></button>';
  });
  h+='</div>';
  render(h);
  window.scrollTo(0,0);
}
function reader(sid, mid){
  const s=subj(sid), m=modOf(sid,mid); if(!s||!m) return home();
  document.documentElement.style.setProperty("--accent", s.color);
  document.documentElement.style.setProperty("--soft", s.soft);
  const idx=s.modules.findIndex(x=>x.id===mid);
  const tpl=document.getElementById("doc-"+mid);
  let h='<div class="reader fade"><div class="rhead"><button class="back" onclick="go(\''+s.id+'\')">‹</button>'+
        '<div class="rt"><b>'+esc(m.title)+'</b><span>'+esc(s.name)+' · '+esc(m.tag)+'</span></div>'+
        '<button class="icon-btn" id="mark" title="标记已掌握">'+(state.done.includes(mid)?"✓":"○")+'</button></div>'+
        '<div class="content" id="content">'+(tpl?tpl.innerHTML:"")+'</div></div>'+
        '<div class="rnav"><button '+(idx<=0?"disabled":"")+' onclick="go(\''+s.id+'\',\''+(idx>0?s.modules[idx-1].id:"")+'\')">‹ 上一单元</button>'+
        '<button '+(idx>=s.modules.length-1?"disabled":"")+' onclick="go(\''+s.id+'\',\''+(idx<s.modules.length-1?s.modules[idx+1].id:"")+'\')">下一单元 ›</button></div>';
  render(h);
  wrapTables();
  CUR={s:sid,m:mid};
  applyAnns(mid);
  state.last={s:sid,m:mid}; save();
  $("#mark").onclick=()=>{ toggleDone(mid); $("#mark").textContent=state.done.includes(mid)?"✓":"○"; };
  window.scrollTo(0,0);
}
function wrapTables(){
  document.querySelectorAll("#content table").forEach(t=>{
    if(t.parentElement.classList.contains("tw")) return;
    const w=el("div","tw"); t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
}
function toggleDone(mid){
  const i=state.done.indexOf(mid);
  if(i>=0) state.done.splice(i,1); else state.done.push(mid);
  save();
}
function render(html){ $("#app").innerHTML=html; }

/* ---------- 批注 ---------- */
let CUR={s:null,m:null};
let pendingSel=null, hideTimer=null, toastTimer=null;

function textNodesOf(root){
  const out=[]; const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null); let n;
  while((n=w.nextNode())){ if(n.nodeValue && n.nodeValue.length) out.push(n); }
  return out;
}
function offsetAt(root,node,off){
  if(!node || node.nodeType!==3) return -1;
  let acc=0;
  for(const n of textNodesOf(root)){
    if(n===node) return acc+off;
    acc+=n.nodeValue.length;
  }
  return -1;
}
function startAt(root,offset){
  let acc=0;
  for(const n of textNodesOf(root)){
    const len=n.nodeValue.length;
    if(offset>=acc && offset<acc+len) return {node:n,off:offset-acc};
    acc+=len;
  }
  const ns=textNodesOf(root);
  if(!ns.length) return null;
  const last=ns[ns.length-1];
  return {node:last,off:last.nodeValue.length};
}
function endAt(root,offset){
  let acc=0;
  for(const n of textNodesOf(root)){
    const len=n.nodeValue.length;
    if(offset>acc && offset<=acc+len) return {node:n,off:offset-acc};
    acc+=len;
  }
  const ns=textNodesOf(root);
  if(!ns.length) return null;
  return {node:ns[0],off:0};
}
function blockOf(node){
  const e=node.nodeType===3?node.parentElement:node;
  return e && e.closest ? e.closest("p,li,h1,h2,h3,h4,td,th,div") : null;
}
function selectionInfo(){
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const r=sel.getRangeAt(0);
  const root=$("#content");
  if(!root || !root.contains(r.commonAncestorContainer)) return null;
  const b1=blockOf(r.startContainer), b2=blockOf(r.endContainer);
  if(!b1 || b1!==b2) return {cross:true};
  const s=offsetAt(root,r.startContainer,r.startOffset);
  const e=offsetAt(root,r.endContainer,r.endOffset);
  if(s<0 || e<0 || e<=s) return null;
  return {s:s,e:e,cross:false};
}
function showBar(on){
  const bar=$("#annBar"); if(!bar) return;
  bar.classList.toggle("on", !!on);
}
function hideBar(){ showBar(false); pendingSel=null; }
function toast(msg){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("on"),1500);
}
function checkSel(){
  const info=selectionInfo();
  if(!info){ hideBar(); return; }
  if(info.cross){ pendingSel=null; showBar(false); toast("请在同一段内选择"); return; }
  pendingSel=info; showBar(true);
}
function addAnn(type,color){
  if(!pendingSel || !CUR.m) return;
  const ann={id:"a"+Date.now()+Math.floor(Math.random()*1000), s:pendingSel.s, e:pendingSel.e, type:type, color:color};
  state.ann=state.ann||{};
  const list=state.ann[CUR.m]=state.ann[CUR.m]||[];
  const sel=window.getSelection(); if(sel) sel.removeAllRanges();
  hideBar();

  const same=list.findIndex(a=>a.s===ann.s && a.e===ann.e && a.type===type && a.color===color);
  if(same>=0){ list.splice(same,1); save(); applyAnns(CUR.m); toast("已清除"); return; }
  for(let i=list.length-1;i>=0;i--){ if(ann.s<list[i].e && ann.e>list[i].s) list.splice(i,1); }
  list.push(ann); save();
  applyAnns(CUR.m);
  toast(type==="h" ? "已高亮" : "已加下划线");
}
function wrapAnn(root,a){
  const st=startAt(root,a.s), en=endAt(root,a.e);
  if(!st || !en) return;
  const r=document.createRange();
  r.setStart(st.node,st.off);
  r.setEnd(en.node,en.off);
  const sp=document.createElement("span");
  sp.className="ann "+(a.type==="u"?"ann-u":"ann-h")+" "+(a.color==="b"?"b":"r");
  sp.dataset.aid=a.id;
  try{ r.surroundContents(sp); }
  catch(e){ const frag=r.extractContents(); sp.appendChild(frag); r.insertNode(sp); }
}
function clearAnns(root){
  root.querySelectorAll(".ann").forEach(sp=>{
    const parent=sp.parentNode;
    while(sp.firstChild) parent.insertBefore(sp.firstChild, sp);
    parent.removeChild(sp);
    parent.normalize();
  });
}
function applyAnns(mid){
  const root=$("#content"); if(!root) return;
  clearAnns(root);
  const list=(state.ann && state.ann[mid]) || [];
  list.slice().sort((a,b)=>a.s-b.s).forEach(a=>wrapAnn(root,a));
}
function initAnns(){
  const bar=$("#annBar"); if(!bar) return;
  bar.querySelectorAll(".ab[data-t]").forEach(b=>{
    b.addEventListener("pointerdown",e=>{
      e.preventDefault();
      addAnn(b.dataset.t, b.dataset.c);
    });
  });
  const cancel=$("#annCancel");
  if(cancel) cancel.addEventListener("pointerdown",e=>{ e.preventDefault(); hideBar(); });
  document.addEventListener("selectionchange",()=>{
    clearTimeout(hideTimer);
    hideTimer=setTimeout(checkSel,150);
  });
  document.addEventListener("touchend",()=>{
    clearTimeout(hideTimer);
    hideTimer=setTimeout(checkSel,120);
  });
  document.addEventListener("mouseup",()=>{
    clearTimeout(hideTimer);
    hideTimer=setTimeout(checkSel,60);
  });
  $("#app").addEventListener("click",e=>{
    const t=e.target.closest ? e.target.closest(".ann") : null;
    if(!t || !CUR.m) return;
    const id=t.dataset.aid;
    const list=(state.ann && state.ann[CUR.m]) || [];
    const i=list.findIndex(a=>a.id===id);
    if(i<0) return;
    if(confirm("清除这条批注？")){
      const y=window.scrollY;
      list.splice(i,1); save();
      reader(CUR.s, CUR.m);
      setTimeout(()=>window.scrollTo(0,y),0);
    }
  });
}
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  if(h==="settings"){ settings(); document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on")); return; }
  const p=h.split("/").filter(Boolean);
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.s===p[0]));
  if(!p.length) home();
  else if(p.length===1) subject(p[0]);
  else reader(p[0], p[1]);
}
function go(sid, mid){
  const h="#/"+sid+(mid?"/"+mid:"");
  if(location.hash===h) route(); else location.hash=h;
}
window.addEventListener("hashchange", route);
function search(q){
  q=q.trim(); const out=$("#results");
  if(!q){ out.innerHTML='<div class="empty">输入关键词，跨五科搜索</div>'; return; }
  const res=[];
  document.querySelectorAll("template[id^=doc-]").forEach(t=>{
    const txt=t.content?t.content.textContent:t.innerHTML.replace(/<[^>]+>/g,"");
    const i=txt.toLowerCase().indexOf(q.toLowerCase());
    if(i>=0){
      const id=t.id.slice(4); const s=DATA.find(x=>x.modules.some(m=>m.id===id)); const m=s&&s.modules.find(m=>m.id===id);
      if(!s||!m) return;
      const snip=txt.slice(Math.max(0,i-30), i+q.length+50).replace(/\s+/g," ");
      res.push({s,m,snip});
    }
  });
  out.innerHTML = res.length ? res.slice(0,50).map(r=>'<button class="res" onclick="openResult(\''+r.s.id+'\',\''+r.m.id+'\')"><b>'+esc(r.m.title)+'</b><span>'+esc(r.s.name)+' · '+esc(r.m.tag)+'</span><p>…'+esc(r.snip)+'…</p></button>').join("") : '<div class="empty">没有找到「'+esc(q)+'」</div>';
}
function openResult(sid,mid){ $("#searchSheet").classList.remove("on"); go(sid,mid); }
function buildTabs(){
  const bar=$("#tabs");
  if(!bar) return;
  bar.innerHTML = DATA.map(s=>'<button class="tab" data-s="'+s.id+'" onclick="go(\''+s.id+'\')">'+esc(s.short)+'</button>').join("");
}
function settings(){
  const s='<div class="wrap fade"><div class="list-head"><h2>设置</h2><p>阅读与进度</p></div>'+
   '<div class="setrow"><span>字号</span><div class="ctl"><button onclick="setFs(-1)">A−</button><span class="val">'+state.fs+'</span><button onclick="setFs(1)">A+</button></div></div>'+
   '<div class="setrow"><span>深色模式</span><div class="ctl"><button onclick="toggleTheme()">'+(state.theme==="dark"?"关":"开")+'</button></div></div>'+
   '<div class="setrow"><span>已掌握</span><div class="ctl"><span class="val">'+totalDone()+' / '+totalMods()+'</span></div></div>'+
   '<button class="danger" onclick="resetAll()">清空进度与记录</button>'+
   '<p style="color:var(--sub);font-size:12px;line-height:1.7;margin-top:16px">选中正文可高亮或加下划线（红/蓝）；点已批注的文字可清除。批注与进度都保存在本机浏览器。</p>'+
   '<p style="color:var(--sub);font-size:12px;line-height:1.7">离线单文件，换浏览器或清除缓存会丢失记录。</p></div>';
  render(s);
}
function setFs(d){ state.fs=Math.min(22,Math.max(14,state.fs+d)); save(); applyTheme(); }
function toggleTheme(){ state.theme=state.theme==="dark"?"light":"dark"; save(); applyTheme(); settings(); }
function resetAll(){ if(confirm("确定清空所有进度与批注？")){ state.done=[]; state.last=null; state.ann={}; save(); home(); } }
function shell(){
  applyTheme(); buildTabs();
  document.body.insertAdjacentHTML("afterbegin",
   '<header class="top"><div class="top-row"><div class="logo">312</div><div class="brand">312核心<small>心理学考研 · 五科复习</small></div>'+
   '<button class="icon-btn" onclick="openSearch()">⌕</button><button class="icon-btn" onclick="go(\'settings\')">⚙</button></div>'+
   '<div class="tabs" id="tabs"></div></header>');
  buildTabs();
  $("#closeSearch").onclick=()=>$("#searchSheet").classList.remove("on");
  $("#q").addEventListener("input",e=>search(e.target.value));
  initAnns();
}
function openSearch(){ $("#searchSheet").classList.add("on"); setTimeout(()=>$("#q").focus(),50); }
shell(); route();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
