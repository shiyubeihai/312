<body>

<template id="doc-psy-01" data-subject="psy"><div class="doc" data-title="心理学概述"><p class="lead">本章选择题稳定出 1—2 道，简答偶考。重点是“对象三层结构”“流派—人物对应”和“研究方法能否推断因果”，三块都能直接出题。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>心理学</b>研究心理现象及其规律的科学，兼具自然科学与社会科学性质。</p>
  <p class="def"><b>心理过程</b>认知过程（感觉、知觉、记忆、思维、想象）、情绪情感过程、意志过程；<b>心理状态</b>介于过程与个性之间，如注意、心境、灵感；<b>个性心理</b>含倾向性（需要、动机、兴趣、信念、价值观）与特征（能力、气质、性格）。</p>
  <p class="def"><b>构造主义</b>冯特、铁钦纳创立；主张心理学研究直接经验（意识经验）的构成元素，方法为实验内省。</p>
  <p class="def"><b>机能主义</b>詹姆斯、杜威、安吉尔代表；主张研究意识适应环境的机能，意识是流动的（意识流）。</p>
  <p class="def"><b>行为主义</b>华生 1913 年创立；主张心理学只研究可观察、可测量的行为，即刺激与反应之间的联结。</p>
  <p class="def"><b>格式塔心理学</b>韦特海默、苛勒、考夫卡创立；主张整体大于部分之和，心理现象应作为整体研究。</p>
  <p class="def"><b>精神分析</b>弗洛伊德创立；强调无意识、本能冲动与早期经验对人格与行为的决定作用。</p>
  <p class="def"><b>人本主义</b>马斯洛、罗杰斯代表；强调人的价值、潜能与自我实现，反对行为主义的还原论。</p>
  <p class="def"><b>自变量</b>研究者主动操纵、假定为原因的变量；<b>因变量</b>随自变量变化、被测量的变量；<b>控制变量</b>需保持恒定以排除干扰的额外变量。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">谱系 / 矩阵 / 成分</span></div>

  <h3>（1）研究对象的三层结构（默写重点）</h3>
  <div class="flow">
    心理过程 <em>（知 · 情 · 意）</em> ｜ 心理状态 <em>（注意 · 心境 · 灵感）</em> ｜ 个性心理 <em>（倾向性 · 特征）</em><br>
    <span>三条线并列，不是先后阶段；注意属状态，能力/气质/性格属特征</span>
  </div>

  <h3>（2）七大流派对比矩阵</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>流派</th><th>代表人物</th><th>研究对象 / 方法</th><th>一句话主张</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">构造主义</td><td>冯特、铁钦纳</td><td>意识经验；实验内省</td><td>分析意识的构成元素</td></tr>
      <tr><td class="k">机能主义</td><td>詹姆斯、杜威、安吉尔</td><td>意识的机能；内省 + 客观观察</td><td>意识是流动的，功能在于适应</td></tr>
      <tr><td class="k">行为主义</td><td>华生、斯金纳</td><td>可观察行为；实验</td><td>刺激—反应，环境塑造行为</td></tr>
      <tr><td class="k">格式塔</td><td>韦特海默、苛勒、考夫卡</td><td>知觉与思维；实验</td><td>整体大于部分之和</td></tr>
      <tr><td class="k">精神分析</td><td>弗洛伊德、荣格、阿德勒</td><td>无意识；临床个案</td><td>本能与早期经验决定人格</td></tr>
      <tr><td class="k">人本主义</td><td>马斯洛、罗杰斯</td><td>人的价值与潜能；现象学</td><td>自我实现与无条件积极关注</td></tr>
      <tr><td class="k">认知心理学</td><td>奈瑟、西蒙</td><td>认知过程；信息加工</td><td>心理是信息的输入—加工—输出</td></tr>
    </tbody>
  </table>

  <h3>（3）研究方法对比矩阵</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>方法</th><th>因果推断</th><th>优点</th><th>局限</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">观察法</td><td class="c">否</td><td>生态效度高，适合自然情境</td><td>难重复、难控制，易受观察者偏差影响</td></tr>
      <tr><td class="k">实验法</td><td class="c"><b>是</b></td><td>可操纵自变量、可重复、可推断因果</td><td>情境人为，生态效度较低</td></tr>
      <tr><td class="k">相关法</td><td class="c">否</td><td>可预测，适合伦理上不能操纵的变量</td><td>不能说明因果，受第三变量影响</td></tr>
      <tr><td class="k">个案法</td><td class="c">否</td><td>深入，适合特殊样本与罕见现象</td><td>样本少，难推广</td></tr>
      <tr><td class="k">测验法</td><td class="c">否</td><td>标准化、可量化、可团体施测</td><td>依赖工具的信效度与常模</td></tr>
      <tr><td class="k">调查法</td><td class="c">否</td><td>大样本、效率高</td><td>依赖样本代表性与自报真实性</td></tr>
    </tbody>
  </table>

  <h3>（4）科学心理学诞生的三条源流</h3>
  <p class="def"><b>源流</b>哲学（笛卡尔、洛克、联想主义）→ 生理学（缪勒、赫尔姆霍兹、韦伯、费希纳）→ 实验心理学（冯特 1879）。</p>

  <div class="note">
    <b>易错：</b>① 注意属心理状态，不属认知过程。② 需要/动机属个性倾向性，能力/气质/性格属个性心理特征。
    ③ 实验法的标志是“主动操纵自变量”，不是“有对照组”。④ 相关高 ≠ 因果。
  </div>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">方法学证据 + 学科史事件</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>事件 / 研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">冯特（1879）莱比锡实验室</td><td>—（学科建制事件）→ 学科独立</td><td>第一个心理学实验室建立，标志科学心理学诞生</td></tr>
      <tr><td class="k">费希纳（1860）心理物理学</td><td>刺激强度 → 感觉量</td><td>感觉量与刺激强度的对数成正比 → 心理现象可量化</td></tr>
      <tr><td class="k">华生 &amp; 雷纳（1920）小阿尔伯特</td><td>白鼠与巨响配对 → 恐惧反应</td><td>恐惧可经经典条件作用习得并泛化 → 行为主义纲领</td></tr>

    </tbody>

<template id="doc-psy-02" data-subject="psy"><div class="doc" data-title="心理和行为的生物学基础"><p class="lead">选择题的固定出题区。按“神经元—突触—脑区—学说”四级链条顺背，任何一级断了都会在选择题上丢分。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>神经元</b>神经系统的基本结构和功能单位，由胞体、树突、轴突和突触末梢构成，分感觉、运动、中间神经元。</p>
  <p class="def"><b>动作电位</b>神经元受阈上刺激时，膜电位发生的快速、可传导的倒转，遵循“全或无”定律，有不应用期。</p>
  <p class="def"><b>突触</b>神经元之间相接触并传递信息的部位，由突触前膜、突触间隙和突触后膜构成。</p>
  <p class="def"><b>神经递质</b>突触前膜释放、作用于突触后膜受体、在神经元间传递信息的化学物质。</p>
  <p class="def"><b>中枢神经系统</b>由脑和脊髓构成，负责整合信息、发出指令。</p>
  <p class="def"><b>周围神经系统</b>包括躯体神经系统（随意运动与感觉传入）和自主神经系统（交感与副交感，调节内脏活动）。</p>
  <p class="def"><b>大脑皮层</b>覆盖大脑半球表面的灰质，分额、顶、枕、颞四叶，是心理活动的高级中枢。</p>
  <p class="def"><b>联合区</b>皮层上不直接承担感觉或运动功能、负责信息整合的区域，如额叶联合区。</p>
  <p class="def"><b>布洛卡区</b>位于额下回后部，损伤导致表达性失语（能理解，说不出流畅的话）。</p>
  <p class="def"><b>威尔尼克区</b>位于颞上回后部，损伤导致接受性失语（说话流畅但无意义，听不懂别人的话）。</p>
  <p class="def"><b>裂脑</b>切断胼胝体使两半球信息交流中断，用于研究大脑功能一侧化。</p>
  <p class="def"><b>脑机能定位说</b>主张特定心理功能定位于特定脑区；<b>整体说</b>主张皮层各部位等潜能，损伤面积比部位更重要。</p>
  <p class="def"><b>机能系统说</b>鲁利亚提出，认为心理活动由三个机能系统协同完成；<b>模块说</b>主张认知由功能独立、信息封闭的模块构成。</p>
  <p class="def"><b>内分泌系统</b>由垂体、甲状腺、肾上腺、性腺等构成，通过激素经血液调节行为与情绪。</p>

<template id="doc-psy-03" data-subject="psy"><div class="doc" data-title="意识和注意"><p class="lead">注意的理论谱系是简答常客，注意品质是送分题。睡眠阶段、特征整合、双耳分听三块几乎年年以选择题出现。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>意识</b>个体对其内外环境的觉知；包含觉醒状态与意识内容两方面。</p>
  <p class="def"><b>注意</b>心理活动或意识对一定对象的<b>指向</b>和<b>集中</b>（两个基本特征）。</p>
  <p class="def"><b>不随意注意</b>无预定目的、不需意志努力的注意。</p>
  <p class="def"><b>随意注意</b>有预定目的、需意志努力的注意。</p>
  <p class="def"><b>随意后注意</b>有预定目的但不需意志努力的注意，由随意注意发展而来。</p>
  <p class="def"><b>选择性注意</b>同时呈现两种或多种刺激时，选择其一进行加工。</p>
  <p class="def"><b>分配性注意</b>同时把注意指向不同的对象或活动。</p>
  <p class="def"><b>自动化加工</b>无意识、不占用认知资源、难以控制的加工；<b>控制加工</b>有意识、需资源、可灵活控制。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">谱系必须一条不漏</span></div>

  <h3>（1）注意的认知理论谱系（本章核心）</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>模型（代表人，年份）</th><th>核心主张</th><th>选择位置</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">过滤器模型<br>Broadbent, 1958</td><td>单通道、<b>全或无</b>；未选通道被完全阻断</td><td>早期（知觉前）</td></tr>
      <tr><td class="k">衰减模型<br>Treisman, 1960/1964</td><td><b>衰减器</b>而非开关；未选通道被衰减但仍有阈下激活，可解释自己名字被觉察</td><td>早期</td></tr>
      <tr><td class="k">反应选择模型<br>Deutsch &amp; Deutsch, 1963；Norman, 1968</td><td>所有输入均获充分加工，选择发生在反应阶段</td><td>晚期</td></tr>
      <tr><td class="k">多阶段选择模型<br>Johnston &amp; Heinz, 1978</td><td>选择位置随任务需要而变，并非固定于某一阶段</td><td>灵活</td></tr>
      <tr><td class="k">资源分配理论<br>Kahneman, 1973</td><td>注意是<b>有限容量资源</b>；分配受唤醒水平、任务难度、倾向影响</td><td>—</td></tr>
      <tr><td class="k">知觉负载理论<br>Lavie, 1995</td><td>知觉负载高 → 早期选择；负载低 → 晚期选择</td><td>依负载</td></tr>
    </tbody>
  </table>

  <h3>（2）双加工</h3>
  <p class="def"><b>自动化加工</b>（Schneider &amp; Shiffrin, 1977）经大量练习而形成，不占资源、难以抑制；<b>控制加工</b>需注意参与、可灵活调整。</p>

  <h3>（3）注意的三种功能</h3>
  <ul class="mini">
    <li><b>选择</b>从众多信息中选取相关输入</li>
    <li><b>分配与整合</b>在多项任务间调配资源、整合特征</li>
    <li><b>维持</b>持续性注意（ vigilance ）</li>
  </ul>

  <h3>（4）睡眠阶段（脑电特征）</h3>
  <table class="tbl">
    
    <tbody>
      <tr><td class="k">1 期</td><td>θ 波为主，浅睡、易唤醒</td></tr>
      <tr><td class="k">2 期</td><td>睡眠纺锤波 + K 复合波</td></tr>
      <tr><td class="k">3 / 4 期</td><td>δ 波（慢波睡眠），深睡、生长激素分泌</td></tr>
      <tr><td class="k">REM</td><td>快速眼动，肌电极低，脑电近似清醒，与梦相关</td></tr>
    </tbody>
  </table>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">争论点在此</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>实验（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Cherry（1953）双耳分听</td><td>追随耳 / 非追随耳 → 可报告的内容</td><td>非追随耳只能报告物理特征 → 支持<b>早期选择</b></td></tr>
      <tr><td class="k">Moray（1959）鸡尾酒会效应</td><td>非追随耳是否含自己名字 → 觉察率</td><td>非追随耳仍进行语义加工 → 支持<b>衰减模型</b></td></tr>
      <tr><td class="k">Gray &amp; Wedderburn（1960）"Dear Aunt Jane"</td><td>材料组织方式（按耳 / 按意义）→ 报告内容</td><td>被试按意义跟随 → 反驳纯过滤器，支持晚期选择</td></tr>
      <tr><td class="k">Treisman &amp; Gelade（1980）视觉搜索</td><td>搜索类型（特征 / 联合）、项目数 → RT 斜率</td><td>特征搜索近平行（斜率≈0），联合搜索系列（斜率＞0）→ 特征整合理论</td></tr>
      <tr><td class="k">Schneider &amp; Shiffrin（1977）变式一致性任务</td><td>练习量、映射一致性 → 正确率与资源占用</td><td>一致映射经练习可自动化，不再占用资源</td></tr>
    </tbody>
  </table>

<article class="pt">
    <div class="pt-head"><span class="pid">C3-1</span><h3>注意的品质</h3><span class="stars">★★★</span></div>
    <p><b>广度</b>：同一时间能清楚把握的对象数量。<b>稳定性</b>：注意在一段时间内保持在同一对象上；与之相反的是注意分散（分心，被动）。<b>分配</b>：同时指向不同对象，条件是一活动已熟练、活动间有联系。<b>转移</b>：主动把注意从一个对象换到另一个。</p>
    <p class="tip"><b>易错</b>四个品质的情境极易互混，抓三个字：<b>一个对象</b>（稳定性）、<b>多个对象</b>（分配）、<b>换对象</b>（转移）。分心被动，转移主动。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C3-2</span><h3>意识的功能与状态</h3><span class="stars">★★</span></div>
    <p>功能三条：限制与选择（过滤信息）、维持与整合、计划与监控。状态谱系：清醒、睡眠（含梦）、催眠、白日梦、药物所致状态。睡眠是意识的正常变异状态，不是“意识丧失”。</p>
    <p class="tip"><b>易错</b>催眠不是睡眠；睡眠不是无意识，而是意识状态的改变。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C3-3</span><h3>无意识现象三例</h3><span class="stars">★★</span></div>
    <p><b>盲视</b>：枕叶损伤者自称看不见，却能判断刺激位置或方向。<b>阈下知觉</b>：低于阈限的刺激仍影响后续判断（启动效应），但效应微弱。<b>自动化加工</b>：Stroop 效应中读字自动化干扰颜色命名。</p>
    <p class="tip"><b>易错</b>盲视是“皮层盲”病人的现象；阈下知觉的效应不能夸大。</p>
  </article><h3 class="sec"><span>三</span>易混辨析</h3>
<p class="secnote">遮住后两列自测：能说出判别标准，才算真会。</p>
<table class="tbl">
    
    <thead>
      <tr><th>概念组</th><th>判别标准</th><th>考点陷阱</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="k"><span class="ck">□</span>不随意 / 随意 / 随意后注意</td>
        <td>两个维度：<b>有无预定目的</b>、<b>需否意志努力</b>。不随意=无目的+不需努力；随意=有目的+需努力；随意后=有目的+不需努力</td>
        <td>随意后注意不是"不注意"，而是<b>不需意志努力</b>（熟练后的沉浸状态）</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>选择性 / 分配性 / 持续性注意</td>
        <td>选择=从多到一；分配=同时指向不同对象；持续=长时间维持（警觉）</td>
        <td>注意的<b>转移</b>是主动换对象，<b>分心</b>是被动被拉走 —— 别都写"注意力不集中"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>过滤器模型 / 衰减模型</td>
        <td>看未选通道是"<b>全被阻断</b>"（Broadbent，全或无）还是"<b>被衰减但仍可加工</b>"（Treisman，衰减器）</td>
        <td>自己名字被听见（鸡尾酒会效应）= 支持<b>衰减模型</b>，不是过滤器模型</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>早期选择 / 晚期选择</td>
        <td>选择发生在<b>知觉之前</b>还是<b>反应之前</b>。早期：Cherry 双耳分听（非追随耳只报告物理特征）；晚期：Moray、Gray &amp; Wedderburn</td>
        <td>"Dear Aunt Jane"实验被试<b>按意义</b>跨耳跟随 → 反驳纯过滤器，支持晚期</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>反应选择 / 多阶段选择模型</td>
        <td>晚期选择=位置<b>固定</b>在反应阶段（Deutsch &amp; Deutsch、Norman）；多阶段=位置<b>随任务而变</b>（Johnston &amp; Heinz）</td>
        <td>题干出现"随任务需要而变化"→ 多阶段选择模型</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>资源分配 / 知觉负载理论</td>
        <td>Kahneman=有限资源 + 分配策略（受唤醒、难度、倾向影响）；Lavie=选择位置由<b>知觉负载</b>决定</td>
        <td>Lavie 的规律：<b>高负载→早期选择，低负载→晚期选择</b>（容易记反）</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>自动化加工 / 控制加工</td>
        <td>看是否<b>占用认知资源、能否随意控制</b>：自动化=无意识、不占资源、难以抑制；控制=有意识、耗资源、可调整</td>
        <td>自动化由大量<b>一致映射</b>练习形成（Schneider &amp; Shiffrin）；变式任务难以自动化</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>特征搜索 / 联合搜索</td>
        <td>看<b>RT 随项目数的斜率</b>：特征搜索近平行（斜率≈0）；联合搜索系列（斜率&gt;0）</td>
        <td>Treisman &amp; Gelade 的结论是<b>特征整合理论</b>：特征是"平行"加工的，整合需要注意力参与</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>注意的广度 / 记忆广度</td>
        <td>注意广度=一瞬间能把握的对象数（1/10 秒内成人约 8–9 个圆点、4–6 个字母）；记忆广度=7±2 组块</td>
        <td>两个数字<b>不要互换</b>；注意广度考的是"同时把握"，不是"记住多少"</td>
      </tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-04" data-subject="psy"><div class="doc" data-title="感觉"><p class="lead">韦伯、费希纳、信号检测论三块要会算；视觉生理（感受野、侧抑制、马赫带）是近年细考点，别只背色觉与听觉理论。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>感觉</b>客观事物直接作用于感觉器官，人脑对其个别属性的反映。</p>
  <p class="def"><b>感受性</b>感觉器官对适宜刺激的感觉能力；与感觉阈限成反比。</p>
  <p class="def"><b>绝对阈限</b>刚能引起感觉的最小刺激量；<b>差别阈限</b>刚能引起差别感觉的最小刺激变化量（JND）。</p>
  <p class="def"><b>韦伯定律</b>ΔI／I＝K，差别阈限与原刺激强度成恒定比例，仅适用于中等强度刺激。</p>
  <p class="def"><b>费希纳定律</b>S＝K lg I，感觉量与刺激强度的对数成正比，由 JND 累积推得。</p>
  <p class="def"><b>感觉适应</b>同一刺激持续作用下感受性发生变化：暗适应感受性升高，明适应感受性降低。</p>
  <p class="def"><b>感觉对比</b>同时或继时的不同刺激相互作用，使感受性发生变化。</p>
  <p class="def"><b>后像</b>刺激停止作用后保留的感觉印象；正后像与原刺激同质，负后像为补色。</p>
  <p class="def"><b>联觉</b>一种感觉兼有另一种感觉的心理现象，如红色引起温暖感。</p>
  <p class="def"><b>信号检测论</b>用 d′ 表示辨别力、β 表示判断标准，把感受性与反应偏向分离开来。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">规律 / 系统 / 理论</span></div>

  <h3>（1）感觉的一般规律</h3>
  <ul class="mini">
    <li><b>感受性与阈限</b>成反比：绝对感受性＝1／绝对阈限。</li>
    <li><b>韦伯定律</b>中等强度成立；<b>费希纳定律</b>由 JND 累积，呈对数关系。</li>
    <li><b>适应</b>：暗适应感受性升高（视杆，约 30–40 min）；明适应降低（视锥，约 1 min）。</li>
    <li><b>对比</b>分同时对比与继时对比；<b>后像</b>分正后像与负后像；<b>联觉</b>是跨通道的。</li>
  </ul>

  <h3>（2）视觉：两类感受器与五种现象</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>维度</th><th>视杆细胞</th><th>视锥细胞</th><th>对应现象</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">数量 / 分布</td><td>约 1.2 亿，中央凹以外</td><td>约 600 万，中央凹密集</td><td>中央凹视敏度最高</td></tr>
      <tr><td class="k">功能</td><td>暗视、无色、低锐度</td><td>明视、色觉、高锐度</td><td>暗适应靠视杆，明适应靠视锥</td></tr>
      <tr><td class="k">敏感曲线</td><td>峰值约 505 nm</td><td>峰值约 555 nm</td><td><b>普肯耶现象</b>：暗适应时峰值蓝移</td></tr>
      <tr><td class="k">后像</td><td>—</td><td>—</td><td>正后像同质；负后像为补色</td></tr>
      <tr><td class="k">时间特性</td><td>—</td><td>—</td><td>闪光融合：频率升高至临界值即知觉为连续</td></tr>
    </tbody>
  </table>

  <h3>（3）色觉理论</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>理论</th><th>核心主张</th><th>能解释</th><th>困难</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">三色说</td><td>视网膜有三种感受器，分别对红、绿、蓝敏感</td><td>三原色混合、色光相加</td><td>难解释红绿色盲成对出现、负后像</td></tr>
      <tr><td class="k">对立过程说</td><td>视觉系统存在红—绿、黄—蓝、黑—白三对拮抗过程</td><td>负后像、颜色对比、色盲成对</td><td>难解释三原色混合规律</td></tr>
    </tbody>
  </table>

  <h3>（4）听觉理论</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>理论</th><th>核心主张</th><th>适用频段</th><th>局限</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">频率理论</td><td>基底膜振动频率与声波频率一致</td><td>低频（＜1000 Hz）</td><td>高频超出神经元放电上限</td></tr>
      <tr><td class="k">共鸣说</td><td>基底膜不同纤维对不同频率共鸣</td><td>中频</td><td>基底膜纤维难以独立振动</td></tr>
      <tr><td class="k">行波说</td><td>声波在基底膜形成行波，最大振幅部位随频率而变</td><td>全频段</td><td>低频定位不够精确</td></tr>
      <tr><td class="k">排放说</td><td>神经冲动的排放（齐射）模式编码频率</td><td>中低频</td><td>高频仍受限</td></tr>
    </tbody>
  </table>

  <div class="note">
    <b>易错：</b>① 暗适应是感受性<b>升高</b>，明适应是<b>降低</b>，方向最易记反。② 负后像是补色，不是原色。
    ③ 马赫带由<b>侧抑制</b>造成，不是错觉。④ 韦伯定律只在中等强度成立。⑤ 嗅觉是唯一不经丘脑中继的感觉。
  </div>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">经典实验与定律</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Weber（1834）重量辨别</td><td>标准刺激重量 → 最小可觉差</td><td>ΔI／I 近似恒定 → <b>韦伯定律</b></td></tr>
      <tr><td class="k">Fechner（1860）心理物理学</td><td>刺激强度 → 感觉量</td><td>感觉量与刺激对数成正比 → <b>费希纳定律</b></td></tr>
      <tr><td class="k">Békésy（1960）基底膜行波</td><td>声频 → 基底膜最大振幅位置</td><td>高频在蜗底、低频在蜗顶 → <b>行波说</b></td></tr>
      <tr><td class="k">Melzack &amp; Wall（1965）闸门控制</td><td>粗 / 细纤维活动 → 痛觉报告</td><td>粗纤维关闭闸门、细纤维开放 → <b>闸门说</b></td></tr>
      <tr><td class="k">Tanner &amp; Swets（1954）信号检测</td><td>信号有无 × 判断标准 → 击中 / 虚报率</td><td>d′ 与 β 可分离 → <b>信号检测论</b></td></tr>
    </tbody>
  </table>
<h3 class="sec"><span>二</span>易混辨析</h3>
<p class="secnote">遮住后两列自测：能说出判别标准，才算真会。</p>
<table class="tbl">
    
    <tbody>
      <tr>
        <td class="k"><span class="ck">□</span>感觉适应 / 感觉对比 / 联觉</td>
        <td>适应=刺激<b>持续作用</b>下感受性变化；对比=<b>同时或继时</b>刺激相互作用使感受性变化；联觉=<b>一种感觉引起另一种感觉</b>（红色温暖）</td>
        <td>适应与对比都涉及感受性变化，区别在"持续作用"还是"两个刺激相互作用"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>暗适应 / 明适应</td>
        <td>暗适应=<b>感受性提高</b>（视杆为主，约 30–40 分钟完成）；明适应=<b>感受性降低</b>（视锥为主，很快，约 1 分钟）</td>
        <td>方向记反是最高频错误：<b>暗环境→感受性升高</b>；时间上暗适应远长于明适应</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>d′ / β</td>
        <td>d′=<b>辨别力</b>（感受性，由刺激强度与机体状态决定）；β=<b>判断标准</b>（反应偏向，受先验概率、奖惩、动机影响）</td>
        <td>"增加对正确命中的奖励"→只改变 <em>β</em>，<b>d′ 不变</b>。改动 d′ 必须改刺激或机体条件</td>
      </tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-05" data-subject="psy"><div class="doc" data-title="知觉"><p class="lead">特性、深度线索、似动、错觉四块最稳。实验与结论的配对（视觉悬崖、走廊实验、φ 现象）是选择题的富矿。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>知觉</b>客观事物直接作用于感觉器官，人脑对其整体属性的反映，即对感觉信息的组织和解释。</p>
  <p class="def"><b>知觉恒常性</b>知觉条件在一定范围内变化时，知觉映象保持相对不变的特性（大小、形状、明度、颜色恒常性）。</p>
  <p class="def"><b>深度知觉</b>对物体距离及三维空间的知觉。</p>
  <p class="def"><b>似动</b>在一定时空条件下，静止的物体被知觉为运动。</p>
  <p class="def"><b>错觉</b>在特定条件下对客观事物必然产生的、有固定倾向的歪曲知觉。</p>
  <p class="def"><b>自下而上加工</b>由刺激本身的信息（数据）驱动的加工；<b>自上而下加工</b>由已有知识经验（概念）驱动的加工。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">矩阵 / 清单</span></div>

  <h3>（1）知觉四大特性（每个配一句解释 + 一个例子）</h3>
  <ul class="mini">
    <li><b>整体性</b>知觉对象由不同属性构成，人按整体组织它</li>
    <li><b>选择性</b>把某些对象当作知觉对象，其余作为背景</li>
    <li><b>理解性</b>以过去经验给对象赋予意义、用词标示</li>
    <li><b>恒常性</b>条件变化时映象相对稳定</li>
  </ul>

  <h3>（2）知觉组织原则（格式塔）</h3>
  <p class="def"><b>七原则</b>邻近性、相似性、连续性、闭合性、简单性、对称性、共同命运；另有<b>图形—背景分离</b>。</p>

  <h3>（3）深度知觉线索</h3>
  <table class="tbl">
    
    <thead><tr><th>类别</th><th>线索</th></tr></thead>
    <tbody>
      <tr><td class="k">肌肉线索</td><td>调节、辐合</td></tr>
      <tr><td class="k">单眼线索</td><td>遮挡、线条透视、空气透视、纹理梯度、相对高度、相对大小、运动视差</td></tr>
      <tr><td class="k">双眼线索</td><td><b>双眼视差</b>（最重要的深度线索）</td></tr>
    </tbody>
  </table>

  <h3>（4）模式识别理论</h3>
  <p class="def"><b>三说</b>模板说、原型说（Rosch）、特征说。</p>

  <h3>（5）知觉的两派理论</h3>
  <table class="tbl">
    
    <tbody>
      <tr><td class="k">直接知觉论<br>Gibson</td><td>刺激本身含充足信息，知觉无需内部表征；生态光学、"不变量"</td></tr>
      <tr><td class="k">间接知觉论<br>Gregory</td><td>知觉是假设检验过程，依赖内部表征与过去经验</td></tr>
    </tbody>
  </table>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">实验 + 变量 + 结论</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>实验（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Walk &amp; Gibson（1961）视觉悬崖</td><td>深度（浅滩 / 悬崖）、月龄 → 心率与回避行为</td><td>会爬婴儿已具深度知觉 → 有先天成分，经验使其精确化</td></tr>
      <tr><td class="k">Holway &amp; Boring（1941）走廊实验</td><td>深度线索多寡 → 知觉大小与视角</td><td>线索减少 → 恒常性下降、趋向视网膜大小 → 恒常性依赖线索</td></tr>
      <tr><td class="k">Segall 等（1966）跨文化错觉</td><td>文化环境 → 缪勒—莱耶错觉量</td><td>错觉量存在文化差异 → 经验参与（常性误用说 / 透视说）</td></tr>
      <tr><td class="k">Wertheimer（1912）φ 现象</td><td>两刺激时间间隔 → 似动报告</td><td>整体大于部分之和 → 格式塔心理学起点</td></tr>
      <tr><td class="k">Warren（1970）音素恢复效应</td><td>句子上下文 → 报告的音素</td><td>上下文补全缺失音素 → <b>自上而下加工</b></td></tr>
      <tr><td class="k">Hubel &amp; Wiesel 皮层单细胞记录</td><td>刺激朝向 → 细胞放电频率</td><td>存在特征检测器 → <b>自下而上加工</b></td></tr>
    </tbody>
  </table>
<h3 class="sec"><span>二</span>框架之外的 3 个漏点</h3>
<p class="secnote">这些点不在上面的三层框架里，是诊断手册单独补的；编号沿用诊断手册的 C 编号，方便回查。</p>
<article class="pt">
    <div class="pt-head"><span class="pid">C5-1</span><h3>时间知觉</h3><span class="stars">★★★</span></div>
    <p>对事物延续性与顺序性的反映，没有专门感受器。依据：外部标尺（钟表、昼夜）与内部节律（生物钟、心跳、呼吸）。影响因素：活动内容、情绪、年龄、药物与体温。理论：生物钟说、注意闸门模型、起搏器—累加器模型。</p>
    <p class="tip"><b>易错</b>最经典送分/送命点：<b>活动充实有趣时，当时觉得快，回忆时觉得长</b>；空虚枯燥时相反。两个方向必须分开写。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C5-2</span><h3>方位知觉：听觉方位</h3><span class="stars">★★</span></div>
    <p>视觉方位依赖环境参照与重力线索，倒置视野实验说明经验的作用。听觉方位主要靠双耳线索：<b>时间差</b>（低频更有效）、<b>强度差</b>（高频更有效，因头部遮蔽）、相位差；垂直方向定位较差。</p>
    <p class="tip"><b>易错</b>时间差对低频有效、强度差对高频有效——这一对最容易被互换。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C5-3</span><h3>真动知觉与运动线索</h3><span class="stars">★★</span></div>
    <p>真动知觉需区分视网膜运动信号与眼动信号：眼球追踪运动物体时视网膜像相对稳定，仍能知觉到运动，说明存在运动信号的抵消机制（Helmholtz 流出说）。运动线索：视网膜运动、相对运动、运动透视。</p>
    <p class="tip"><b>易错</b>似动是“无实际位移却知觉到运动”，真动是“有实际位移”，机制不同。</p>
  </article><h3 class="sec"><span>三</span>易混辨析</h3>
<p class="secnote">遮住后两列自测：能说出判别标准，才算真会。</p>
<table class="tbl">
    
    <thead>
      <tr><th>概念组</th><th>判别标准</th><th>考点陷阱</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="k"><span class="ck">□</span>感觉 / 知觉</td>
        <td>感觉=对<b>个别属性</b>的反映、单一通道；知觉=对<b>整体属性</b>的反映、多通道整合并加以解释</td>
        <td>知觉 = 感觉信息的<b>组织与解释</b>，不是"感觉的总和"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>绝对阈限 / 差别阈限</td>
        <td>绝对=刚能引起的<b>最小刺激量</b>；差别=刚能察觉的<b>最小变化量</b>（JND）</td>
        <td>感受性与阈限<b>成反比</b>（绝对感受性=1/绝对阈限）</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>韦伯定律 / 费希纳定律</td>
        <td>韦伯=ΔI/I = K（<b>恒定比例</b>）；费希纳=S = K lg I（<b>对数关系</b>，由 JND 累积而来）</td>
        <td>韦伯定律只在<b>中等强度</b>刺激下成立；过弱过强都不成立</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>恒常性 / 错觉</td>
        <td>恒常性=条件变化时映象<b>保持稳定</b>（正确反映）；错觉=必然产生的<b>歪曲</b>知觉</td>
        <td>"常性误用说"用恒常性<b>解释</b>错觉（如月亮错觉），不等于"恒常性失效"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>整体性 / 理解性</td>
        <td>整体性=把部分组织成整体（格式塔组织原则，有先天成分）；理解性=用过去经验<b>赋予意义</b>、可用词标示</td>
        <td>写"两者都依赖经验"会失分 —— 整体性更强调<b>组织</b>而非经验</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>自下而上 / 自上而下</td>
        <td>自下=由<b>刺激数据</b>驱动；自上=由<b>知识概念</b>驱动</td>
        <td>证据配错是常见丢分：音素恢复效应（Warren）=自上；特征检测器（Hubel &amp; Wiesel）=自下</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>肌肉线索 / 单眼 / 双眼</td>
        <td>调节、辐合都属于<b>肌肉线索</b>；其中<b>调节是单眼、辐合是双眼</b>；双眼视差属于双眼线索</td>
        <td>辐合的归属最容易错 —— 它是"双眼的肌肉线索"，不是普通单眼线索</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>单眼线索各成员</td>
        <td>遮挡、线条透视、空气透视、纹理梯度、相对高度、相对大小、运动视差</td>
        <td><b>双眼视差</b>是最重要的深度线索，但它属双眼线索 —— 别列进单眼清单</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>四种似动</td>
        <td>动景运动（两静止刺激相继呈现，φ 现象）；诱发运动（静止物因他物运动而似动，如月亮穿云）；自主运动（暗室光点游动）；运动后效（瀑布效应，反向运动）</td>
        <td>四种名称与实例的配对是高频选择题；<b>φ 现象属动景运动</b></td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>直接知觉 / 间接知觉</td>
        <td>Gibson=刺激<b>信息充足</b>，无需内部表征（生态光学）；Gregory=知觉是<b>假设检验</b>，需内部表征与经验</td>
        <td>间接知觉的思想源头是 Helmholtz 的<b>无意识推理</b>；不要与"自上而下"完全等同</td>
      </tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-06" data-subject="psy"><div class="doc" data-title="记忆"><p class="lead">全册最高频的一章：三系统对比、遗忘理论、工作记忆、内隐记忆，四件事都能独立出简答，也常合起来出综合题。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>记忆</b>人脑对过去经验的保持和再现；信息加工观点：人脑对外界输入信息进行编码、存储和提取的过程。</p>
  <p class="def"><b>感觉记忆</b>（瞬时记忆）客观刺激停止作用后，信息在感觉通道内短暂保留的记忆，保持时间极短（0.25–2 s），以感觉后像形式存在。</p>
  <p class="def"><b>短时记忆</b>信息保持时间较短（约 5 s–1 min）、容量有限（7±2 个组块）的记忆。</p>
  <p class="def"><b>长时记忆</b>信息保持时间在 1 min 以上乃至终身的记忆。</p>
  <p class="def"><b>组块</b>把若干小单位联合成较大单位的信息加工过程；组块是短时记忆容量的单位。</p>
  <p class="def"><b>内隐记忆</b>在不需要意识参与、或有意识回忆的情况下，个体经验自动对当前任务产生影响而表现出来的记忆。</p>
  <p class="def"><b>外显记忆</b>需要有意识参与、对先前经验进行有意识提取的记忆。</p>
  <p class="def"><b>系列位置效应</b>材料在序列中的位置影响记忆效果的现象，包括首因效应与近因效应。</p>
  <p class="def"><b>遗忘曲线</b>艾宾浩斯以无意义音节为材料发现：遗忘在学习后立即开始，进程先快后慢。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">谱系 / 矩阵 / 成分</span></div>

  <h3>（1）记忆三级加工模型（Atkinson &amp; Shiffrin, 1968）</h3>
  <div class="flow">
    感觉记忆 <em>—注意→</em> 短时记忆 <em>—复述→</em> 长时记忆<br>
    <span>控制过程：复述 · 编码 · 提取</span>
  </div>

  <h3>（2）三系统对比（默写重点）</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>维度</th><th>感觉记忆</th><th>短时记忆</th><th>长时记忆</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">保持时间</td><td>0.25–2 s</td><td>＜1 min</td><td>1 min – 终身</td></tr>
      <tr><td class="k">容量</td><td>大（部分报告法估计约 9–12 项以上）</td><td>7±2 组块</td><td>近乎无限</td></tr>
      <tr><td class="k">编码</td><td>视觉图像、声像（感觉后像）</td><td>以听觉言语编码（AVL）为主，兼有视觉</td><td>以语义编码为主，兼有视觉</td></tr>
      <tr><td class="k">提取</td><td>直接提取；部分报告法可测</td><td>完全系列扫描（Sternberg）</td><td>再认、回忆（需搜索）</td></tr>
      <tr><td class="k">遗忘</td><td>消退（后像消失）</td><td>干扰（前摄 / 倒摄）、消退</td><td>干扰、提取失败、编码缺失</td></tr>
    </tbody>
  </table>

  <h3>（3）工作记忆（Baddeley &amp; Hitch, 1974）</h3>
  <ul class="mini">
    <li><b>中央执行系统</b>：注意控制、资源分配（容量有限，非存储成分）</li>
    <li><b>语音环路</b>：语音存储 + 发音复述</li>
    <li><b>视空间画板</b>：视觉与空间信息的暂存</li>
    <li><b>情景缓冲器</b>（2000 年后增补）：整合多通道信息，与长时记忆相连</li>
  </ul>

  <h3>（4）遗忘理论五说</h3>
  <ul class="mini">
    <li><b>衰退说</b>记忆痕迹随时间自然消退</li>
    <li><b>干扰说</b>前摄抑制（先学干扰后学）/ 倒摄抑制（后学干扰先学）</li>
    <li><b>压抑说</b>动机性遗忘，情绪或动机压抑了回忆</li>
    <li><b>提取失败说</b>信息仍在，是线索不足（舌尖现象）</li>
    <li><b>编码缺失说</b>信息从未被有效编码，谈不上遗忘</li>
  </ul>

  <h3>（5）长时记忆分类（Tulving）</h3>
  <ul class="mini">
    <li><b>情景记忆</b>个人经历，带时空情境</li>
    <li><b>语义记忆</b>一般知识与概念，不依附特定情境</li>
    <li><b>程序性记忆</b>"知道怎样做"，技能与操作</li>
  </ul>

  <h3>（6）内隐 / 外显记忆的分离逻辑</h3>
  <p class="def"><b>两条路径</b>任务分离（直接测验 vs 间接测验）；加工分离（Jacoby 的包含测验与排除测验）。</p>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">实验 + 变量 + 结论</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>实验（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Sperling（1960）全部 / 部分报告法</td><td>报告方式、延迟时间 → 正确回忆项目数</td><td>感觉记忆容量远大于 5 项，约 0.5 s 内迅速衰退</td></tr>
      <tr><td class="k">Miller（1956）记忆广度</td><td>材料类型 → 广度</td><td>短时记忆容量为 7±2 个<b>组块</b></td></tr>
      <tr><td class="k">Brown-Peterson（1958/1959）</td><td>分心保持时间（阻止复述）→ 回忆正确率</td><td>3 s 起即快速遗忘 → 短时记忆保持短暂，遗忘非仅由复述缺失导致</td></tr>
      <tr><td class="k">Sternberg（1966/1969）加法反应时</td><td>记忆集大小 → 反应时</td><td>RT 随集大小线性增加 → <b>完全系列扫描</b>（平行扫描应为水平线）</td></tr>
      <tr><td class="k">Warrington &amp; Weiskrantz（1968）遗忘症病人</td><td>测验类型（直接 / 间接）→ 成绩</td><td>直接测验受损、词干补笔正常 → 内隐与外显记忆可分离</td></tr>
      <tr><td class="k">Glanzer &amp; Cunitz（1966）延缓回忆</td><td>有无延缓 × 序列位置 → 回忆率</td><td>延缓后近因效应消失 → 近因来自短时记忆，首因来自长时记忆</td></tr>
      <tr><td class="k">Ebbinghaus（1885）节省法</td><td>间隔时间 → 节省率</td><td>遗忘进程先快后慢</td></tr>
    </tbody>
  </table>
<h3 class="sec"><span>二</span>框架之外的 4 个漏点</h3>
<p class="secnote">这些点不在上面的三层框架里，是诊断手册单独补的；编号沿用诊断手册的 C 编号，方便回查。</p>
<article class="pt">
    <div class="pt-head"><span class="pid">C6-1</span><h3>编码特异性与迁移适当加工</h3><span class="stars">★★★</span></div>
    <p>Tulving 编码特异性原则：提取效果取决于提取线索与编码时情境的匹配程度（潜水员在水下/岸上学词，同环境回忆更好）。Morris 迁移适当加工：若测验要求与编码时的加工类型一致（如都要求韵律判断），成绩更好——说明关键是<b>加工方式</b>而非环境本身。</p>
    <p class="tip"><b>易错</b>编码特异性强调“线索匹配”，迁移适当加工强调“加工类型匹配”，两者互补。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C6-2</span><h3>提取练习与测试效应</h3><span class="stars">★★</span></div>
    <p>测试效应：提取本身即学习，反复测试比反复阅读更能促进长期保持，并能减少“熟悉即掌握”的错觉。机制：提取努力增强编码、反馈修正错误。应用：间隔测试、低风险小测。</p>
    <p class="tip"><b>易错</b>测试效应说的是“提取”的作用，不是“重复阅读”；即时成绩可能不如重读，长期保持才占优。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C6-3</span><h3>错误记忆：DRM 范式</h3><span class="stars">★★</span></div>
    <p>呈现与关键诱饵高度关联的词表（床、休息、醒来……），不呈现“睡眠”，被试却高比例“记得”睡眠且信心很高。说明记忆是建构性的，语义关联可致虚假回忆；源检测失败与要点表征是主要解释。</p>
    <p class="tip"><b>易错</b>关键诱饵<b>从未呈现</b>——这是判断该范式的标志；它产生错误记忆，不是遗忘。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C6-4</span><h3>内隐记忆的两套理论解释</h3><span class="stars">★★</span></div>
    <p>多重记忆系统说：内隐与外显分属不同系统（程序性 vs 陈述性），脑机制不同，故可分离。加工说：不必假设系统，直接测验与间接测验要求的加工类型不同（概念驱动 vs 知觉驱动），匹配程度决定成绩。框架卡给了“任务分离/加工分离”的方法，这里补的是<b>对结果的解释之争</b>。</p>
    <p class="tip"><b>易错</b>“任务分离法”是方法，“系统说/加工说”是解释——方法与解释别混为一谈。</p>
  </article><h3 class="sec"><span>三</span>易混辨析</h3>
<p class="secnote">遮住后两列自测：能说出判别标准，才算真会。</p>
<table class="tbl">
    
    <thead>
      <tr><th>概念组（遮住右侧自测）</th><th>判别标准</th><th>考点陷阱</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="k"><span class="ck">□</span>感觉记忆 / 短时 / 长时</td>
        <td>看<b>编码方式</b>与保持时长：感觉=感觉后像（视觉为主，0.25–2 s）；短时=<b>听觉言语编码</b>为主，&lt;1 min；长时=语义编码为主，&gt;1 min</td>
        <td>短时记忆是"以听觉编码为主"，不是"只有听觉"；视觉编码也存在（Posner 字母实验）</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>前摄抑制 / 倒摄抑制</td>
        <td>看<b>干扰的时间方向</b>：前摄=先学干扰后学；倒摄=后学干扰先学</td>
        <td>题干"先学 A 再学 B，回忆 A 变差"→ <em>倒摄</em>；考场上最容易反着选</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>消退说 / 干扰说 / 提取失败说</td>
        <td>问信息是"痕迹消失"（随时间）、"被竞争压制"（前后学习）、还是"还在但取不出"（线索不足，舌尖现象）</td>
        <td>短时记忆遗忘兼有消退与干扰，别只答"消退"；布朗-彼得森范式说明的是"阻止复述即快速遗忘"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>内隐记忆 / 外显记忆</td>
        <td>看<b>提取时是否需要意识参与</b>：外显=有意回忆（自由回忆、再认）；内隐=无意影响（词干补笔、启动）</td>
        <td>内隐 ≠ 程序性记忆。前者是任务层面的操作性定义，后者是 Tulving 的内容分类</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>情景记忆 / 语义记忆</td>
        <td>看<b>是否依附特定时空情境</b>：情景=个人经历带情境；语义=一般知识不依附情境</td>
        <td>这是"内容"维度；与"陈述性 / 程序性"是另一维度，答题不要混用</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>再认 / 回忆</td>
        <td>看<b>原刺激是否呈现</b>：再认=有原刺激，只需判断；回忆=无原刺激，需主动搜索重建</td>
        <td>Sternberg 实验测的是短时记忆的<b>扫描方式</b>（完全系列扫描），不要答成"平行扫描"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>维持性复述 / 精细复述</td>
        <td>看<b>是否与已有知识建立联系</b>：维持性=机械重复，只保在短时记忆；精细=赋予意义、联系长时记忆</td>
        <td>进入长时记忆的关键是<b>精细复述</b>，不是"复述次数多"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>组块 / 编码</td>
        <td>组块是<b>容量单位</b>（把小单位联合成大单位）；编码是<b>信息转换形式</b>（形、音、义）</td>
        <td>Miller 的 7±2 指"组块数"，不是"信息量"；组块化提高的是有效容量</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>首因效应 / 近因效应</td>
        <td>看<b>位置与来源系统</b>：首因=序列开头、已进入长时记忆；近因=序列末尾、仍在短时记忆</td>
        <td>证据：Glanzer &amp; Cunitz 延缓回忆后<b>近因消失、首因保留</b></td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>工作记忆 / 短时记忆</td>
        <td>看有没有<b>加工成分</b>：短时记忆=容量有限的存储系统；工作记忆=存储同时进行加工的资源系统</td>
        <td>Baddeley 成分：中央执行 + 语音环路 + 视空间画板 + 情景缓冲器（2000 年后增补）</td>
      </tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-07" data-subject="psy"><div class="doc" data-title="思维"><p class="lead">概念结构与问题解决是简答主力；专家—新手、创造性适合做论述。策略与影响因素要能分点写全。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>思维</b>人脑对客观事物<b>概括的、间接的</b>反映，借助言语、表象或动作实现。</p>
  <p class="def"><b>概念</b>人脑对客观事物<b>本质特征</b>的反映。</p>
  <p class="def"><b>问题解决</b>由一定情境引起、按一定目标、应用各种认知操作使问题得以解决的过程。</p>
  <p class="def"><b>算法策略</b>在问题空间中逐一尝试所有可能操作（保证成功、费时）。</p>
  <p class="def"><b>启发式策略</b>凭经验在问题空间中只做少量搜索（省时、不保证成功）。</p>
  <p class="def"><b>功能固着</b>只看到物体的惯常功能，看不到其他可能用途。</p>
  <p class="def"><b>定势</b>由先前活动形成、影响当前问题解决的心理准备状态。</p>
  <p class="def"><b>创造性思维</b>以新颖独特的方式解决问题、产生前所未有的思维成果。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">阶段 / 策略 / 因素</span></div>

  <h3>（1）思维分类</h3>
  <p class="def"><b>按水平</b>直观动作思维 / 具体形象思维 / 抽象逻辑思维；<b>按方向</b>聚合思维 / 发散思维；<b>按创新程度</b>常规思维 / 创造性思维。</p>

  <h3>（2）概念形成的理论</h3>
  <ul class="mini">
    <li><b>假设检验说</b>（Bruner）概念形成是不断提出并检验假设的过程</li>
    <li><b>样例学习说</b>从具体样例中概括出概念</li>
    <li><b>原型说</b>（Rosch）以最典型样例（原型）为参照进行归类</li>
  </ul>

  <h3>（3）问题解决四阶段</h3>
  <div class="flow">
    发现问题 <em>→</em> 分析问题（明确条件与目标） <em>→</em> 提出假设 <em>→</em> 检验假设
  </div>

  <h3>（4）策略</h3>
  <ul class="mini">
    <li><b>算法</b>穷尽搜索，保证成功但费时</li>
    <li><b>启发式</b>手段—目的分析（Newell &amp; Simon）、逆向搜索、爬山法、类比迁移</li>
  </ul>

  <h3>（5）影响问题解决的因素</h3>
  <p class="def"><b>七因素</b>知识经验、问题表征方式、定势、功能固着、动机强度（耶克斯—多德森倒 U 形）、原型启发、情绪状态。</p>

  <h3>（6）创造性</h3>
  <p class="def"><b>发散思维三指标</b>（吉尔福特）流畅性、变通性、独特性；创造性需发散与辐合结合，并具特定人格特征。</p>

  <h3>（7）决策扩展 <span class="warn">⚠️ 非 312 核心，了解即可</span></h3>
  <p class="def"><b>两理论</b>期望效用理论 vs 前景理论（Kahneman &amp; Tversky：参照点、损失厌恶、框架效应）；<b>三启发式</b>代表性、可用性、锚定与调整。</p>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">障碍类实验必记</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>实验（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Maier（1931）两根绳问题</td><td>有无提示 → 是否解决</td><td>顿悟式解决 → 无意识重组</td></tr>
      <tr><td class="k">Duncker（1945）蜡烛问题</td><td>盒子是否可作容器 / 有无提示 → 解决率</td><td>功能固着阻碍问题解决</td></tr>
      <tr><td class="k">Luchins（1942）量水问题</td><td>先做同型题的数量 → 解法</td><td>定势导致解法僵化（Einstellung 效应）</td></tr>
      <tr><td class="k">Newell &amp; Simon（1972）通用问题解决者</td><td>搜索策略 → 步数与路径</td><td>手段—目的分析可模拟人类解题</td></tr>
      <tr><td class="k">Tversky &amp; Kahneman（1974）转盘锚定</td><td>随机锚值 → 估计值</td><td>锚定与调整启发式</td></tr>
    </tbody>
  </table>
<h3 class="sec"><span>二</span>框架之外的 3 个漏点</h3>
<p class="secnote">这些点不在上面的三层框架里，是诊断手册单独补的；编号沿用诊断手册的 C 编号，方便回查。</p>
<article class="pt">
    <div class="pt-head"><span class="pid">C7-1</span><h3>概念结构的四种模型</h3><span class="stars">★★★</span></div>
    <p><b>特征表说</b>：概念由定义性特征及组合规则构成，难解释典型性效应。<b>原型说</b>（Rosch）：以最典型样例表征，按相似度归类，能解释典型性效应与模糊边界。<b>样例说</b>：由多个具体样例表征。<b>层次网络模型</b>（Collins &amp; Quillian）：按上下位层次组织，解释范畴大小效应但难解释典型性效应。<b>激活扩散模型</b>（Collins &amp; Loftus）：节点连线、激活扩散，解释语义启动。</p>
    <p class="tip"><b>易错</b>典型性效应是原型说的“主场”、层次网络模型的“软肋”——这一对比几乎是必考判断点。注意“概念形成”与“概念结构”是两问，别答串。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C7-2</span><h3>专家—新手差异</h3><span class="stars">★★★</span></div>
    <p>专家有更多组块化知识、按<b>深层原理</b>表征问题（如按物理定律而非表面特征分类）、问题空间搜索更快、自我监控更强；新手依赖表面特征与手段—目的分析。</p>
    <p class="tip"><b>易错</b>专家的优势主要在“知识组织与表征”，不是“一般智力更高”——这是论述题的得分句。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C7-3</span><h3>表象的特征与心理旋转</h3><span class="stars">★★</span></div>
    <p>表象三特征：直观性、概括性、可操作性。Shepard &amp; Metzler 心理旋转实验：判断两三维图形是否相同，反应时随旋转角度<b>线性增加</b>，说明表象旋转是连续的心理过程，支持表象的计算—模拟观点。</p>
    <p class="tip"><b>易错</b>答题必须写出“角度—反应时”的线性函数关系，这是该实验的核心证据。</p>
  </article><h3 class="sec"><span>三</span>易混辨析</h3>
<p class="secnote">遮住后两列自测：能说出判别标准，才算真会。</p>
<table class="tbl">
    
    <thead>
      <tr><th>概念组</th><th>判别标准</th><th>考点陷阱</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="k"><span class="ck">□</span>算法 / 启发式</td>
        <td>看是否<b>穷尽搜索问题空间</b>：算法=逐一尝试，保证成功但费时；启发式=经验捷径，省时但不保证成功</td>
        <td>"保证成功"是算法的唯一标识；题干出现"效率高但可能失败"→启发式</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>定势 / 功能固着</td>
        <td>定势=先前活动形成的<b>心理准备状态</b>（影响策略选择，Luchins 量水问题）；功能固着=只看物体的<b>惯常功能</b>（Duncker 蜡烛问题）</td>

      </tr>

        <td>爬山法的缺陷：会停在<b>局部最高点</b>，看不到更优解</td>

<template id="doc-psy-08" data-subject="psy"><div class="doc" data-title="语言"><p class="lead">分值不高，但一旦考到就是整块。结构层级、言语理解、语言获得三节要齐，语言与思维的关系常做简答收尾。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>语言</b>以语音或文字为媒介、按一定规则组合、用于交际的符号系统，是社会现象。</p>
  <p class="def"><b>言语</b>个体运用语言进行交际的过程，是心理现象；语言与言语是工具与使用的关系。</p>
  <p class="def"><b>音位</b>能区别意义的最小语音单位，本身不表达意义。</p>
  <p class="def"><b>语素</b>最小的音义结合单位，是语言中最小的有意义单位。</p>
  <p class="def"><b>句法</b>组词成句的规则系统；<b>语义</b>语言符号所表达的意义。</p>
  <p class="def"><b>言语知觉</b>对语音信号的识别与理解，具有范畴性。</p>
  <p class="def"><b>范畴知觉</b>连续变化的语音参数被知觉为离散的音位类别，如 /b/ 与 /p/ 的边界效应。</p>
  <p class="def"><b>音位恢复效应</b>当语流中某个音位被替换或删除时，听者依据上下文“听到”了原本应有的音位（Warren, 1970）。</p>
  <p class="def"><b>词汇通达</b>从心理词典中提取词的语音与语义信息的过程。</p>
  <p class="def"><b>花园路径句</b>句法上存在暂时歧义、最初的分析被后续信息否定而需回退重析的句子。</p>
  <p class="def"><b>言语产生</b>从概念意图到发音执行的认知加工过程。</p>
  <p class="def"><b>舌尖现象（TOT）</b>确知某词、能提取其语义与部分语音信息，却暂时无法完整提取语音形式的状态。</p>
  <p class="def"><b>关键期</b>语言习得存在敏感期（约 2 岁至青春期前），此后习得显著困难（Lenneberg）。</p>
  <p class="def"><b>语言相对论</b>语言结构影响甚至决定思维与认知，即萨丕尔—沃尔夫假说；分强式（决定论）与弱式（影响论）。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">层级 / 加工 / 理论</span></div>

  <h3>（1）语言的结构层级（默写重点）</h3>
  <div class="flow">
    音位 → 语素 → 词 → 句子 → 篇章<br>
    <span>层级性 + 递归性：有限规则生成无限句子，是语言区别于其他沟通系统的核心特征</span>
  </div>

  <h3>（2）言语理解的四层</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>层级</th><th>加工内容</th><th>典型效应 / 现象</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">语音</td><td>音位识别与范畴化</td><td>范畴知觉、音位恢复效应、McGurk 效应</td></tr>
      <tr><td class="k">词汇</td><td>字形 / 语音 → 语义通达</td><td>词优效应、启动效应、频率效应</td></tr>
      <tr><td class="k">句子</td><td>句法分析、语义与语用整合</td><td>花园路径句、暂时歧义消解</td></tr>
      <tr><td class="k">篇章</td><td>推理、图式激活、情境模型建构</td><td>预期推理、情境模型更新</td></tr>
    </tbody>
  </table>

  <h3>（3）言语产生的三阶段（Levelt, 1989）</h3>
  <div class="flow">
    概念化 <em>（决定说什么）</em> → 公式化 <em>（选词 · 句法编码 · 音韵编码）</em> → 发音 <em>（执行）</em>
  </div>
  <p class="def"><b>证据</b>口误（提前、持续、互换）符合句法与音韵规则；舌尖现象说明语义已激活而语音未通达。</p>

  <h3>（4）语言获得的三种理论</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>理论</th><th>代表</th><th>核心主张</th><th>证据 / 局限</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">强化说</td><td>Skinner</td><td>语言通过模仿与强化习得</td><td>难解释快速习得与从未听过的新颖句</td></tr>
      <tr><td class="k">先天说</td><td>Chomsky</td><td>人具有语言获得装置与普遍语法</td><td>难解释语言差异与输入的作用</td></tr>
      <tr><td class="k">认知交互说</td><td>Piaget、Vygotsky</td><td>语言源于认知发展与社会互动</td><td>能解释个体差异，但机制较笼统</td></tr>
      <tr><td class="k">统计学习</td><td>Saffran 等</td><td>婴儿从语流中提取过渡概率来切分词</td><td>补充了“如何从输入中学习”的机制</td></tr>
    </tbody>
  </table>

  <h3>（5）语言与思维的三种立场</h3>
  <ul class="mini">
    <li><b>语言决定论</b>（萨丕尔—沃尔夫）：强式主张语言决定思维，弱式主张语言影响注意与分类。</li>
    <li><b>认知决定论</b>（Piaget）：认知发展先于语言，思维决定语言。</li>
    <li><b>相互建构</b>（Vygotsky）：语言与思维相互影响，语言是思维的工具。</li>
  </ul>

  <div class="note">
    <b>易错：</b>① 音位区别意义但本身无意义，语素才是音义结合。② 语言是社会现象，言语是个体活动。
    ③ McGurk 效应证明言语知觉是多通道整合。④ 语言相对论：强式证据不足，弱式有支持，不能一边倒。
  </div>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">知觉与习得证据</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Warren（1970）音位恢复</td><td>上下文是否合法 → 报告的音位</td><td>听者补全被替换的音位 → <b>自上而下加工</b></td></tr>
      <tr><td class="k">McGurk &amp; MacDonald（1976）</td><td>视觉发音（ba / ga）× 听觉音节 → 报告</td><td>视听冲突时报告第三个音（da）→ 言语知觉是<b>多通道整合</b></td></tr>
      <tr><td class="k">Levelt（1989）口误语料</td><td>错误类型分布 → 加工阶段</td><td>口误符合句法与音韵规则 → 言语产生按阶段串行加工</td></tr>
      <tr><td class="k">Lenneberg（1967）/ Genie 案例</td><td>接触语言的年龄 → 最终语言能力</td><td>青春期前未接触语言者句法习得严重受限 → <b>关键期</b></td></tr>
      <tr><td class="k">Saffran 等（1996）统计学习</td><td>音节间过渡概率 → 分词表现</td><td>8 个月婴儿可提取统计规律 → 统计学习参与语言获得</td></tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-09" data-subject="psy"><div class="doc" data-title="情绪和情感"><p class="lead">理论谱系必背，表情与情绪调节是选择题富矿。Lazarus 与沙赫特—辛格常被混为一谈，复习时要分开写。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>情绪</b>人对客观事物的态度体验及相应的行为反应，以个体的愿望和需要为中介。</p>
  <p class="def"><b>情绪三要素</b>主观体验、外部表现（表情）、生理唤醒。</p>
  <p class="def"><b>心境</b>较微弱、持久、具弥散性的情绪状态。</p>
  <p class="def"><b>激情</b>强烈的、爆发性的、短暂的情绪状态。</p>
  <p class="def"><b>应激</b>人对意外的紧急情况作出的适应性反应。</p>
  <p class="def"><b>表情</b>面部表情、姿态（身段）表情、言语（语调）表情。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">理论谱系是核心</span></div>

  <h3>（1）情绪状态分类</h3>
  <p class="def"><b>三类</b>心境（弥散持久）、激情（爆发短暂）、应激（紧急适应）—— 每类写一句场景描述。</p>

  <h3>（2）情绪维度理论</h3>
  <p class="def"><b>冯特三维度</b>愉快—不愉快、激动—平静、紧张—松弛；<b>Russell 环形模型</b>效价 × 唤醒。</p>

  <h3>（3）情绪理论谱系（一条都不能漏）</h3>
  <table class="tbl">
    
    <thead><tr><th>理论（代表人，年份）</th><th>核心主张</th></tr></thead>
    <tbody>
      <tr><td class="k">外周理论<br>James 1884 / Lange 1885</td><td>身体变化在先，情绪体验是身体变化的知觉（"因为哭所以悲"）</td></tr>
      <tr><td class="k">丘脑学说<br>Cannon 1927 / Bard 1934</td><td>刺激经丘脑同时传至皮层与内脏，体验与生理变化<b>同时</b>发生</td></tr>
      <tr><td class="k">二因素理论<br>Schachter &amp; Singer 1962</td><td>情绪 = 生理唤醒 + 对情境的<b>认知解释</b>（唤醒归因）</td></tr>
      <tr><td class="k">评价—兴奋说<br>Arnold 1960</td><td>刺激 → 对刺激的<b>评估</b> → 情绪</td></tr>
      <tr><td class="k">认知—评价理论<br>Lazarus 1966 / 1991</td><td>初级评价、次级评价、再评价；情绪依赖对事件意义的评价</td></tr>
      <tr><td class="k">面部反馈假说<br>Tomkins / Izard / Ekman</td><td>面部表情本身可调节、引发情绪体验</td></tr>
      <tr><td class="k">差异情绪理论<br>Izard</td><td>每种基本情绪有独特神经基础与表情模式</td></tr>
    </tbody>
  </table>

  <h3>（4）基本情绪</h3>
  <p class="def"><b>Ekman 六种</b>快乐、悲伤、愤怒、恐惧、厌恶、惊讶。</p>

  <h3>（5）情绪与认知的关系</h3>
  <p class="def"><b>双向</b>认知影响情绪（评价）；情绪影响认知（心境一致性记忆、情绪启动）。</p>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">Schachter 必背</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Schachter &amp; Singer（1962）肾上腺素实验</td><td>唤醒状态 × 情境解释（告知 / 未告知 / 安慰剂 × 欣快 / 愤怒同伴）→ 情绪自评与行为</td><td>仅有唤醒不足以产生具体情绪，须有认知解释 → 二因素理论</td></tr>
      <tr><td class="k">Cannon 交感神经切除动物</td><td>手术与否 → 情绪表现</td><td>内脏反馈缺失仍有情绪 → 反驳纯外周理论</td></tr>
      <tr><td class="k">Ekman &amp; Friesen 跨文化（Fore 人）</td><td>文化 × 表情与情境 → 识别率</td><td>基本情绪表情跨文化一致 → 有先天成分</td></tr>
      <tr><td class="k">Strack 等（1988）牙咬笔 / 唇咬笔</td><td>面部姿势 → 卡通趣味评分</td><td>面部反馈影响情绪体验</td></tr>
      <tr><td class="k">Dutton &amp; Aron（1974）吊桥实验</td><td>桥的唤醒程度（高 / 低）→ 事后联系率</td><td>唤醒被错误归因于吸引 <span class="warn">⚠️ 亦属社会心理学</span></td></tr>
    </tbody>
  </table>
<h3 class="sec"><span>二</span>框架之外的 3 个漏点</h3>
<p class="secnote">这些点不在上面的三层框架里，是诊断手册单独补的；编号沿用诊断手册的 C 编号，方便回查。</p>
<article class="pt">
    <div class="pt-head"><span class="pid">C9-1</span><h3>情绪的功能与情感分类</h3><span class="stars">★★★</span></div>
    <p>功能四条：适应（激发应对）、动机（驱动与组织行为）、组织（影响认知加工，如心境一致性）、信号（社会沟通）。情感分类：道德感（评价行为是否符合社会准则）、理智感（求知、好奇、怀疑）、美感（审美体验）。</p>
    <p class="tip"><b>易错</b>情绪状态按“强度与持续时间”分心境/激情/应激；情感按“内容”分道德/理智/美感。两套维度不能混列。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C9-2</span><h3>情绪的神经机制</h3><span class="stars">★★</span></div>
    <p>杏仁核：恐惧识别与情绪性学习（LeDoux 的低路/高路）；前额叶（尤其眶额皮层）：情绪调节与决策中的情绪信号（Damasio 躯体标记）；脑岛：内脏感受与厌恶；扣带回：情绪体验与冲突监控；伏隔核：奖赏。边缘系统是核心回路。</p>
    <p class="tip"><b>易错</b>杏仁核不只是“恐惧中枢”，它更多参与威胁检测与学习；恐惧体验还依赖皮层。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C9-3</span><h3>情绪智力</h3><span class="stars">★</span></div>
    <p>Mayer &amp; Salovey 四维：感知与表达情绪、情绪促进思维、理解与分析情绪、调节情绪。Goleman 推广为“情商”，学术测量多基于能力模型（MSCEIT）或混合模型（EQ-i）。</p>
    <p class="tip"><b>考法</b>多作选择题的一个选项，或论述“智力观演变”时的补充。</p>
  </article><h3 class="sec"><span>三</span>易混辨析</h3>
<p class="secnote">遮住后两列自测：能说出判别标准，才算真会。</p>
<table class="tbl">
    
    <thead>
      <tr><th>概念组</th><th>判别标准</th><th>考点陷阱</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="k"><span class="ck">□</span>情绪 / 情感</td>
        <td>情绪=与<b>生理需要</b>相联系、情境性强、短暂激烈、外显；情感=与<b>社会性需要</b>相联系、稳定深刻、内隐</td>
        <td>教材表述本身有争议。答题写"<b>情境性与稳定性之别</b>"，不要写"情绪低级、情感高级"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>心境 / 激情 / 应激</td>
        <td>看<b>强度与持续时间</b>：心境=微弱、持久、弥散；激情=强烈、爆发、短暂；应激=紧急情况下的适应性反应</td>
        <td>激情的特征之一是<b>认识范围缩小</b>；应激可能出现"知觉狭窄、行为紊乱"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>詹姆斯-兰格 / 坎农-巴德</td>
        <td>看<b>身体变化与情绪体验的先后</b>：J-L=身体变化在先，情绪是对身体变化的知觉；C-B=丘脑同时向皮层与内脏发放冲动，<b>体验与生理变化同时发生</b></td>
        <td>C-B 反驳 J-L 的理由有两条：内脏反应<b>太慢</b>、且<b>太笼统</b>，不足以区分不同情绪</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>二因素理论 / 评价理论</td>
        <td>Schachter-Singer=<b>生理唤醒 + 认知标签</b>（唤醒归因，唤醒是必要条件）；Arnold=<b>评估</b>直接产生情绪；Lazarus=<b>初级评价 + 次级评价 + 再评价</b></td>
        <td>Schachter 实验的关键组是<b>"未告知组"</b>：把药物引起的唤醒归因于情境，才产生相应情绪</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>面部反馈假说 / 詹姆斯-兰格</td>
        <td>面部反馈=仅<b>面部肌肉表情</b>即可调节或引发情绪体验（Strack 牙咬笔 / 唇咬笔）；J-L=全身<b>内脏与骨骼</b>反应在先</td>
        <td>两者都属"身体在先"思路，但<b>范围不同</b>（局部表情 vs 全身反应）</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>冯特 / Schlosberg / Russell 维度</td>
        <td>冯特=<b>三对</b>对立维度（愉快-不愉快、激动-平静、紧张-松弛）；Schlosberg=<b>三维度</b>（愉快-不愉快、注意-拒绝、激活水平）；Russell=<b>环形模型</b>（效价×唤醒二维环）</td>
        <td>数错维度是常见失分；Russell 是<b>二维环形</b>，冯特是<b>三对</b></td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>基本情绪 / 差异情绪理论</td>
        <td>Ekman：<b>六种</b>基本情绪（快乐、悲伤、愤怒、恐惧、厌恶、惊讶），表情具跨文化一致性；Izard：每种基本情绪有<b>独特神经基础与表情模式</b></td>
        <td>跨文化证据来自 <b>Fore 人</b>研究；不要把"六种"写成"七种"</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>认知重评 / 表达抑制</td>
        <td>重评=改变对事件的<b>解释</b>（前因策略，代价小、效果好）；抑制=压住<b>表情行为</b>（反应策略，耗资源、损害记忆）</td>
        <td>答题常问"哪种策略更好及原因"：<b>重评优于抑制</b>，因为发生在情绪产生之前</td>
      </tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-10" data-subject="psy"><div class="doc" data-title="动机与意志"><p class="lead">理论多而杂，按“四家理论—三种社会动机—意志与挫折”三块整理。动机冲突四型是稳定送分点。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>动机</b>激发和维持个体活动、并使活动朝向一定目标的心理倾向或内部动力。</p>
  <p class="def"><b>需要</b>个体对内外环境客观需求的反映，是有机体内部的不平衡状态。</p>
  <p class="def"><b>驱力</b>由生理需要引起、推动有机体活动以满足需要的内部状态。</p>
  <p class="def"><b>诱因</b>能引起动机的外部刺激或情境。</p>
  <p class="def"><b>内在动机</b>活动本身带来的满足；<b>外在动机</b>外部奖赏或压力驱动。</p>
  <p class="def"><b>成就动机</b>追求卓越、克服障碍、达到高标准的内在需要。</p>
  <p class="def"><b>自我效能</b>个体对自己能否完成特定任务的能力信念。</p>
  <p class="def"><b>意志</b>自觉确定目的、调节行动、克服困难的心理过程。</p>
  <p class="def"><b>动机冲突</b>同时存在两个以上目标或动机时产生的取舍矛盾。</p>
  <p class="def"><b>挫折</b>目标受阻时产生的情绪状态。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">理论谱系 / 冲突 / 品质</span></div>

  <h3>（1）动机理论谱系（默写重点）</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>理论</th><th>代表</th><th>核心主张</th><th>局限</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">本能论</td><td>McDougall、James</td><td>行为由先天本能驱动</td><td>循环解释</td></tr>
      <tr><td class="k">驱力说</td><td>Hull</td><td>驱力＝需要 × 习惯强度</td><td>难解释探索行为</td></tr>
      <tr><td class="k">唤醒理论</td><td>Yerkes-Dodson、Hebb</td><td>存在最佳唤醒水平</td><td>个体差异大</td></tr>
      <tr><td class="k">诱因理论</td><td>行为主义</td><td>外部刺激的吸引决定行为</td><td>忽视内部需要</td></tr>
      <tr><td class="k">认知理论</td><td>Atkinson、Weiner、Bandura、Deci &amp; Ryan</td><td>期待、归因、效能、自主需要</td><td>模型多、整合难</td></tr>
      <tr><td class="k">人本主义</td><td>Maslow</td><td>需要层次与自我实现</td><td>缺乏实证支持</td></tr>
    </tbody>
  </table>

  <h3>（2）马斯洛需要层次</h3>
  <div class="flow">
    生理 → 安全 → 归属与爱 → 尊重 → 自我实现<br>
    <span>后期增补认知需要与审美需要；低层基本满足后高层才占优势</span>
  </div>

  <h3>（3）四种动机冲突</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>类型</th><th>目标结构</th><th>效价</th><th>典型例子</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">双趋冲突</td><td>两个目标</td><td>都正</td><td>鱼与熊掌不可兼得</td></tr>
      <tr><td class="k">双避冲突</td><td>两个目标</td><td>都负</td><td>前有狼、后有虎</td></tr>
      <tr><td class="k">趋避冲突</td><td>同一目标</td><td>正负兼具</td><td>想考研又怕考不上</td></tr>
      <tr><td class="k">多重趋避</td><td>多个目标</td><td>各自正负兼具</td><td>择业时多个 offer 各有优劣</td></tr>
    </tbody>
  </table>

  <h3>（4）意志品质四对</h3>
  <ul class="mini">
    <li><b>独立性</b>（vs 受暗示）｜<b>果断性</b>（vs 优柔寡断、草率）</li>
    <li><b>坚韧性</b>（vs 动摇、执拗）｜<b>自制力</b>（vs 任性）</li>
  </ul>

  <h3>（5）挫折反应</h3>
  <ul class="mini">
    <li><b>攻击</b>直接或替代；<b>退化</b>行为退回幼稚水平；<b>固着</b>重复无效行为。</li>
    <li><b>冷漠</b>长期无助后的消极；<b>合理化</b>酸葡萄 / 甜柠檬；<b>补偿与升华</b>。</li>
  </ul>

  <div class="note">
    <b>易错：</b>① 趋避是“同一目标利弊兼具”，多重趋避是“多个目标各有利弊”。② 固着是重复无效，退化是退回幼稚。
    ③ 坚韧性 ≠ 固执：执拗是明知不可为而为之。④ 耶克斯—多德森：任务越难，最佳动机水平越低。
  </div>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">动机与意志的经典研究</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Hull（1943）驱力理论</td><td>剥夺时间 → 反应强度</td><td>驱力 × 习惯强度 → 行为潜能 → <b>驱力说</b></td></tr>
      <tr><td class="k">Yerkes &amp; Dodson（1908）</td><td>动机水平 × 任务难度 → 成绩</td><td>倒 U 形；难任务的最佳动机更低</td></tr>
      <tr><td class="k">Atkinson（1957）成就动机</td><td>任务难度 → 任务选择</td><td>高成就动机者偏好中等难度（成功率约 50%）</td></tr>
      <tr><td class="k">Bandura（1977）自我效能</td><td>成败经验 → 坚持性与目标选择</td><td>自我效能影响努力、坚持与归因</td></tr>
      <tr><td class="k">Locke &amp; Latham（1990）目标设置</td><td>目标具体性 / 难度 → 绩效</td><td>具体且有难度的目标优于“尽力而为”</td></tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-11" data-subject="psy"><div class="doc" data-title="能力"><p class="lead">智力理论要能按谱系默写；测验指标与信效度常与测量交叉出题。比率智商与离差智商的适用年龄别记反。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>能力</b>直接影响活动效率、使活动顺利完成的个性心理特征。</p>
  <p class="def"><b>智力</b>一般能力的综合，核心是抽象思维与问题解决能力。</p>
  <p class="def"><b>一般能力</b>多数活动共同需要的能力（观察、记忆、思维、想象）；<b>特殊能力</b>特定领域所需的能力。</p>
  <p class="def"><b>比率智商</b>IQ＝心理年龄／实际年龄×100，适用于儿童。</p>
  <p class="def"><b>离差智商</b>以同年龄组平均数为 100、标准差为 15 的标准分数，适用于全年龄。</p>
  <p class="def"><b>信度</b>测验结果的稳定性与一致性；<b>效度</b>测验测到所要测特质的程度。</p>
  <p class="def"><b>标准化</b>统一施测程序、计分规则与常模，使分数可比较。</p>
  <p class="def"><b>流体智力</b>依赖生物潜能、处理新异信息的能力；<b>晶体智力</b>依赖文化经验积累的能力。</p>
  <p class="def"><b>多元智力</b>加德纳主张智力由多种相对独立的成分构成；<b>三元智力</b>斯腾伯格主张成分、经验、情境三个亚理论。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">理论谱系 / 测验谱系</span></div>

  <h3>（1）能力与知识技能</h3>
  <div class="flow">
    知识技能 <em>—是形成的基础→</em> 能力 <em>—是掌握的条件→</em> 知识技能<br>
    <span>相互促进但不等同：能力形成更慢，且不随知识增多而线性增长</span>
  </div>

  <h3>（2）智力理论谱系（默写重点）</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>理论</th><th>代表</th><th>核心主张</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">二因素说</td><td>Spearman</td><td>一般因素 g ＋ 特殊因素 s，g 是智力核心</td></tr>
      <tr><td class="k">群因素说</td><td>Thurstone</td><td>七种基本心理能力（言语理解、语词流畅、数字、空间、记忆、知觉速度、推理）</td></tr>
      <tr><td class="k">三维结构</td><td>Guilford</td><td>内容 × 操作 × 产品，共 120 种组合</td></tr>
      <tr><td class="k">流体—晶体</td><td>Cattell-Horn</td><td>Gf 随年龄衰退，Gc 终生增长</td></tr>
      <tr><td class="k">多元智力</td><td>Gardner</td><td>语言、逻辑数学、空间、音乐、身体动觉、人际、内省、自然观察（后加存在）</td></tr>
      <tr><td class="k">三元智力</td><td>Sternberg</td><td>成分亚理论、经验亚理论、情境亚理论</td></tr>
      <tr><td class="k">PASS 模型</td><td>Das &amp; Naglieri</td><td>计划—注意—同时性加工—继时性加工</td></tr>
      <tr><td class="k">CHC 理论</td><td>Carroll 等</td><td>三层级结构：一般能力—广域能力—窄域能力</td></tr>
    </tbody>
  </table>

  <h3>（3）智力测验谱系</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>量表</th><th>年份</th><th>指标</th><th>特点</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">比奈—西蒙</td><td class="c">1905</td><td>心理年龄</td><td>第一个智力量表，用于筛选学困儿童</td></tr>
      <tr><td class="k">斯坦福—比奈</td><td class="c">1916</td><td>比率智商</td><td>IQ＝MA／CA×100，只适用于儿童</td></tr>
      <tr><td class="k">韦氏量表</td><td class="c">1939</td><td>离差智商</td><td>均值 100、标准差 15；分言语与操作</td></tr>
      <tr><td class="k">瑞文推理</td><td class="c">1938</td><td>百分等级</td><td>非文字，文化公平性较好</td></tr>
    </tbody>
  </table>

  <h3>（4）能力发展与个体差异</h3>
  <ul class="mini">
    <li><b>趋势</b>先快后慢，20—25 岁达高峰；流体早衰、晶体终生增长。</li>
    <li><b>差异</b>水平差异（智商分布）、类型差异（言语 / 数学 / 空间）、发展早晚（早熟与晚成）。</li>
    <li><b>因素</b>遗传（遗传度约 50%—70%）、环境（家庭、教育、营养、文化）、二者交互。</li>
  </ul>

  <div class="note">
    <b>易错：</b>① 比率智商只用于儿童，离差智商适用全年龄。② 斯腾伯格“三元”是三个<b>亚理论</b>，不是三种智力。
    ③ 加德纳是“多元”，不是“三层”。④ 遗传度是群体统计量，不能解释个体差异的来源。
  </div>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">测验史与遗传证据</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Spearman（1904）因素分析</td><td>各测验成绩 → 相关矩阵</td><td>正相关矩阵析出一般因素 → <b>二因素说</b></td></tr>
      <tr><td class="k">Binet &amp; Simon（1905）</td><td>年龄 → 通过的项目</td><td>心理年龄 → 第一个智力量表</td></tr>
      <tr><td class="k">Terman（1916）斯坦福—比奈</td><td>心理年龄 / 实际年龄 → IQ</td><td>比率智商，适用于儿童</td></tr>
      <tr><td class="k">Wechsler（1939）</td><td>原始分 → 标准分</td><td>离差智商，均值 100、标准差 15</td></tr>
      <tr><td class="k">Bouchard 等（1990）双生子</td><td>遗传相同 / 环境不同 → 能力相关</td><td>遗传度约 50%—70% → 遗传有实质贡献</td></tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-12" data-subject="psy"><div class="doc" data-title="人格"><p class="lead">你的方向章。特质论、精神分析、自我三块要能写到论述深度；气质与性格、人格测验是选择题常客。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>人格</b>一个人区别于他人的、稳定而统一的心理品质，构成思想、情感与行为的特有统合模式。</p>
  <p class="def"><b>人格四特性</b>独特性、稳定性、统合性（整合性）、功能性。</p>
  <p class="def"><b>特质</b>可表现一个人人格特点的行为倾向，是人格的有效组成元素。</p>
  <p class="def"><b>气质</b>心理活动在强度、速度、灵活性与指向性上的稳定心理特征，与生俱来、受生理素质制约。</p>
  <p class="def"><b>性格</b>人对现实的稳定态度和习惯化了的行为方式，是人格中具有社会评价意义的部分。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">六大取向 + 特质谱系</span></div>

  <h3>（1）六大取向总览</h3>
  <table class="tbl">
    
    <thead><tr><th>取向</th><th>代表</th><th>关键结构</th></tr></thead>
    <tbody>
      <tr><td class="k">特质论</td><td>Allport、Cattell、Eysenck、大五</td><td>特质是人格的基本单元</td></tr>
      <tr><td class="k">类型论</td><td>希波克拉底 / 盖伦、荣格、克雷奇默、谢尔顿</td><td>按类型整体划分</td></tr>
      <tr><td class="k">精神分析</td><td>Freud、Erikson</td><td>本我 / 自我 / 超我；性心理发展阶段；八阶段</td></tr>
      <tr><td class="k">人本主义</td><td>Maslow、Rogers</td><td>需要层次与自我实现；自我概念、无条件积极关注</td></tr>
      <tr><td class="k">学习论</td><td>Skinner、Bandura</td><td>操作性条件作用；观察学习、自我效能</td></tr>
      <tr><td class="k">认知论</td><td>Kelly、Mischel</td><td>个人构念；认知—情感人格系统（CAPS）</td></tr>
    </tbody>
  </table>

  <h3>（2）特质论谱系（默写重点）</h3>
  <ul class="mini">
    <li><b>Allport</b>个人特质（首要 / 中心 / 次要）+ 共同特质</li>
    <li><b>Cattell</b>表面特质 vs <b>根源特质</b>；因素分析得 16 个根源特质（16PF）</li>
    <li><b>Eysenck</b>三维度 <b>E</b>（外倾—内倾）、<b>N</b>（神经质）、<b>P</b>（精神病质）；层级结构：型 → 特质 → 习惯反应 → 具体反应</li>
    <li><b>大五</b>（Costa &amp; McCrae, NEO-PI）开放性 O、责任心 C、外倾性 E、宜人性 A、神经质 N</li>
  </ul>

  <h3>（3）气质类型与高级神经活动类型（巴甫洛夫）</h3>
  <table class="tbl">
    
    <thead><tr><th>神经类型</th><th>气质</th></tr></thead>
    <tbody>
      <tr><td>强、平衡、灵活</td><td>多血质</td></tr>
      <tr><td>强、平衡、不灵活</td><td>黏液质</td></tr>
      <tr><td>强、不平衡</td><td>胆汁质</td></tr>
      <tr><td>弱</td><td>抑郁质</td></tr>
    </tbody>
  </table>

  <h3>（4）人格成因</h3>
  <p class="def"><b>四类</b>生物遗传（遗传度、双生子研究）、家庭教养方式（民主 / 专制 / 溺爱 / 忽视）、学校与社会文化、情境（人格—情境之争）。</p>

  <h3>（5）人格测量 <span class="warn">→ 与心理测量联动</span></h3>
  <p class="def"><b>自陈量表</b>MMPI、16PF、EPQ、NEO-PI；<b>投射测验</b>罗夏墨迹、TAT。</p>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">你的方向，需比考纲更深</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Eysenck 柠檬汁实验</td><td>外倾性（高 / 低）→ 唾液分泌量</td><td>外倾者皮层唤醒较低 → 需更强刺激，支持唤醒理论</td></tr>
      <tr><td class="k">Mischel（1968）综述</td><td>跨情境行为一致性（相关）</td><td>相关仅约 0.30 → 引发人格—情境之争</td></tr>
      <tr><td class="k">Mischel, Shoda &amp; Peake（1988）夏令营</td><td>情境（挑衅 / 中性）× 行为 → 攻击反应</td><td>跨情境不稳定，但"如果—那么"情境—行为特征高度稳定 → CAPS</td></tr>
      <tr><td class="k">Bouchard 等（1990）分开抚养双生子</td><td>遗传相同 / 环境不同 → 人格量表相关</td><td>遗传对人格有实质贡献（遗传度约 40–50%）</td></tr>
      <tr><td class="k">Bandura（1961）Bobo 娃娃</td><td>榜样是否受强化 → 模仿攻击行为</td><td>观察学习无需直接强化即可发生</td></tr>
      <tr><td class="k">Thomas &amp; Chess 纽约纵向研究</td><td>气质类型 × 教养匹配 → 适应结果</td><td>气质分容易型 / 困难型 / 迟缓型；"拟合优度"决定适应</td></tr>
    </tbody>
  </table>
<h3 class="sec"><span>二</span>框架之外的 3 个漏点</h3>
<p class="secnote">这些点不在上面的三层框架里，是诊断手册单独补的；编号沿用诊断手册的 C 编号，方便回查。</p>
<article class="pt">
    <div class="pt-head"><span class="pid">C12-1</span><h3>精神分析的分裂：荣格、阿德勒、霍妮</h3><span class="stars">★★★</span></div>
    <p>荣格：集体无意识（原型：人格面具、阿尼玛/阿尼姆斯、阴影、自性）、内外向、个体化。阿德勒：自卑与超越、生活风格、社会兴趣、出生顺序。霍妮：基本焦虑、神经症需要、真实自我与理想自我。三人都从本能决定论转向社会文化与人际因素。</p>
    <p class="tip"><b>易错</b>荣格的“集体无意识”是种族遗传的普遍心理经验，不是“个人被压抑的记忆”。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C12-2</span><h3>自我：自我概念、自尊与防御机制</h3><span class="stars">★★★</span></div>
    <p>自我概念：个体对自己的认知图式（詹姆斯 I/me；库利镜中我；米德主我/客我）。自尊：对自我价值的评价性情感，受成败与领域重要性影响。自我控制：延迟满足。防御机制：压抑、否认、投射、合理化、反向形成、升华、替代。</p>
    <p class="tip"><b>易错</b>升华是“建设性转化”，替代是“换对象发泄”——两者都“转移”，区别在是否被社会认可。</p>
  </article>
<article class="pt">
    <div class="pt-head"><span class="pid">C12-3</span><h3>大五两极与气质—教养拟合</h3><span class="stars">★★★</span></div>
    <p>开放性（想象、求异—务实、传统）、尽责性（有序、自律—散漫、冲动）、外向性（热情、活跃—寡言、退缩）、宜人性（信任、合作—怀疑、竞争）、神经质（焦虑、不稳—平静、坚韧）。气质分容易型、困难型、迟缓型；<b>拟合优度</b>指气质与环境的匹配程度决定适应结果。教养方式：民主型最优，另有专制、溺爱、忽视。</p>
    <p class="tip"><b>易错</b>大五对艾森克的 E、N，但艾森克多一个 P（精神质）；气质“无好坏”，但困难型在不适配环境中更易出问题。</p>
  </article><h3 class="sec"><span>三</span>易混辨析</h3>
<p class="secnote">遮住后两列自测：能说出判别标准，才算真会。</p>
<table class="tbl">
    
    <thead>
      <tr><th>概念组</th><th>判别标准</th><th>考点陷阱</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="k"><span class="ck">□</span>人格 / 气质 / 性格</td>
        <td>人格=整体；气质=<b>先天</b>、受生理素质制约、<b>无社会评价</b>；性格=<b>后天</b>、<b>有社会评价</b>（好坏）、人格的核心</td>
        <td>"气质无好坏、性格有优劣"是标准答法；性格是人格中<b>具有道德评价意义</b>的部分</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>气质四类型 / 神经类型</td>
        <td>强·平衡·灵活=<b>多血质</b>；强·平衡·不灵活=<b>黏液质</b>；强·不平衡=<b>胆汁质</b>；弱=<b>抑郁质</b></td>
        <td>抑郁质对应<b>弱型</b>，不是"不平衡型"；胆汁质才是不平衡型</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>表面特质 / 根源特质</td>
        <td>Cattell：表面=可直接观察到的<b>行为群</b>；根源=<b>背后起决定作用</b>的基本特质（16 个）</td>
        <td>16PF 测的是<b>根源特质</b>；根源特质由因素分析得到</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>个人特质 / 共同特质</td>
        <td>Allport：个人特质=<b>个人独有</b>（分首要 / 中心 / 次要）；共同特质=<b>同一文化下多数人共有</b></td>
        <td>Allport 强调<b>个人特质</b>（idiographic），这是他与其他特质论者的根本分歧</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>特质论 / 类型论</td>
        <td>特质=连续<b>维度上的量</b>（可比较高低的程度）；类型=离散<b>类别</b>（非此即彼）</td>
        <td>Eysenck 虽用"类型（type）"一词，实为<b>维度</b>取向；不要把他说成类型论者</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>Eysenck 三维度 / 大五</td>
        <td>Eysenck：<b>E</b>（内外倾）、<b>N</b>（神经质）、<b>P</b>（精神病质）；大五：<b>O、C、E、A、N</b>（NEO-PI）</td>
        <td>EPQ 中的 <b>L 是掩饰（测谎）量表</b>，不是人格维度；大五<b>没有"精神质"</b></td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>结果预期 / 自我效能</td>
        <td>Bandura：结果预期=某行为会带来某<b>结果</b>；自我效能=自己<b>能否成功执行</b>该行为</td>
        <td>自我效能决定是否<b>尝试</b>与<b>坚持多久</b>；两者不能互换</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>投射测验 / 自陈量表</td>
        <td>看<b>刺激是否结构化、反应是否自由</b>：投射=罗夏、TAT（模糊刺激、自由反应、解释主观）；自陈=MMPI、16PF、EPQ（标准化题目、自评、可团体施测）</td>
        <td>投射测验的主要弱点是<b>信效度偏低、计分主观</b>；不要答"不能团体施测"（部分可）</td>
      </tr>
      <tr>
        <td class="k"><span class="ck">□</span>遗传度 / 遗传决定</td>
        <td>遗传度是<b>群体指标</b>（群体内变异中遗传解释的比例），不能推及个体，也不意味着不可改变</td>
        <td>"双生子人格相关高"≠"个体由基因决定"；遗传度随<b>群体与环境范围</b>变化</td>
      </tr>
    </tbody>
  </table></div></template>
<template id="doc-psy-13" data-subject="psy"><div class="doc" data-title="社会心理"><p class="lead">你的方向章。归因、从众与服从、群体行为、态度改变四条线要能串起来；论述题常跨章（人格＋社会）。</p>
  <h3 class="sec"><span>一</span>三层框架</h3>
  <div class="layer"><span class="lv">L1</span>第一层 · 定义层<span class="hint">术语精确表述</span></div>

  <p class="def"><b>社会化</b>个体在社会文化中习得规范、角色与技能，成为社会成员的过程，终身进行。</p>
  <p class="def"><b>社会认知</b>对他人、群体与社会事件的知觉、判断与推理。</p>
  <p class="def"><b>归因</b>对他人或自己行为的原因进行推断的过程。</p>
  <p class="def"><b>刻板印象</b>对群体的概括化认知；<b>偏见</b>对群体的负面态度；<b>歧视</b>对群体的负面行为。</p>
  <p class="def"><b>从众</b>群体压力下改变行为或态度以与群体一致；<b>服从</b>在命令下改变行为；<b>顺从</b>在请求下依从。</p>
  <p class="def"><b>旁观者效应</b>在场人数越多，个体提供帮助的可能性越低。</p>
  <p class="def"><b>认知失调</b>认知元素间不一致产生的不适，驱动个体改变态度或行为。</p>
  <p class="def"><b>社会助长</b>他人在场提高简单任务表现；<b>社会惰化</b>群体中个体努力程度下降。</p>
  <p class="def"><b>群体极化</b>讨论使群体态度更极端；<b>群体思维</b>为求一致而压制异议的决策缺陷。</p>
  <p class="def"><b>去个体化</b>匿名与群体淹没导致自我意识下降、行为失控。</p>

  <div class="layer"><span class="lv">L2</span>第二层 · 结构层<span class="hint">五大块 / 三层次</span></div>

  <h3>（1）社会心理的五大块</h3>
  <div class="flow">
    社会化与自我 ｜ 社会认知 ｜ 社会关系 ｜ 社会影响 ｜ 社会行为<br>
    <span>自我 → 怎么看人 → 怎么相处 → 怎么被影响 → 怎么行动</span>
  </div>

  <h3>（2）归因理论谱系</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>理论</th><th>代表</th><th>核心主张</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">朴素心理学</td><td>Heider</td><td>人依据内部原因与外部原因解释行为</td></tr>
      <tr><td class="k">对应推断</td><td>Jones &amp; Davis</td><td>由行为推断意图与人格，依据非共同效果与社会赞许性</td></tr>
      <tr><td class="k">协变模型</td><td>Kelley</td><td>一致性、一贯性、区别性三性共同决定内外归因</td></tr>
      <tr><td class="k">三维归因</td><td>Weiner</td><td>内外源 × 稳定性 × 可控性，影响情绪与后续努力</td></tr>
    </tbody>
  </table>
  <p class="def"><b>四类偏差</b>基本归因错误（重人格轻情境）、行动者—观察者偏差（自因情境、他因人格）、自我服务偏差（成功归己、失败归外）、虚假一致偏差（高估他人与自己一致）。</p>

  <h3>（3）社会影响的三个层次</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>类型</th><th>压力来源</th><th>经典研究</th><th>关键影响因素</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">从众</td><td>群体压力</td><td>Asch 线段判断</td><td>群体规模（3—4 人饱和）、一致性、凝聚力、公开 / 私下</td></tr>
      <tr><td class="k">服从</td><td>权威命令</td><td>Milgram 电击</td><td>权威接近性与合法性、受害者距离、同伴榜样</td></tr>
      <tr><td class="k">顺从</td><td>他人请求</td><td>登门槛、留面子、低球</td><td>承诺、互惠、自我知觉</td></tr>
    </tbody>
  </table>

  <h3>（4）群体行为五现象</h3>
  <table class="tbl">
    
    <thead>
      <tr><th>现象</th><th>核心机制</th><th>关键结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">社会助长 / 抑制</td><td>他人在场 → 唤醒 → 优势反应</td><td>简单任务促进，复杂任务抑制</td></tr>
      <tr><td class="k">社会惰化</td><td>责任分散、可评价性降低</td><td>群体中个体努力下降</td></tr>
      <tr><td class="k">群体极化</td><td>信息影响与规范影响</td><td>讨论后态度更极端</td></tr>
      <tr><td class="k">群体思维</td><td>高凝聚力 + 强领导 + 封闭</td><td>压制异议，决策失误</td></tr>
      <tr><td class="k">去个体化</td><td>匿名 + 责任分散</td><td>自我意识下降，行为失控</td></tr>
    </tbody>
  </table>

  <h3>（5）态度与态度改变</h3>
  <ul class="mini">
    <li><b>三成分</b>认知、情感、行为倾向（ABC）。</li>
    <li><b>ELM</b>中心路径（高动机高能力，重论据质量，持久）；边缘路径（低动机或低能力，重外围线索，短暂）。</li>
    <li><b>认知失调</b>改变行为、改变认知或增加新认知；外部理由越不足，失调越强。</li>
  </ul>

  <div class="note">
    <b>易错：</b>① 刻板印象是认知、偏见是态度、歧视是行为。② 从众（群体压力）、服从（命令）、顺从（请求）三分别混。
    ③ 旁观者效应的机制是责任分散与多元无知，不是“人心冷漠”。④ 社会助长与惰化是两个机制，不是一回事。
  </div>

  <div class="layer"><span class="lv">L3</span>第三层 · 证据层<span class="hint">社心五大经典</span></div>

  <table class="tbl">
    
    <thead>
      <tr><th>研究（年份）</th><th>自变量 → 因变量</th><th>结论</th></tr>
    </thead>
    <tbody>
      <tr><td class="k">Asch（1951）线段判断</td><td>群体意见一致 / 不一致 → 判断</td><td>约 37% 关键试次从众，75% 至少一次 → <b>从众</b></td></tr>
      <tr><td class="k">Milgram（1963）电击实验</td><td>权威命令 → 服从电压</td><td>65% 服从到最高电压 → <b>情境力量</b></td></tr>
      <tr><td class="k">Latané &amp; Darley（1968）</td><td>在场人数 → 助人率与反应时</td><td>人越多助人越少 → <b>旁观者效应</b></td></tr>
      <tr><td class="k">Festinger &amp; Carlsmith（1959）</td><td>报酬高低 → 态度改变</td><td>低报酬组更改变态度 → <b>认知失调</b></td></tr>
      <tr><td class="k">Tajfel（1971）最小群体</td><td>群体划分 → 资源分配</td><td>内群体偏好 → <b>社会认同理论</b></td></tr>
    </tbody>
  </table></div></template>

<template id="doc-dev-a" data-subject="dev"><div class="doc" data-title="总论与理论（发 01–18）"><div class="item"><h4><span class="num">发01</span>毕生发展观（巴尔特斯）</h4>
<ul><li>五特点：<b>毕生性、多向性、可塑性、历史情境性、多学科性</b></li>
<li>核心命题：发展是<b>获得与丧失的动态平衡</b>，<b>任何年龄都有可塑性</b></li></ul>
<div class="hook">钩：毕·多·可·历·多 → "毕多可历多"</div></div>

<div class="item"><h4><span class="num">发02</span>SOC 模型</h4>
<ul><li><b>选择（S）—优化（O）—补偿（C）</b>：资源下降时，收缩目标、优化投入、用替代手段补偿</li></ul></div>

<div class="item"><h4><span class="num">发03</span>发展的一般规律</h4>
<ul><li><b>顺序性</b>：头尾律（由上到下）、近远律（中心到外周）、由粗到细</li>
<li><b>连续性与阶段性</b>统一（量变与质变的统一）</li>
<li><b>不平衡性</b>：关键期 / 敏感期、发展加速期</li>
<li><b>个别差异</b>；<b>年龄特征</b>既有稳定性又有可变性</li></ul></div>

<div class="item"><h4><span class="num">发04</span>遗传与环境之争</h4>
<ul><li>高尔顿：遗传决定论 → 华生：环境决定论（"给我一打儿童"）</li>
<li><b>格塞尔：成熟势力说</b>（双生子爬梯，成熟决定发展）→ 斯卡尔："遗传限"</li>
<li>现代主流：<b>相互作用论</b>；基因型—环境相关三型：<b>被动型、唤起型、主动型</b></li></ul></div>

<div class="item"><h4><span class="num">发05</span>关键期 / 敏感期</h4>
<ul><li>来源：洛伦兹<b>印刻</b>；语言关键期（伦内伯格）；依恋关键期</li>
<li>现多用<b>敏感期</b>：错过有补偿空间，非"过时不可逆"</li></ul></div>

<div class="item"><h4><span class="num">发06</span>研究方法</h4>
<ul><li><b>横断</b>：快、省，受<b>同辈效应</b>干扰</li>
<li><b>纵向</b>：能看个体变化，慢，有练习效应与样本流失</li>
<li><b>聚合交叉</b>：二者结合，最理想</li></ul></div>

<div class="item"><h4><span class="num">发07</span>皮亚杰的机制</h4>
<ul><li><b>图式</b>；<b>同化</b>（量变，纳入原有图式）；<b>顺应</b>（质变，改造图式）；<b>平衡化</b>（内在动力）</li></ul></div>

<div class="item"><h4><span class="num">发08</span>皮亚杰四阶段<span class="tag">最高频</span></h4>
<ul><li><b>感知运动 0–2</b>：<b>客体永久性</b>（约 8–12 月）、循环反应三级、<b>A 非 B 错误</b>、延迟模仿</li>
<li><b>前运算 2–7</b>：符号 / 表象功能、<b>自我中心</b>（三山实验）、泛灵论、<b>不守恒</b>、中心化、不可逆、集体独白</li>
<li><b>具体运算 7–11</b>：<b>守恒</b>、去中心化、可逆性、分类、序列化、传递性；仍离不开具体事物</li>
<li><b>形式运算 11+</b>：<b>假设演绎推理</b>、命题运算、抽象与系统性、理想主义</li></ul></div>

<div class="item"><h4><span class="num">发09</span>皮亚杰的评价</h4>
<ul><li>低估儿童能力（现代研究显示成就提前）；阶段跨文化一致性存疑</li>
<li>忽视社会文化、教育与语言的作用；低估<b>领域特殊性</b></li></ul></div>

<div class="item"><h4><span class="num">发10</span>维果茨基</h4>
<ul><li>高级心理机能<b>社会起源</b>；<b>心理工具（符号）中介</b>；<b>内化</b></li>
<li><b>最近发展区（ZPD）</b>：现有水平与潜在水平之间的差距</li>
<li><b>教学应走在发展前面</b>；引申出<b>支架式教学</b>（布鲁纳）</li></ul></div>

<div class="item"><h4><span class="num">发11</span>自我中心言语之争<span class="tag">对比必考</span></h4>
<ul><li>皮亚杰：认知不成熟的产物，最终<b>消失</b></li>
<li>维果茨基：社会言语<b>内化</b>的过渡，最终转为<b>内部言语</b></li></ul></div>

<div class="item"><h4><span class="num">发12</span>皮亚杰 vs 维果茨基</h4>
<ul><li>来源：<b>个体建构</b> vs <b>社会建构</b></li>
<li>机制：<b>平衡化</b> vs <b>内化</b></li>
<li>教育：不宜超前教 vs <b>教学走在发展前面</b></li>
<li>语言与思维：思维决定语言 vs 语言（社会言语）塑造思维</li></ul></div>

<div class="item"><h4><span class="num">发13</span>信息加工观</h4>
<ul><li>关注<b>加工速度、工作记忆容量、策略、元认知</b></li>
<li>主张发展是<b>连续的量的变化</b>，反对阶段质变；代表：<b>重叠波理论</b>（西格勒）、资源有限说（凯斯）</li></ul></div>

<div class="item"><h4><span class="num">发14</span>生态系统理论（布朗芬布伦纳）</h4>
<ul><li><b>微系统 → 中间系统 → 外层系统 → 宏观系统 → 时间系统</b></li></ul></div>

<div class="item"><h4><span class="num">发15</span>埃里克森八阶段<span class="tag">必默写</span></h4>
<ul><li>信任—不信任（0–1.5）｜自主—羞怯（1.5–3）｜主动—内疚（3–6）｜勤奋—自卑（6–12）</li>
<li>同一性—角色混乱（12–18）｜亲密—孤独（18–35）｜繁殖—停滞（35–60）｜自我整合—绝望（60+）</li></ul>
<div class="hook">钩：信·自·主·勤｜同·亲·繁·整</div></div>

<div class="item"><h4><span class="num">发16</span>语言发展理论</h4>
<ul><li>强化说（斯金纳）｜<b>先天论 / LAD</b>（乔姆斯基）｜<b>交互作用论</b>（先天 + 环境，主流）</li></ul></div>

<div class="item"><h4><span class="num">发17</span>心理理论（ToM）</h4>
<ul><li><b>错误信念任务</b>约 <b>4 岁</b>通过；愿望—信念推理；<b>自闭症</b>儿童 ToM 缺陷</li></ul></div>

<div class="item"><h4><span class="num">发18</span>道德发展三理论</h4>
<ul><li><b>皮亚杰</b>：他律道德（道德实在论，重结果）→ 自律道德（道德相对论，重动机），<b>10–11 岁</b>转折</li>
<li><b>科尔伯格</b>三水平六阶段：前习俗（惩罚服从、朴素利己）→ 习俗（好孩子、维护社会秩序）→ 后习俗（社会契约、普遍伦理）</li>
<li><b>吉利根</b>：关怀伦理（公正 vs 关怀）；<b>特里尔</b>：社会领域理论（道德 / 社会习俗 / 个人事务）</li></ul></div></div></template>
<template id="doc-dev-b" data-subject="dev"><div class="doc" data-title="分阶段（发 19–39）"><div class="item"><h4><span class="num">发19</span>婴儿动作发展规律</h4>
<ul><li><b>头尾</b>（由上到下）、<b>近远</b>（中心到外周）、整体到分化、无意到有意、粗到细</li></ul></div>

<div class="item"><h4><span class="num">发20</span>婴儿感知觉</h4>
<ul><li><b>优先发展</b>；<b>视觉悬崖</b>（吉布森，<b>6 个月</b>有深度知觉）；面部偏好；偏好母亲声音</li>
<li>结论：<b>知觉发展早于动作发展</b></li></ul></div>

<div class="item"><h4><span class="num">发21</span>婴儿记忆</h4>
<ul><li><b>再认先于回忆</b>；<b>延迟模仿</b>（9 个月起）；<b>婴儿期记忆缺失</b></li></ul></div>

<div class="item"><h4><span class="num">发22</span>气质类型（托马斯—切斯）</h4>
<ul><li><b>容易型</b>（约 40%）、<b>困难型</b>（约 10%）、<b>迟缓型</b>（约 15%），其余为混合型</li>
<li>气质是依恋与人格发展的基础；<b>拟合优度</b>：养育方式与气质匹配才有利</li></ul></div>

<div class="item"><h4><span class="num">发23</span>依恋四阶段（鲍尔比）</h4>
<ul><li>无差别反应（0–3 月）→ 有差别反应（3–6 月）→ <b>特殊情感联结</b>（6 月–2 岁，陌生人焦虑与分离焦虑高峰）→ <b>互惠关系</b>（2 岁后）</li></ul></div>

<div class="item"><h4><span class="num">发24</span>陌生情境与依恋四类型（安斯沃斯）<span class="tag">必考</span></h4>
<ul><li><b>安全型（约 65%）</b>：以母亲为安全基地，分离焦虑，重聚易被安抚</li>
<li><b>回避型（约 20%）</b>：对母亲在场离开均淡漠，重聚无反应</li>
<li><b>反抗 / 矛盾型（约 10%）</b>：黏母，重聚既求接触又抗拒</li>
<li><b>组织混乱型（约 5%）</b>：行为矛盾无组织，多见于受虐儿童</li>
<li>影响因素：<b>养育敏感性</b>、婴儿气质、家庭环境；形成<b>内部工作模型</b></li></ul></div>

<div class="item"><h4><span class="num">发25</span>哈洛恒河猴</h4>
<ul><li><b>接触安慰 &gt; 喂食</b>；依恋不是"喂食的副产品"</li></ul></div>

<div class="item"><h4><span class="num">发26</span>情绪与自我里程碑</h4>
<ul><li><b>社会性微笑 2–3 月</b>；<b>陌生人焦虑 6–8 月</b>；<b>分离焦虑 8 月—1.5~2 岁高峰</b></li>
<li><b>点红实验</b>（阿姆斯特丹）：<b>18–24 月</b>出现镜像自我</li></ul></div>

<div class="item"><h4><span class="num">发27</span>游戏（幼儿期主导活动）</h4>
<ul><li>帕滕 6 级社会性水平：<b>无所事事 → 旁观 → 单独 → 平行 → 联合 → 合作</b></li>
<li>皮亚杰按认知分：<b>练习性（机能性）→ 象征性 → 规则性</b></li>
<li>游戏理论：霍尔复演说、格罗斯生活预备说、精神分析（宣泄）、皮亚杰（<b>同化大于顺应</b>）</li></ul></div>

<div class="item"><h4><span class="num">发28</span>幼儿认知</h4>
<ul><li><b>具体形象思维</b>为主、抽象逻辑萌芽；自我中心、泛灵论、不守恒</li>
<li>词汇量：3 岁约 1000 → 6 岁约 3000–4000；掌握基本语法</li></ul></div>

<div class="item"><h4><span class="num">发29</span>幼儿社会性</h4>
<ul><li><b>性别</b>（科尔伯格）：认同 2–3 岁 → 稳定性 4–5 岁 → <b>恒常性 5–7 岁</b></li>
<li><b>第一反抗期 3–4 岁</b>；攻击由<b>工具性</b>转向<b>敌意性</b></li>
<li>自我评价：从依从到独立、从外部到内部、从个别到一般</li></ul></div>

<div class="item"><h4><span class="num">发30</span>童年期</h4>
<ul><li><b>学习成为主导活动</b>；思维由具体形象向抽象逻辑过渡，<b>小学四年级（10–11 岁）是关键转折</b></li>
<li>元认知出现；道德由他律转为自律</li></ul></div>

<div class="item"><h4><span class="num">发31</span>塞尔曼观点采择 5 阶段</h4>
<ul><li><b>自我中心（3–6）→ 社会信息（6–8）→ 自我反省（8–10）→ 相互观点采择（10–12）→ 社会习俗系统（12+）</b></li></ul></div>

<div class="item"><h4><span class="num">发32</span>塞尔曼友谊 5 阶段</h4>
<ul><li><b>暂时性游戏伙伴 → 单向帮助 → 双向合作 → 亲密共享 → 自主共存</b></li></ul></div>

<div class="item"><h4><span class="num">发33</span>青少年认知与自我中心</h4>
<ul><li>形式运算占优势；<b>假想观众</b>（高估他人对自己的关注）+ <b>个人神话</b>（自认独特、无坚不摧）</li>
<li><b>辨析</b>：幼儿自我中心＝不能区分自己与他人的视角；青少年自我中心＝过度关注自我</li></ul></div>

<div class="item"><h4><span class="num">发34</span>青少年同一性</h4>
<ul><li>埃里克森：<b>同一性 vs 角色混乱</b></li>
<li>玛西亚四状态：<b>同一性获得</b>（探索后承诺）、<b>延缓</b>（探索中未承诺）、<b>早闭</b>（未探索即承诺）、<b>扩散</b>（无探索无承诺）</li></ul></div>

<div class="item"><h4><span class="num">发35</span>青少年情绪与关系</h4>
<ul><li>情绪两极性（霍尔"<b>暴风骤雨期</b>"）；<b>同伴从众达峰</b>；亲子冲突增加但依恋仍强</li></ul></div>

<div class="item"><h4><span class="num">发36</span>成年三期主线</h4>
<ul><li><b>成年初期</b>：亲密 vs 孤独；爱情三角（斯腾伯格：<b>激情、亲密、承诺</b>）；职业探索</li>
<li><b>成年中期</b>：繁殖 vs 停滞；更年期；"三明治一代"；<b>中年危机证据有限，非普遍现象</b></li>
<li><b>成年晚期</b>：自我整合 vs 绝望；退休适应；丧偶适应</li></ul></div>

<div class="item"><h4><span class="num">发37</span>老化理论四说</h4>
<ul><li><b>离脱理论</b>（自然脱离，双方满意）｜<b>活动理论</b>（保持活动才满意）</li>
<li><b>连续性理论</b>（延续早年生活方式）｜<b>社会情绪选择理论</b>（卡斯滕森：未来时间有限 → 优先情绪意义目标）</li></ul></div>

<div class="item"><h4><span class="num">发38</span>老年智力</h4>
<ul><li>卡特尔：<b>流体智力</b>青年达峰后下降；<b>晶体智力</b>持续上升或稳定</li>
<li>巴尔特斯：<b>可塑性仍存在</b>；<b>加工速度、工作记忆、抑制功能</b>下降</li>
<li><b>柏林智慧模型</b>；词汇量不随年龄明显衰退</li></ul></div>

<div class="item"><h4><span class="num">发39</span>库布勒—罗斯临终五阶段</h4>
<ul><li><b>否认 → 愤怒 → 讨价还价 → 抑郁 → 接受</b></li></ul></div></div></template>

<h2>一、认知发展（纵向）</h2>

<div class="item"><h4>婴儿期 <span>0–3 岁</span></h4>
<dl>
<dt>感知觉</dt><dd><b>优先发展</b>；6 个月有深度知觉（吉布森视觉悬崖）；视听觉、味嗅觉、痛觉</dd>
<dt>注意</dt><dd>无意注意为主</dd>
<dt>记忆</dt><dd>再认早于回忆；9 个月出现延迟模仿；<b>婴儿期记忆缺失</b></dd>
<dt>思维</dt><dd><b>直觉行动思维</b>（0–3 岁），离不开动作与实物</dd>
<dt>结论</dt><dd>感知觉是婴儿认识世界的主要手段</dd>
</dl></div>

<div class="item"><h4>幼儿期 <span>3–6/7 岁</span></h4>
<dl>
<dt>感知觉</dt><dd>形状 → 大小 → 方位知觉；<b>左右方位最难</b></dd>
<dt>注意</dt><dd>无意注意占优势，有意注意初步发展；稳定性差、易转移</dd>
<dt>记忆</dt><dd>无意记忆、机械记忆、形象记忆占优势；<b>记忆策略萌芽</b>：复述 3–4 岁、组织 5–6 岁</dd>
<dt>思维</dt><dd><b>具体形象思维</b>为主，抽象逻辑思维开始萌芽；自我中心、泛灵论、不守恒、中心化、不可逆（前运算阶段）</dd>
<dt>结论</dt><dd>游戏是主导活动</dd>
</dl></div>

<div class="item"><h4>童年期 <span>6/7–11/12 岁</span></h4>
<dl>
<dt>感知觉</dt><dd>差别感受性明显提高</dd>
<dt>注意</dt><dd>有意注意发展；广度小、分配与转移较差</dd>
<dt>记忆</dt><dd>有意记忆、意义记忆发展；<b>元记忆</b>出现</dd>
<dt>思维</dt><dd>由具体形象向<b>抽象逻辑思维过渡</b>；<b>小学四年级（10–11 岁）是关键转折</b></dd>
<dt>结论</dt><dd>学习成为主导活动</dd>
</dl></div>

<div class="item"><h4>青少年期 <span>11/12–17/18 岁</span></h4>
<dl>
<dt>感知觉</dt><dd>接近成人水平</dd>
<dt>注意</dt><dd>注意品质全面发展</dd>
<dt>记忆</dt><dd>记忆策略主动化</dd>
<dt>思维</dt><dd><b>形式运算</b>：抽象逻辑思维占优势、假设演绎推理、命题运算；<b>思维自我中心</b>（假想观众、个人神话）；元认知</dd>
<dt>结论</dt><dd>思维可脱离具体事物</dd>
</dl></div>

<div class="item"><h4>成年初期 <span>18–35 岁</span></h4>
<dl>
<dt>记忆</dt><dd>记忆高峰</dd>
<dt>思维</dt><dd><b>后形式思维 / 辩证思维</b>（里格尔）；流体智力达峰、晶体智力持续增长</dd>
<dt>结论</dt><dd>智力发展的黄金期</dd>
</dl></div>

<div class="item"><h4>成年中期 <span>35–60 岁</span></h4>
<dl>
<dt>感知觉</dt><dd>感官功能开始下降</dd>
<dt>注意</dt><dd>分配能力略降</dd>
<dt>记忆</dt><dd>加工速度下降，语义记忆保持</dd>
<dt>思维</dt><dd><b>流体智力下降、晶体智力稳定或上升</b>；专门知识 / 专长继续提升</dd>
<dt>结论</dt><dd>智力发展的"分化期"</dd>
</dl></div>

<div class="item"><h4>成年晚期 <span>60 岁—</span></h4>
<dl>
<dt>感知觉</dt><dd>视听觉显著衰退</dd>
<dt>记忆</dt><dd><b>加工速度、工作记忆、抑制能力</b>下降；前瞻记忆差</dd>
<dt>思维</dt><dd>认知老化（巴尔特斯：<b>可塑性仍存在</b>）；智慧（柏林智慧模型）</dd>
<dt>结论</dt><dd>老化 ≠ 全面衰退</dd>
</dl></div>

<h2>二、语言发展（纵向）</h2>
<table>
<thead><tr><th>阶段</th><th>关键节点</th></tr></thead>
<tbody>
<tr><td>婴儿期<br>0–1 岁</td><td>前言语阶段：反射性发声 → 咿呀语 → 声音模仿；<b>听（理解）先于说（产生）</b></td></tr>
<tr><td>1–3 岁</td><td><b>单词句</b>（1 岁左右，一词多义）→ <b>双词句 / 电报句</b>（1.5 岁左右）→ <b>词汇爆炸期</b>（18–24 个月）</td></tr>
<tr><td>幼儿期</td><td>词汇量激增（3 岁约 1 千 → 6 岁约 3~4 千）；掌握语法；<b>自我中心言语</b>（皮亚杰） vs <b>内部言语源于外部言语、由社会言语内化</b>（维果茨基）</td></tr>
<tr><td>童年期</td><td><b>书面言语</b>发展（识字—阅读—写作）；内部言语进一步发展</td></tr>
<tr><td>青少年期</td><td>词汇精细化、语用与修辞能力提高</td></tr>
<tr><td>成年期</td><td>语言能力基本保持，<b>词汇量不随年龄衰退</b>（与流体智力曲线不同，是常考点）</td></tr>
</tbody>
</table>

<template id="doc-edu-b" data-subject="edu"><div class="doc" data-title="学习动机（教 13–21）"><div class="item"><h4><span class="num">教13</span>动机概述</h4>
<ul><li>学习动机 = <b>学习需要 + 学习期待</b>（推力 + 拉力）</li>
<li>奥苏贝尔三类内驱力：<b>认知内驱力（最稳定）、自我提高内驱力、附属内驱力</b></li></ul></div>

<div class="item"><h4><span class="num">教14</span>强化理论</h4>
<ul><li>动机 = 外部强化结果；注意<b>德西效应（过度理由效应）</b>：过度外部奖励会削弱内部动机</li></ul></div>

<div class="item"><h4><span class="num">教15</span>需要层次（马斯洛）</h4>
<ul><li>生理 → 安全 → 归属 → 尊重 → 自我实现；<b>缺失需要</b>（前四）与<b>成长需要</b>（自我实现）</li>
<li>启示：先满足缺失需要，学习动机才易激发</li></ul></div>

<div class="item"><h4><span class="num">教16</span>成就动机（阿特金森）</h4>
<ul><li>Ta = Ts − Taf；任务<b>难度 50%</b> 时动机最强</li>
<li>高成就者偏好中等难度；怕失败者偏好很易或很难；麦克利兰用 <b>TAT</b> 测 nAch</li></ul></div>

<div class="item"><h4><span class="num">教17</span>成败归因（韦纳）<span class="tag">简答高频</span></h4>
<ul><li>四因素 × 三维度（内外源、稳定性、可控性）：</li>
<li><b>能力</b>=内部·稳定·不可控｜<b>努力</b>=内部·不稳定·可控｜<b>任务难度</b>=外部·稳定·不可控｜<b>运气</b>=外部·不稳定·不可控</li>
<li>启示：<b>引导"努力"归因</b>（内部、不稳定、可控）最有利；<b>习得性无助</b>（塞利格曼）= 把失败归为内部·稳定·不可控</li></ul></div>

<div class="item"><h4><span class="num">教18</span>自我效能（班杜拉）</h4>
<ul><li>四来源：<b>直接经验（最有力）、替代经验、言语说服、情绪唤醒</b></li>
<li>影响：任务选择、努力程度、坚持性、情绪反应</li>
<li><b>辨析</b>：自我效能 ≠ 自尊（价值评价）≠ 结果期望</li></ul></div>

<div class="item"><h4><span class="num">教19</span>自我价值理论（科温顿）</h4>
<ul><li>学生核心动机是<b>维护自我价值</b>，故常"<b>逃避失败</b>"而非追求成功</li>
<li>四象限：高驱高避（过度努力）｜低驱低避（失败接受者）｜高驱低避（成功定向）｜低驱高避（避免失败）</li>
<li>对策：给成功体验、减少过度竞争、强调掌握而非排名</li></ul></div>

<div class="item"><h4><span class="num">教20</span>目标定向与内隐理论</h4>
<ul><li><b>掌握目标</b>（关注能力增长）vs <b>表现目标</b>（关注证明自己）</li>
<li>德韦克：<b>能力增长观 vs 实体观</b> → 表扬<b>努力</b>而非智力</li>
<li>自我决定理论（德西、瑞安）：三种基本需要 <b>自主、胜任、关系</b></li></ul></div>

<div class="item"><h4><span class="num">教21</span>如何培养学习动机<span class="tag">综合必备</span></h4>
<ul><li>① 明确目标 + 及时反馈　② 创设问题情境、激发求知欲　③ 归因训练（努力归因）</li>
<li>④ 提高自我效能（小步子成功、榜样）　⑤ 合理竞争与合作　⑥ 满足自主需要、给选择权</li>
<li>⑦ 表扬努力与策略　⑧ 利用原有兴趣迁移、适度难度（50%）</li></ul></div></div></template>

<p class="lead">
<b>用法：</b>教心简答的主要形式是"<b>某理论是什么 + 对教学有何启示</b>"。"启示"一栏可直接抄进答题卡。
