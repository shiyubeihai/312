<h2>一、学习理论</h2>

<div class="item"><h4>经典条件作用 <span class="who">巴甫洛夫</span></h4>
<dl>
<dt>核心</dt><dd>无条件刺激、条件刺激、强化、泛化与分化、消退</dd>
<dt>启示</dt><dd>创设愉快学习氛围，避免把学校与焦虑联结；利用泛化与分化教辨别</dd>
<dt>易错</dt><dd>"学校恐惧症"就是经典条件作用</dd>
</dl></div>

<div class="item"><h4>试误说 <span class="who">桑代克</span></h4>
<dl>
<dt>核心</dt><dd><b>准备律、练习律、效果律</b>；学习是刺激—反应联结</dd>
<dt>启示</dt><dd>循序渐进、及时反馈（效果律）、不搞过度惩罚</dd>
<dt>易错</dt><dd>三大律的顺序不要记混</dd>
</dl></div>

<div class="item"><h4>操作条件作用 <span class="who">斯金纳</span></h4>
<dl>
<dt>核心</dt><dd>正强化、负强化、惩罚、消退；<b>强化程式</b></dd>
<dt>启示</dt><dd><b>强化而非惩罚</b>塑造行为；表扬要及时具体；程序教学五原则（小步子、积极反应、及时反馈、自定步速、低错误率）</dd>
<dt>易错</dt><dd><b>负强化 ≠ 惩罚</b>（最常考陷阱）</dd>
</dl></div>

<div class="item"><h4>社会学习理论 <span class="who">班杜拉</span></h4>
<dl>
<dt>核心</dt><dd><b>观察学习四过程</b>：注意—保持—动作再现—动机；<b>自我效能感</b></dd>
<dt>启示</dt><dd>提供榜样示范（同伴榜样最有效）；教师以身作则；提高学生自我效能</dd>
<dt>易错</dt><dd>自我效能四个来源：成功经验、替代经验、言语说服、情绪唤醒</dd>
</dl></div>

<div class="item"><h4>完形—顿悟说 <span class="who">苛勒</span></h4>
<dl>
<dt>核心</dt><dd>学习是<b>顿悟</b>，是对情境关系的整体把握</dd>
<dt>启示</dt><dd>教学要呈现完整情境，创设问题情境</dd>
<dt>易错</dt><dd>与试误说对立（猩猩取香蕉实验）</dd>
</dl></div>

<div class="item"><h4>符号学习论 <span class="who">托尔曼</span></h4>
<dl>
<dt>核心</dt><dd>目的行为、<b>认知地图</b>、潜伏学习</dd>
<dt>启示</dt><dd>重视学习目标与认知结构；允许"学了暂时不表现出来"</dd>
<dt>易错</dt><dd>潜伏学习 = 强化不是必需</dd>
</dl></div>

<div class="item"><h4>认知结构学习论 <span class="who">布鲁纳</span></h4>
<dl>
<dt>核心</dt><dd>学科基本结构、<b>发现学习</b>、三种表征（动作—映像—符号）、编码系统</dd>
<dt>启示</dt><dd>教原理而非事实；引导发现，培养直觉思维</dd>
<dt>易错</dt><dd>发现学习费时，并非万能</dd>
</dl></div>

<div class="item"><h4>有意义接受学习 <span class="who">奥苏贝尔</span></h4>
<dl>
<dt>核心</dt><dd><b>有意义学习</b>标准（实质性、非人为联系）；<b>认知同化</b>；<b>先行组织者</b></dd>
<dt>启示</dt><dd>课前用先行组织者激活旧知；教学强调知识联系与结构；讲授法同样能产生有意义学习</dd>
<dt>易错</dt><dd>"接受学习=机械""发现学习=有意义"都是错的</dd>
</dl></div>

<div class="item"><h4>建构主义</h4>
<dl>
<dt>核心</dt><dd>知识是主动建构的；<b>情境、协作、会话、意义建构</b>；社会文化取向（维果茨基）</dd>
<dt>启示</dt><dd>支架式教学、抛锚式 / 情境教学、合作学习；以学生原有经验为起点</dd>
<dt>易错</dt><dd>分四派：激进、社会、社会文化、信息加工</dd>
</dl></div>

<div class="item"><h4>人本主义 <span class="who">罗杰斯、马斯洛</span></h4>
<dl>
<dt>核心</dt><dd>学生中心、<b>非指导性教学</b>、自我实现、无条件积极关注</dd>
<dt>启示</dt><dd>建立良好师生关系；尊重学生，减少威胁，促进自我实现</dd>
<dt>易错</dt><dd>罗杰斯强调"情感 / 关系"而非技术</dd>
</dl></div>

<h2>二、学习动机</h2>

<div class="item"><h4>强化理论</h4>
<dl><dt>核心</dt><dd>动机 = 外部强化结果</dd>
<dt>启示</dt><dd>适当奖惩</dd>
<dt>易错</dt><dd>易损害内部动机</dd></dl></div>

<div class="item"><h4>需要层次理论 <span class="who">马斯洛</span></h4>
<dl><dt>核心</dt><dd>生理 → 安全 → 归属 → 尊重 → 自我实现</dd>
<dt>启示</dt><dd>先满足缺失需要，学习动机才能激发</dd>
<dt>易错</dt><dd>顺序不可倒</dd></dl></div>

<div class="item"><h4>成就动机理论 <span class="who">阿特金森</span></h4>
<dl><dt>核心</dt><dd>趋向成功倾向 − 避免失败倾向；任务<b>难度 50%</b> 时动机最强</dd>
<dt>启示</dt><dd>任务难度适中；对怕失败者给中等偏易任务</dd>
<dt>易错</dt><dd>与麦克利兰（nAch 测量）区分</dd></dl></div>

<div class="item"><h4>成败归因理论 <span class="who">韦纳</span></h4>
<dl><dt>核心</dt><dd>四原因（能力 / 努力 / 任务难度 / 运气）× 三维度（内外、稳定、可控）</dd>
<dt>启示</dt><dd><b>引导归因于"努力"</b>（内部、不稳定、可控）最有利于后续动机</dd>
<dt>易错</dt><dd>简答高频：归因理论的教育意义</dd></dl></div>

<div class="item"><h4>自我效能理论 <span class="who">班杜拉</span></h4>
<dl><dt>核心</dt><dd>对能否完成某任务的判断</dd>
<dt>启示</dt><dd>成功经验、替代经验、言语说服、情绪唤醒；设小目标</dd>
<dt>易错</dt><dd>自我效能 ≠ 自尊 ≠ 结果期望</dd></dl></div>

<div class="item"><h4>自我价值理论 <span class="who">科温顿</span></h4>
<dl><dt>核心</dt><dd>学生为维护自我价值而<b>逃避失败</b>；四象限（高驱高避、低驱低避等）</dd>
<dt>启示</dt><dd>对"高驱高避"学生给成功体验；避免过度竞争</dd>
<dt>易错</dt><dd>与"习得性无助"联动考</dd></dl></div>

<div class="item"><h4>目标定向理论 <span class="who">德韦克等</span></h4>
<dl><dt>核心</dt><dd><b>掌握目标 vs 表现目标</b>；<b>能力增长观 vs 实体观</b></dd>
<dt>启示</dt><dd>表扬努力而非智力；营造掌握目标课堂</dd>
<dt>易错</dt><dd>常出综合题"如何培养学习动机"</dd></dl></div>

<div class="item"><h4>自我决定理论 <span class="who">德西、瑞安</span></h4>
<dl><dt>核心</dt><dd>三种基本需要：<b>自主、胜任、关系</b>；内在动机 vs 外在动机</dd>
<dt>启示</dt><dd>给选择权、合理反馈、归属感</dd>
<dt>易错</dt><dd>与"德西效应"（过度理由效应）联动</dd></dl></div>

<h2>三、学习迁移</h2>
<table>
<thead><tr><th>理论（人物）</th><th>核心观点</th><th>启示</th></tr></thead>
<tbody>
<tr><td>形式训练说</td><td>训练官能即迁移</td><td>已被否定，但奠定"能力训练"思想</td></tr>
<tr><td><b>共同要素说</b><br>桑代克、伍德沃斯</td><td>两情境有共同要素才有迁移</td><td>教学要找共同点</td></tr>
<tr><td><b>概括化理论</b><br>贾德（水下打靶）</td><td>迁移取决于<b>原理的概括</b></td><td>教原理、教方法</td></tr>
<tr><td>关系转换说<br>格式塔（苛勒）</td><td>迁移是对<b>关系</b>的领悟</td><td>强调情境关系理解</td></tr>
<tr><td><b>认知结构迁移</b><br>奥苏贝尔</td><td>取决于认知结构三变量：可利用性、可辨别性、稳定性</td><td>先行组织者、比较性组织者</td></tr>
<tr><td>产生式迁移<br>安德森</td><td>程序性知识的重叠</td><td>技能训练要自动化</td></tr>
</tbody>
</table>

<h2>四、知识学习 / 技能 / 策略 / 问题解决</h2>
<table>
<thead><tr><th>主题</th><th>要点</th></tr></thead>
<tbody>
<tr><td><b>知识分类</b></td><td>陈述性（是什么，可用言语陈述）vs 程序性（怎么做，产生式）；二者可转化</td></tr>
<tr><td><b>概念学习</b></td><td>概念形成（归纳）vs 概念同化（演绎，奥苏贝尔）；错误概念的转变（认知冲突、类比）</td></tr>
<tr><td><b>动作技能形成</b></td><td>菲茨、波斯纳三阶段：<b>认知阶段 → 联系形成阶段 → 自动化阶段</b>；练习与反馈、过度学习</td></tr>
<tr><td><b>学习策略</b></td><td><b>认知策略</b>：复述、精加工、组织；<b>元认知策略</b>：计划、监控、调节；<b>资源管理策略</b>：时间、环境、努力、他人支持</td></tr>
<tr><td><b>问题解决</b></td><td>策略：算法 vs 启发式；影响因素：知识经验、定势与功能固着、动机强度（<b>耶克斯–多德森</b>：中等动机最有利）、问题表征</td></tr>
<tr><td><b>创造性</b></td><td>吉尔福特<b>发散思维三特性：流畅性、变通性、独创性</b>；头脑风暴四原则（延迟评判、自由想象、多多益善、组合改进）</td></tr>
</tbody>
</table>

<h2>五、态度与品德 / 教学与教师</h2>
<table>
<thead><tr><th>主题</th><th>要点</th></tr></thead>
<tbody>
<tr><td><b>态度与品德形成</b></td><td>三阶段：<b>依从 → 认同 → 内化</b>（凯尔曼）；启示：榜样示范、价值澄清、移情训练、行为强化</td></tr>
<tr><td><b>教学目标</b></td><td>布卢姆分类：认知 / 情感 / 动作技能（认知 6 级：知识、领会、应用、分析、综合、评价）</td></tr>
<tr><td><b>课堂管理</b></td><td>课堂气氛、群体动力、问题行为处理</td></tr>
<tr><td><b>教师成长</b></td><td>福勒、布朗：<b>关注生存 → 关注情境 → 关注学生</b></td></tr>
<tr><td><b>教师期望</b></td><td>罗森塔尔效应（皮格马利翁效应）：期望通过师生互动传递，产生自我实现预言</td></tr>
</tbody>
</table>

<template id="doc-exp-1" data-subject="exp"><div class="doc" data-title="三章总览"><p class="sub">实验心理学骨架　│　★＝312 高频　│　本页只建立逻辑链，细节见 E2–E4</p>
<div class="note"><b>逻辑链</b>：变量与控制（有哪些变量、干扰从哪来）→ 设计类型（被试与条件怎么排布）→ 效度（结论能推到多远、推给谁）。<b>控制是设计的手段，设计是效度的前提</b>——不是三个并列章节，是同一件事的三个阶段。</div>
<h2>主干导图</h2>
<div class="mm"><div class="root">实验心理学（基础篇）</div>
<ul>
<li><b>一 · 变量与控制</b>
<ul class="less">
<li>四类变量：自变量 / 因变量 / 额外变量（含控制变量、混淆变量）/ 中介变量</li>
<li>自变量三来源：刺激特点 · 被试特点（只能选，不能操纵）· 暂时造成的被试差别</li>
<li>因变量指标三标准：有效性 · 客观性 · 数量化 ★</li>
<li>额外变量控制六法：消除 · 恒定 · 平衡 · 抵消 · 随机化 · 统计控制 ★</li>
<li>主试效应（期望效应 / 罗森塔尔）｜ 被试效应（霍桑 · 安慰剂 · 要求特征 · 约翰·亨利）</li>
</ul></li>
<li><b>二 · 实验设计类型</b>
<ul class="less">
<li>按被试分配：<b>被试间</b>（随机组 / 匹配组）· <b>被试内</b> · <b>混合</b> ★</li>
<li>按因素数：单因素（≥2 水平）· 多因素（2×2：主效应 + 交互）★</li>
<li>按控制严密程度：前实验 · 真实验 · 准实验（关键差别＝能否随机分配）★</li>
<li>小样本设计：ABA · ABAB · 多基线</li>
</ul></li>
<li><b>三 · 实验效度</b>
<ul class="less">
<li>内部效度：8 类威胁 ★</li>
<li>外部效度：总体（人）· 生态（境）· 时间（时）</li>
<li>构念效度：操作定义是否真对应理论概念</li>
<li>统计结论效度：统计推断本身是否靠得住</li>
</ul></li>
</ul></div>

<template id="doc-exp-2" data-subject="exp"><div class="doc" data-title="变量与实验控制"><h2>导图</h2>
<div class="mm"><div class="root">变量与控制</div>
<ul>
<li><b>1 · 变量四分</b>
<ul>
<li><b>自变量</b>：主试操纵、假定为原因，须 ≥2 水平且有操作定义
<ul class="less"><li>刺激特点（难度、材料、呈现时间）</li><li>被试特点（年龄、性别、智力）→ <b>只能选择，不能操纵 → 准实验</b> ★</li><li>暂时造成的被试差别（指导语、疲劳、情绪诱导）</li></ul></li>
<li><b>因变量</b>：随自变量变化而被测量的指标
<ul class="less"><li>常用：反应时 · 正确率 · 反应频率 · 评定等级 · 生理指标（眼动、ERP、fMRI、皮电）</li><li>三标准：<b>有效性 · 客观性 · 数量化</b> ★</li></ul></li>
<li><b>额外变量</b>：自变量之外、可能影响因变量的变量；未被控制即成为<b>混淆变量</b></li>
<li><b>中介变量</b>：自变量影响因变量的内在机制，不可直接观察</li>
</ul></li>
<li><b>2 · 控制六法</b>（见下表）★</li>
<li><b>3 · 主试与被试效应</b>
<ul class="less">
<li>主试：期望效应 / 罗森塔尔 → 双盲、标准化指导语、主试培训</li>
<li>被试：霍桑（被观察而改变）· 安慰剂 · 要求特征 · 约翰·亨利效应</li>
<li>手段：<b>双盲</b>（同时控双方）· <b>单盲</b>（通常控被试）· 自动化呈现 · 安慰剂控制组</li>
</ul></li>
</ul></div>
<h2>关键概念</h2>
<table>
<thead><tr><th>概念</th><th>一句话定义</th><th>易错／考点</th></tr></thead>
<tbody>
<tr><td class="k">自变量</td><td>由主试操纵、假定引起因变量变化的变量</td><td>被试特点自变量不可操纵，“选择”≠“操纵”</td></tr>
<tr><td class="k">因变量</td><td>随自变量变化而被测量的行为或生理指标</td><td>指标≠概念：“记忆”要靠再认率、回忆量落地</td></tr>
<tr><td class="k">额外变量</td><td>自变量之外可能影响因变量的变量</td><td>与自变量<b>共变</b>时才叫混淆变量</td></tr>
<tr><td class="k">控制变量</td><td>被恒定或平衡处理的额外变量</td><td>“控制”≠“消除”：它仍在误差里，只是处处相等</td></tr>
<tr><td class="k">混淆变量</td><td>与自变量一起变化的额外变量</td><td>须在设计阶段排除，不能靠事后统计补</td></tr>
<tr><td class="k">中介变量</td><td>解释自变量为何影响因变量的内在过程</td><td>中介是“通过它”，调节是“取决于它”</td></tr>
<tr><td class="k">要求特征</td><td>被试揣测目的后改变行为的倾向</td><td>属<b>被试效应</b>，不是主试效应</td></tr>
</tbody></table>
<h2>额外变量控制六法</h2>
<table>
<thead><tr><th>方法</th><th>做法</th><th>可操作例子</th><th>代价／局限</th></tr></thead>
<tbody>
<tr><td class="k">消除法</td><td>把额外变量从情境中彻底去掉</td><td>隔音室做听觉实验</td><td>情境失真，生态效度下降</td></tr>
<tr><td class="k">恒定法</td><td>让额外变量在所有条件下保持同一水平</td><td>全部被试同一时段、同一照度、同一主试</td><td>结论不能外推到该变量其他水平</td></tr>
<tr><td class="k">平衡法</td><td>让额外变量在各条件下均衡出现</td><td>随机分配；按前测配对；拉丁方安排顺序</td><td>需较大样本才均衡得起来</td></tr>
<tr><td class="k">抵消法</td><td>用相反顺序抵消顺序效应</td><td>ABBA：一半先 A 后 B，一半先 B 后 A</td><td>只适用于可重复、耗时短的作业</td></tr>
<tr><td class="k">随机化法</td><td>随机分配被试、随机安排刺激与顺序</td><td>抽签分组；刺激随机呈现</td><td>小样本时随机化不充分</td></tr>
<tr><td class="k">统计控制法</td><td>事后用统计手段剔除影响</td><td>协方差分析 ANCOVA、偏相关、剔除极端值</td><td>不能替代设计；违反假设会失真</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>霍桑、安慰剂、要求特征都是<b>被试效应</b>；罗森塔尔期望效应是<b>主试效应</b>。</li>
<li>拉丁方解决的是<b>顺序效应</b>，不是个体差异——个体差异靠随机化或匹配。</li>
<li>双盲同时控主试与被试效应；单盲只控一方（通常是被试）。</li>
<li>性别、年龄、智力这类自变量只能“选择”，故属准实验而非真实验。</li>
<li>因变量指标不合格的典型症状：只记“反应时”，忘了它必须能区分各水平（有效性）。</li>
</ol>
<div class="foot"><b>考法</b>：选择（哪个是需控制的额外变量）· 简答（控制额外变量的方法）· 设计题（如何控制××效应）。</div>
</div>

<template id="doc-exp-3" data-subject="exp"><div class="doc" data-title="实验设计类型"><h2>导图</h2>
<div class="mm"><div class="root">实验设计类型</div>
<ul>
<li><b>A · 按被试分配</b>★
<ul>
<li><b>被试间设计</b>（独立样本）：每组只接受一个水平
<ul class="less"><li>随机组：随机分配 → 组间差异期望为零</li><li>匹配组：先按与因变量高相关的变量配对，再随机分入各组</li><li>优：无练习、疲劳、顺序效应｜劣：个体差异进误差项，需大样本</li></ul></li>
<li><b>被试内设计</b>（重复测量）：每个被试接受全部水平
<ul class="less"><li>优：个体差异被剔除，效力高，省被试</li><li>劣：顺序效应、练习、疲劳、遗留效应</li><li>对策：ABBA 抵消 · 拉丁方 · 随机化顺序 · 洗脱期</li></ul></li>
<li><b>混合设计</b>：一个因素被试间、另一个被试内 ★</li>
</ul></li>
<li><b>B · 按因素数目</b>：单因素（≥2 水平）｜多因素（2×2：A 主效应 + B 主效应 + A×B）</li>
<li><b>C · 按控制严密程度</b>
<ul class="less">
<li>前实验：无对照或单组后测，因果推断最弱</li>
<li>真实验：<b>随机分配 + 对照</b></li>
<li>准实验：<b>不能随机分配</b>（不等组前后测、中断时间序列、回归不连续）★</li>
<li>具体设计：实验组控制组前后测、<b>所罗门四组</b>（分离前测敏感化）</li>
</ul></li>
<li><b>D · 小样本设计</b>：ABA（基线—处理—撤除）· ABAB（倒返）· 多基线</li>
</ul></div>
<h2>四步判定流程</h2>
<div class="flow"><b>① 数自变量</b>：1 个 → 单因素；≥2 个 → 多因素<br>
<b>② 每个自变量是否在同一批被试身上施加全部水平</b>：全是 → 被试内；全否 → 被试间；部分是 → <b>混合</b>（须分别说明哪个间哪个内）<br>
<b>③ 被试能否随机分配</b>：不能（原有班级、临床组）→ 准实验<br>
<b>④ 有无前测、对照如何设</b>：担心前测敏感化 → 所罗门四组；无对照 → 前实验</div>
<h2>被试间 vs 被试内（八维对照）</h2>
<table>
<thead><tr><th>维度</th><th>被试间</th><th>被试内</th></tr></thead>
<tbody>
<tr><td class="k">误差来源</td><td>含个体差异</td><td>个体差异被剔除，只剩残差</td></tr>
<tr><td class="k">样本量需求</td><td>大（组间差异被个体差异淹没）</td><td>小（同批被试自身对照）</td></tr>
<tr><td class="k">顺序／练习效应</td><td>无</td><td>有，必须平衡</td></tr>
<tr><td class="k">遗留效应</td><td>无</td><td>有（前一处理影响后一处理）</td></tr>
<tr><td class="k">适用条件</td><td>处理不可逆、有强学习效应</td><td>处理可逆、作业可重复</td></tr>
<tr><td class="k">统计方法</td><td>独立样本 t / 完全随机 ANOVA</td><td>配对 t / 重复测量 ANOVA</td></tr>
<tr><td class="k">耗时</td><td>长（需凑人数）</td><td>短（每人多跑几轮）</td></tr>
<tr><td class="k">主要威胁</td><td>组间初始不等（选择偏差）</td><td>顺序效应与疲劳</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>“被试内”不等于“同一被试做了两次”，必须是<b>每个被试接受全部水平</b>。</li>
<li>混合设计必须点明“××为被试间因素、××为被试内因素”，不点明等于没答。</li>
<li>准实验的判据是<b>不能随机分配被试</b>，不是“没有前测”。</li>
<li>匹配组设计的匹配依据应是<b>与因变量高相关</b>的变量。</li>
<li>2×2 出现<b>交叉交互</b>时，“主效应显著”可能没有实际意义。</li>
<li>ABAB 比 ABA 多一次处理复现，用来排除“基线变化是偶然造成”。</li>
</ol>
<div class="foot"><b>考法</b>：设计类型判断 · 给情境选设计并说明理由 · 指出额外变量及控制方法 · 大题“请设计一个实验验证××”（→ 用 E13 模板）。</div>
</div>

<template id="doc-exp-4" data-subject="exp"><div class="doc" data-title="实验效度"><h2>导图</h2>
<div class="mm"><div class="root">实验效度</div>
<ul>
<li><b>内部效度</b>：因变量的变化能否归因于自变量 ★
<ul class="less"><li>8 类威胁：历史 · 成熟 · 测验 · 测量工具 · 统计回归 · 被试选择 · 被试流失 · 选择×成熟</li></ul></li>
<li><b>外部效度</b>：能推广给谁、什么情境、什么时间
<ul class="less"><li>总体效度（人）· 生态效度（境）· 时间效度（时）</li></ul></li>
<li><b>构念效度</b>：自变量操纵与因变量测量是否真的对应理论概念
<ul class="less"><li>威胁：概念混淆 · 单一操作偏差 · 单一方法偏差 · 实验者期望</li></ul></li>
<li><b>统计结论效度</b>：统计推断本身是否靠得住
<ul class="less"><li>威胁：统计效力低 · 违反检验假设 · 多重比较 · 测量信度低 · 情境偶然性</li></ul></li>
</ul></div>
<h2>内部效度八威胁 → 排除设计</h2>
<table>
<thead><tr><th>威胁</th><th>典型情境</th><th>排除设计</th></tr></thead>
<tbody>
<tr><td class="k">历史</td><td>前后测之间发生外部事件（新闻、疫情、政策）</td><td>设对照组；缩短前后测间隔</td></tr>
<tr><td class="k">成熟</td><td>被试自身随时间变化（生长、疲劳、饥饿）</td><td>设对照组；随机分配</td></tr>
<tr><td class="k">测验</td><td>前测带来的练习与敏感化</td><td>所罗门四组；改后测-only</td></tr>
<tr><td class="k">测量工具</td><td>仪器漂移、评分者标准变化</td><td>校准仪器；评分者一致性训练；双评</td></tr>
<tr><td class="k">统计回归</td><td>按极端分数挑被试，之后向均值回落</td><td>按前测分数分层随机；必设对照组</td></tr>
<tr><td class="k">被试选择</td><td>组间初始就不同（非随机分组）</td><td>随机分配；匹配；以前测为协变量</td></tr>
<tr><td class="k">被试流失</td><td>中途退出，且退出与处理条件有关</td><td>降低流失；比较流失者特征；意向性分析</td></tr>
<tr><td class="k">选择×成熟</td><td>两组自然变化速度不同（如实验组是新生）</td><td>随机分配；设对照组</td></tr>
</tbody></table>
<h2>四类效度辨析</h2>
<table>
<thead><tr><th>效度</th><th>回答的问题</th><th>关系／易错</th></tr></thead>
<tbody>
<tr><td class="k">内部效度</td><td>因果推断成立吗？</td><td>是外部效度的<b>必要非充分</b>前提</td></tr>
<tr><td class="k">外部效度</td><td>能推广给谁、到哪、何时？</td><td>提高内部效度常以牺牲生态效度为代价</td></tr>
<tr><td class="k">构念效度</td><td>操纵与测量真对应那个概念吗？</td><td>≠ 心理测量中的“测验效度”，指实验操作的概念对应</td></tr>
<tr><td class="k">统计结论效度</td><td>统计推断做得对吗？</td><td>低统计结论效度≠低内部效度：前者“检验没做对”，后者“因果归因错”</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>“统计回归”是极端分数自然回落，<b>不是回归分析</b>。</li>
<li>只写“被试流失”不算威胁，必须是<b>差异性流失</b>（与处理条件相关）。</li>
<li>外部效度不是独立地“越大越好”，它与内部效度常相互牵制。</li>
<li>构念效度关注<b>操作与概念的对应</b>，不要答成“量表有没有测准”。</li>
<li>答题三步：<b>指出威胁类型 → 说明在本题情境中如何产生 → 给 1 条可操作的排除设计</b>。缺一步扣分。</li>
</ol>
<div class="foot"><b>考法</b>：情境题（指出威胁了哪类效度）· 简答（内部效度的威胁因素）· 设计题末问“本设计有哪些效度问题、如何改进”。</div>
</div>

<template id="doc-exp-5" data-subject="exp"><div class="doc" data-title="概述 · 研究方法 · 伦理"><p class="sub">312 以选择与简答为主　│　★高频　○只需知道名字</p>
<h2>导图</h2>
<div class="mm"><div class="root">实验心理学概述</div>
<ul>
<li><b>1 · 学科史</b>★
<ul class="less">
<li>1879 冯特在莱比锡建第一个心理学实验室 → 科学心理学诞生</li>
<li>费希纳 1860《心理物理学纲要》：阈限三法与韦伯—费希纳定律</li>
<li>赫尔姆霍兹：首次测量神经冲动传导速度；三色说、听觉共鸣说</li>
<li>唐德斯 1868：A、B、C 三种反应时与减法逻辑</li>
<li>艾宾浩斯 1885《论记忆》：无意义音节、节省法、遗忘曲线</li>
<li>铁钦纳：构造主义、实验内省法｜华生：行为主义，拒斥内省、只研究可观察行为</li>
<li>格式塔（韦特海默 1912 似动）：整体大于部分之和，反对元素分析</li>
<li>信息加工取向（1950s–60s）：<b>反应时成为推断内部加工的核心指标</b></li>
</ul></li>
<li><b>2 · 研究方法</b>
<ul class="less">
<li><b>实验法</b>：操纵自变量 + 控制额外变量 + 随机分配 → 可作因果推断★</li>
<li><b>准实验</b>：不能随机分配 → 因果推断受限★</li>
<li><b>相关法</b>：只看共变，不能确定因果★</li>
<li>观察法 · 个案法 · 调查法 · 测验法（描述与相关性质）</li>
</ul></li>
<li><b>3 · 实验伦理</b>★
<ul class="less">
<li>知情同意 · 免于身心伤害 · 隐私保密 · 欺骗的严格条件（必要、无替代、风险极小、<b>事后解释</b>）· 可随时退出 · 伦理审查</li>
<li>动物实验 3R：替代 Replace · 减少 Reduce · 优化 Refine</li>
</ul></li>
<li><b>4 · 好实验的判据</b>：可重复 · 可验证 · 控制严谨 · 有理论依据 · 结果可量化</li>
</ul></div>
<h2>关键概念</h2>
<table>
<thead><tr><th>概念</th><th>一句话定义</th><th>易错／考点</th></tr></thead>
<tbody>
<tr><td class="k">实验法</td><td>操纵自变量、控制额外变量、观察因变量变化</td><td>因果推断的关键是<b>操纵＋控制</b>，不是“有数据”</td></tr>
<tr><td class="k">相关法</td><td>测量两变量、看其共变程度</td><td>r 高<b>不能</b>证明因果，可能是第三变量</td></tr>
<tr><td class="k">准实验</td><td>有操纵与控制、但不能随机分配被试</td><td>判据是“不能随机分配”，不是“没有前测”</td></tr>
<tr><td class="k">操作定义</td><td>用可观察、可测量的操作界定概念</td><td>“智力＝瑞文测验得分”即操作定义</td></tr>
<tr><td class="k">实验内省</td><td>严格控制条件下报告即时意识经验</td><td>行为主义反对的正是它，不是实验法</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>1879 是<b>实验室建立／学科独立</b>之年；艾宾浩斯 1885 才打开“高级心理过程可实验”之门。</li>
<li>“相关不等于因果”的规范表述：相关只说明共变，实验才能确立因果。</li>
<li>欺骗在伦理上<b>不是绝对禁止</b>：必须必要、无替代、风险极小、事后充分解释，四者同时满足。</li>
<li>行为主义反对内省，但<b>不反对实验法</b>，反而把实验法推得更彻底。</li>
<li>动物实验是 3R，不是“3C”；Reduce 指减少数量，Refine 指减轻痛苦。</li>
</ol>
<div class="foot"><b>考法</b>：选择（谁在何时做了什么）· 简答（实验法与相关法的区别）· 伦理情境判断题。</div>
</div>

<template id="doc-exp-6" data-subject="exp"><div class="doc" data-title="反应时法"><h2>导图</h2>
<div class="mm"><div class="root">反应时（RT）</div>
<ul>
<li><b>1 · 定义与构成</b>：刺激呈现到反应开始；含感受器—传入—中枢加工—传出—肌肉反应，<b>实验真正关心中枢加工部分</b></li>
<li><b>2 · 三种反应时</b>★
<ul class="less"><li>简单：一种刺激 → 一种固定反应</li><li>辨别：多种刺激 → 只对其中一个反应（需辨别，不需选择）</li><li>选择：多种刺激 → 对应多种反应（辨别＋选择）</li><li>复杂程度：简单 &lt; 辨别 &lt; 选择；A/B/C 三种反应时＝简单/选择/辨别</li></ul></li>
<li><b>3 · 影响因素</b>
<ul class="less"><li>刺激：强度（弱→强缩短，达一定强度后趋稳）· 复杂程度 · 相似性 · 呈现方式</li><li>被试：练习 · 准备状态（过长过短都变慢）· 动机情绪 · 疲劳 · 年龄 · 个体差异 · 药物</li><li>环境：照明、噪音、温度</li></ul></li>
<li><b>4 · 速度—准确性权衡</b>★：快则错多，准则时延；<b>报告 RT 必须同时报告错误率</b></li>
<li><b>5 · 三种技术</b>★
<ul class="less">
<li><b>减法法</b>（唐德斯）：两任务只差一个阶段，相减得该阶段耗时</li>
<li><b>加法法</b>（斯滕伯格）：两因素<b>有交互 → 同阶段；无交互 → 不同阶段</b></li>
<li><b>开窗法</b>（汉密尔顿与霍基字母转换）：让各阶段时间上分离，直接读时</li>
</ul></li>
<li><b>6 · 经典应用</b>
<ul class="less">
<li>心理旋转（谢帕德与梅茨勒）：角度与 RT 线性 → 表象是类比性加工</li>
<li>短时记忆搜索（斯滕伯格）：RT 随集合大小<b>线性上升 → 系列、穷尽式扫描</b></li>
<li>加工分离说（雅各布森）：包含测验与排除测验分离意识与无意识</li>
<li>Stroop：自动化加工与控制的冲突</li>
</ul></li>
</ul></div>
<h2>三种技术对比</h2>
<table>
<thead><tr><th>技术</th><th>核心逻辑</th><th>优点</th><th>最大弱点</th></tr></thead>
<tbody>
<tr><td class="k">减法法</td><td>两任务只差一个阶段，相减得该阶段</td><td>逻辑直观，可分解加工序列</td><td><b>“纯插入”假设</b>：任务可能改变其他阶段</td></tr>
<tr><td class="k">加法法</td><td>看两因素是否交互来判定是否同阶段</td><td>不依赖纯插入，可验证阶段独立性</td><td>需多因素设计；“无交互＝不同阶段”是推论</td></tr>
<tr><td class="k">开窗法</td><td>让各阶段依次外显，直接读时</td><td>最接近“看见加工”</td><td>作业特殊，练习与策略影响大，外推受限</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li><b>加法法判据是交互作用</b>：有交互＝同一阶段；无交互＝不同阶段。方向极易记反。</li>
<li>斯滕伯格结论是<b>系列且穷尽</b>扫描（斜率恒定），不是平行扫描、不是自我终止。</li>
<li>简单反应时不是“0”，它含感觉与肌肉的固定成分，故有下限。</li>
<li>只报 RT 不报错误率＝实验无法解释；两组差异可能只是权衡策略不同。</li>
<li>RT 数据通常右偏，报告用<b>中数</b>或剔除极端值后的均值。</li>
</ol>
<div class="foot"><b>考法</b>：选择（技术判据、经典实验结论）· 简答（减法法与加法法的区别与局限）· 设计题（如何用 RT 分离两个加工阶段）。</div>
</div>

<template id="doc-exp-7" data-subject="exp"><div class="doc" data-title="传统心理物理学与心理量表法"><h2>导图</h2>
<div class="mm"><div class="root">传统心理物理学</div>
<ul>
<li><b>1 · 感觉阈限</b>★
<ul class="less">
<li>绝对阈限：<b>50% 概率</b>引起感觉的刺激强度</li>
<li>差别阈限：50% 概率觉察的最小差异；由上限、下限、<b>PSE</b>、<b>IU</b> 描述</li>
<li><b>DL＝(上限−下限)/2；PSE＝(上限＋下限)/2；IU＝上限−下限</b></li>
</ul></li>
<li><b>2 · 测阈限三法</b>★
<ul class="less">
<li><b>极限法</b>（最小变化法）：递增递减系列交替，找转折点取均值</li>
<li><b>恒定刺激法</b>：5–7 个固定刺激，大量随机呈现，50% 点用直线内插</li>
<li><b>平均差误法</b>：被试自行调整至主观相等，AE＝Σ|X−S|/n</li>
</ul></li>
<li><b>3 · 三大定律</b>★
<ul class="less">
<li><b>韦伯</b>：ΔI/I＝K（仅中等强度成立；K 因通道而异）</li>
<li><b>费希纳</b>：S＝K·lgI（前提：韦伯成立＋JND 等距可累加）</li>
<li><b>史蒂文斯</b>：S＝K·Iⁿ（数量估计法直接测；n&lt;1 压缩、n&gt;1 扩张）</li>
</ul></li>
<li><b>4 · 心理量表</b>
<ul class="less">
<li>顺序量表：对偶比较（配对数 n(n−1)/2，重复 m 次则 m·n(n−1)/2）· 等级排列 → 只能比大小</li>
<li>等距量表：感觉等距法（二分法）· 差别阈限法 → 可加减，不可乘除</li>
<li>比例量表：数量估计法 → 四则运算皆可</li>
</ul></li>
<li><b>5 · 误差</b>：习惯/期望（方向相反，交替抵消）· 练习/疲劳（ABBA）· 常误 · 空间误差（左右交替）· 时间误差（正反顺序交替）· 序列效应（随机化）</li>
</ul></div>
<h2>三法比较</h2>
<table>
<thead><tr><th>方法</th><th>程序</th><th>阈限计算</th><th>主要误差与对策</th></tr></thead>
<tbody>
<tr><td class="k">极限法</td><td>递增递减交替，记转折点</td><td>各系列转折点均值；差别阈限用上下限</td><td><b>习惯/期望误差</b>→ 交替；练习疲劳 → ABBA</td></tr>
<tr><td class="k">恒定刺激法</td><td>5–7 个固定刺激，随机呈现数十至上百次</td><td>50% 点<b>直线内插</b>；差别阈限用 <b>75% 与 25%</b> 点</td><td>练习疲劳时间误差 → 随机化；刺激数目与间距影响精度</td></tr>
<tr><td class="k">平均差误法</td><td>被试调整比较刺激至自觉相等</td><td>AE＝Σ|X−S|/n；亦可用 PSE</td><td><b>动作误差</b>、时间空间误差 → 改起点、左右交替</td></tr>
</tbody></table>
<h2>三大定律对比</h2>
<table>
<thead><tr><th>定律</th><th>公式</th><th>成立前提</th><th>局限</th></tr></thead>
<tbody>
<tr><td class="k">韦伯</td><td>ΔI/I＝K</td><td>中等强度范围</td><td>强弱两端失效；K 因通道而异</td></tr>
<tr><td class="k">费希纳</td><td>S＝K·lgI</td><td>韦伯成立＋<b>JND 等距可累加</b></td><td>JND 未必等距；属间接推论</td></tr>
<tr><td class="k">史蒂文斯</td><td>S＝K·Iⁿ</td><td>数量估计法<b>直接</b>测心理量</td><td>受策略与呈现方式影响；n 随情境变</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>绝对阈限与差别阈限都定义在 <b>50% 概率</b>，但一为“觉察到”、一为“觉察到差异”。</li>
<li>求绝对阈限用 <b>50% 点</b>；求差别阈限用 <b>75%／25% 点</b>——这是最常混的一处。</li>
<li>极限法的习惯与期望误差<b>方向相反</b>，交替呈现才能相互抵消。</li>
<li>费希纳两前提是简答常客：韦伯成立、JND 等距可累加。</li>
<li>幂定律 n&lt;1 压缩（亮度）、n&gt;1 扩张（电击）、n＝1 线性（长度）。</li>
<li>平均差误法的 AE 是<b>平均差误</b>，与标准差、平均差（AD）都不是一回事。</li>
</ol>
<div class="foot"><b>考法</b>：计算（三法求阈限、AE、PSE、配对数）· 选择（某误差属哪种方法）· 简答（三法优缺点、费希纳与史蒂文斯之争）。</div>
</div>

<template id="doc-exp-8" data-subject="exp"><div class="doc" data-title="信号检测论"><h2>导图</h2>
<div class="mm"><div class="root">信号检测论</div>
<ul>
<li><b>1 · 核心思想</b>★：刺激总伴随噪音；<b>把感受性（d′）与判断标准（β）分离</b>——对经典阈限观的根本修正</li>
<li><b>2 · 四种结果</b>★：击中 H · 虚报 FA · 漏报 M · 正确拒绝 CR</li>
<li><b>3 · 两个核心指标</b>★
<ul class="less">
<li><b>d′＝Z(击中率)−Z(虚报率)</b>：感受性，越大越敏感</li>
<li><b>β＝φ(Z_H)/φ(Z_FA)</b>：判断标准，&gt;1 偏严、&lt;1 偏宽、＝1 居中</li>
<li>标准化指标 <b>C＝−[Z(H)＋Z(FA)]/2</b>，以标准差为单位，&gt;0 偏严</li>
</ul></li>
<li><b>4 · ROC 曲线</b>★
<ul class="less">
<li>纵轴＝击中率，横轴＝虚报率；<b>越靠左上 d′ 越大</b></li>
<li>d′ 不变时改 β，工作点<b>沿同一条曲线移动</b></li>
<li>对角线（P(H)＝P(FA)）对应 d′＝0，即纯猜测；<b>AUC＝0.5 为纯猜测</b></li>
<li>作图：改变奖惩/先验概率/指导语得多轮，各算 H 与 FA 后描点</li>
</ul></li>
<li><b>5 · 影响因素</b>
<ul class="less">
<li>影响 d′：刺激强度、信号与噪音差异、注意与疲劳、通道、练习</li>
<li>影响 β：<b>动机、奖惩、先验概率、指导语</b>（代价—收益结构）</li>
</ul></li>
<li><b>6 · 模型假设</b>：信号与噪音均正态、<b>方差相等</b>；方差不齐时 d′ 不恒定，改用 d_a 或 A_z</li>
<li><b>7 · 应用</b>：再认记忆 · 痛觉听觉检测 · 警戒与注意 · 临床诊断 · 工业质检</li>
</ul></div>
<h2>2×2 结果矩阵</h2>
<table>
<thead><tr><th></th><th>报告“有信号”</th><th>报告“无信号”</th></tr></thead>
<tbody>
<tr><td class="k">信号＋噪音</td><td>击中 H（Hit）</td><td>漏报 M（Miss）</td></tr>
<tr><td class="k">仅噪音</td><td>虚报 FA（False Alarm）</td><td>正确拒绝 CR</td></tr>
</tbody></table>
<h2>d′ 与 β 必须分清</h2>
<table>
<thead><tr><th>指标</th><th>测什么</th><th>怎么变</th><th>题干典型说法</th></tr></thead>
<tbody>
<tr><td class="k">d′</td><td>感受性／辨别力</td><td>随信号噪音差异、注意、疲劳而变</td><td>“变敏感”“分辨得更好”</td></tr>
<tr><td class="k">β</td><td>判断标准／反应偏向</td><td>随奖惩、先验概率、指导语而变</td><td>“更保守/更冒险”“更愿说‘有’”</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li><b>d′ 与 β 相互独立</b>：提高奖励使 β 下降，但 d′ 不变。最高频判断题。</li>
<li>ROC 上移动≠感受性变化；只有曲线整体位置变才是 d′ 改变。</li>
<li>击中率＝1 或虚报率＝0 时 Z 无定义，须校正（用 1−1/(2N)、1/(2N) 替代）。</li>
<li>SDT 认为<b>不存在固定阈限</b>，只有连续感受性加判断标准。</li>
<li>单次试验无法算 d′，必须多次试验得比率。</li>
<li>再认实验里“旧项目”是信号，“新项目”是噪音；说“旧”＝报告有信号。</li>
</ol>
<div class="foot"><b>考法</b>：计算（给 H、FA 求 d′、β、C）· 选择（什么影响 d′、什么影响 β）· 简答（SDT 与传统阈限理论的区别、ROC 三条结论）。</div>
</div>

<template id="doc-exp-9" data-subject="exp"><div class="doc" data-title="听觉实验与视觉实验"><p class="sub">312 以选择题为主　│　本页目标：<b>现象—理论—方法 三者能配对</b>　│　★高频　○只需知道名字</p>
<h2>导图 · 听觉</h2>
<div class="mm"><div class="root">听觉</div>
<ul>
<li><b>物理量 → 心理量</b>★：频率→音高 · 振幅→响度 · 波形→音色</li>
<li><b>等响曲线</b>（phon）：不同频率达同样响度所需声压级不同 → 响度不只由振幅决定</li>
<li><b>听觉阈限</b>：听阈 · 痛阈；二者之间为可听范围</li>
<li><b>适应 vs 疲劳</b>：适应短时可恢复（敏感度上升、阈限下降）；疲劳恢复慢，属损伤性</li>
<li><b>听觉掩蔽</b>★：一声音使另一声音阈限升高
<ul class="less"><li>类型：纯音掩蔽 · 噪声掩蔽 · 中枢掩蔽</li><li>规律：频率<b>接近时掩蔽最大</b>；<b>低频对高频掩蔽更强</b></li></ul></li>
<li><b>听觉定位</b>：时间差（主要）· 强度差 · 相位差；衍生双耳分听</li>
<li>听觉理论（地点/行波说 · 频率说 · 排放说）<b>○ 只记名字与一句话</b></li>
</ul></div>
<h2>导图 · 视觉</h2>
<div class="mm"><div class="root">视觉</div>
<ul>
<li><b>感受器</b>★：<b>视杆</b>（暗视觉、无彩色、敏感度高）· <b>视锥</b>（明视觉、辨色、视敏度高）</li>
<li><b>暗适应 / 明适应</b>：暗适应曲线含视锥段与视杆段，<b>视杆段最终敏感度更高</b>；明适应快得多</li>
<li><b>浦肯野现象</b>★：暗视觉下光谱敏感峰<b>向短波（蓝绿）移动</b></li>
<li><b>视敏度</b>：分辨最小细节；常用恒定刺激法或极限法</li>
<li><b>闪光融合频率 CFF</b>★：断续光被知觉为连续的临界频率；典型用<b>极限法</b>；受强度、面积、年龄、疲劳影响</li>
<li><b>颜色视觉</b>★
<ul class="less"><li>三色说（杨—赫尔姆霍兹）：三种感受器 → 解释加色混合</li><li>对立过程说（黑林）：红—绿、蓝—黄、黑—白 → 解释负后像与色盲</li><li>相关：加色/减色混合 · 颜色对比 · 颜色适应 · 马赫带</li></ul></li>
<li><b>后像</b>★：正后像（同质）· 负后像（补色）</li>
</ul></div>
<h2>通道—物理量—心理量—方法</h2>
<table>
<thead><tr><th>通道</th><th>物理量</th><th>心理量</th><th>关键现象</th><th>常用测量方法</th></tr></thead>
<tbody>
<tr><td class="k">听觉</td><td>频率 / 振幅 / 波形</td><td>音高 / 响度 / 音色</td><td>等响曲线 · 听觉掩蔽</td><td>极限法（听阈）· 恒定刺激法</td></tr>
<tr><td class="k">视觉</td><td>波长 / 强度 / 时间</td><td>色调 / 明度 / 饱和度</td><td>浦肯野现象 · CFF · 后像</td><td>极限法（CFF）· 恒定刺激法（视敏度）</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>音高主要由频率决定，但<b>响度也会影响音高</b>（低频尤甚）。</li>
<li>浦肯野现象是敏感峰<b>向短波移动</b>（偏蓝绿），方向别记反。</li>
<li>三色说解释不了<b>负后像</b>与红绿色盲的对立性，这是对立过程说的立论根据。</li>
<li>CFF 与视敏度同属心理物理测量，但 CFF 典型用<b>极限法</b>。</li>
<li>掩蔽有方向性：<b>低频掩蔽高频更有效</b>。</li>
<li>暗适应是<b>敏感度上升</b>（阈限下降），别把方向说反。</li>
</ol>
<div class="foot"><b>考法</b>：选择（现象与理论对应、掩蔽规律）· 简答（三色说与对立过程说之争、暗适应机制）· 实验题（“测 CFF 该用哪种心理物理法”）。<b>深度</b>：只到“能配对、能选对”。</div>
</div>

<template id="doc-exp-10" data-subject="exp"><div class="doc" data-title="知觉实验"><p class="sub">312 以选择与简答为主　│　本页目标：<b>深度线索归类 + 似动类型判断</b>能瞬时答对</p>
<h2>导图</h2>
<div class="mm"><div class="root">知觉</div>
<ul>
<li><b>1 · 知觉组织（格式塔原则）</b>★：接近 · 相似 · 连续 · 闭合 · 共同命运 · 简单性</li>
<li><b>2 · 空间知觉与深度线索</b>★
<ul class="less">
<li>生理（非视觉）线索：晶状体<b>调节</b> · 双眼<b>辐合</b>（仅近距有效）</li>
<li>单眼线索：遮挡 · 线条透视 · 空气透视 · 纹理梯度 · 相对大小 · 相对高度 · 运动视差 · 阴影</li>
<li>双眼线索：<b>双眼视差</b>——最重要的深度线索</li>
</ul></li>
<li><b>3 · 知觉恒常性</b>★：大小 · 形状 · 明度 · 颜色；依赖深度与情境信息，线索被削弱时下降</li>
<li><b>4 · 时间知觉</b>：持续性与顺序性；受活动内容、情绪、年龄、刺激数目影响</li>
<li><b>5 · 运动知觉</b>★
<ul class="less"><li>真动知觉：物体实际位移</li><li><b>似动</b>：动景（phi，两刺激<b>相继呈现</b>）· 诱发（<b>背景在动</b>）· 自主（暗室光点）· 运动后效（瀑布效应）</li></ul></li>
<li><b>6 · 错觉</b>★：几何错觉（缪勒—莱耶、庞佐、垂直—水平）· 大小恒常错觉 · 方向错觉 · 运动错觉
<ul class="less"><li>理论：眼动说 · 恒常性误用说 · 透视说 <b>○</b></li></ul></li>
<li><b>7 · 研究方法</b>：心理物理法 · 恒定刺激法 · 调整法 · 信号检测论 · 反应时</li>
</ul></div>
<h2>深度线索三分类</h2>
<table>
<thead><tr><th>类别</th><th>线索</th><th>要点</th></tr></thead>
<tbody>
<tr><td class="k">生理线索</td><td>调节、辐合</td><td>只在几米内有效，远距几乎无信息</td></tr>
<tr><td class="k">单眼线索</td><td>遮挡、线条透视、空气透视、纹理梯度、相对大小、相对高度、运动视差、阴影</td><td>一张照片即可提供；绘画全靠这一类</td></tr>
<tr><td class="k">双眼线索</td><td><b>双眼视差</b></td><td>两眼视网膜像差异；<b>最主要、最精确</b>；随机点立体图是经典证明</td></tr>
</tbody></table>
<h2>四种似动的区分</h2>
<table>
<thead><tr><th>类型</th><th>条件</th><th>典型例子</th></tr></thead>
<tbody>
<tr><td class="k">动景运动</td><td>两个（或多个）静止刺激<b>相继呈现</b>，间隔适当</td><td>电影、霓虹灯、phi 现象</td></tr>
<tr><td class="k">诱发运动</td><td>背景（较大对象）运动，静止对象被知觉为在动</td><td>月穿云、桥上看流水觉得桥在动</td></tr>
<tr><td class="k">自主运动</td><td>暗室中长时间注视一个静止光点</td><td>光点“游走”</td></tr>
<tr><td class="k">运动后效</td><td>长时间注视某方向运动后，再看静止物</td><td>瀑布效应（看似反向运动）</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>“调节”“辐合”属<b>生理／非视觉线索</b>，不是单眼线索。</li>
<li>动景＝<b>刺激相继呈现</b>；诱发＝<b>背景在动</b>。两者最易混。</li>
<li>运动后效属<b>适应后效</b>，不是“错觉”；瀑布效应是典型现象。</li>
<li>恒常性不是“绝对不变”，而是<b>一定范围内保持稳定</b>；线索缺失时被破坏。</li>
<li>错觉是<b>系统性的、有规律的</b>偏差；答题要写“规律性”，不写“失误”。</li>
</ol>
<div class="foot"><b>考法</b>：选择（线索归类、似动类型判断）· 简答（深度知觉的线索、恒常性及影响因素）· 实验题（如何验证某线索的作用）。</div>
</div>

<template id="doc-exp-11" data-subject="exp"><div class="doc" data-title="学习与记忆实验"><h2>导图</h2>
<div class="mm"><div class="root">学习与记忆</div>
<ul>
<li><b>1 · 学习</b>
<ul class="less"><li>经典条件反射（巴甫洛夫）：CS—US 联结；习得 · 消退 · 自发恢复 · 泛化 · 分化</li><li>操作条件反射（斯金纳）：反应—强化；<b>正强化/负强化增加行为，惩罚减少行为</b></li></ul></li>
<li><b>2 · 记忆系统</b>★
<ul class="less"><li>感觉记忆：<b>部分报告法</b>（斯珀林）证明容量大、保持极短</li><li>短时记忆：<b>7±2 组块</b>（米勒）· 听觉/言语编码 · 斯滕伯格系列穷尽扫描</li><li>长时记忆：近乎无限 · <b>语义编码为主</b></li><li>工作记忆（巴德利）：中央执行 + 语音环路 + 视空间画板 + 情景缓冲器</li></ul></li>
<li><b>3 · 遗忘</b>★
<ul class="less"><li>艾宾浩斯遗忘曲线：<b>先快后慢</b>（节省法/重学法测得）</li><li>系列位置效应：首因→长时记忆；近因→短时记忆；延迟后近因消失</li><li>理论：衰退 · 干扰（前摄/倒摄）· 提取失败 · 动机性遗忘 · 同化</li></ul></li>
<li><b>4 · 研究方法</b>★：全部/部分报告法 · 自由回忆 · 线索回忆 · 再认 · 节省法 · 反应时</li>
<li><b>5 · 内隐记忆</b>★
<ul class="less"><li>任务分离：直接测验与间接测验成绩分离；遗忘症病人为最强证据</li><li>加工分离说（雅各布森）：<b>C＝R＋F(1−R)；E＝F(1−R)</b> → R＝C−E，F＝E/(1−R)</li><li>加工水平对间接测验影响很小</li></ul></li>
<li><b>6 · 错误记忆</b>：DRM 范式（关联诱饵）· 误导信息效应（洛夫特斯）· 想象膨胀 · 图式重构（巴特利特）</li>
<li><b>7 · 其他</b>：前瞻记忆（事件/时间）· 闪光灯记忆（生动≠准确）· 编码特异性 · 状态/情境依存</li>
</ul></div>
<h2>三个记忆系统对比</h2>
<table>
<thead><tr><th>系统</th><th>保持时间</th><th>容量</th><th>经典证据</th></tr></thead>
<tbody>
<tr><td class="k">感觉记忆</td><td>极短（图像 ≤1s）</td><td>大，近乎完整登记</td><td>部分报告法优于全部报告法</td></tr>
<tr><td class="k">短时记忆</td><td>约 15–30 秒，复述可延长</td><td>7±2 个组块</td><td>系列位置效应的近因部分；斯滕伯格扫描</td></tr>
<tr><td class="k">长时记忆</td><td>长久，可终生</td><td>近乎无限</td><td>首因部分；遗忘曲线；语义启动</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>部分报告法的关键是<b>证明感觉记忆容量大于即时报告量</b>，不是“记得更多”。</li>
<li>首因＝已进入长时记忆，近因＝仍在短时记忆；<b>延迟会消除近因，不消除首因</b>。</li>
<li>负强化 ≠ 惩罚：负强化<b>移除</b>厌恶刺激以<b>增加</b>行为；惩罚<b>施加</b>厌恶刺激以<b>减少</b>行为。</li>
<li>加工分离说的关键设计是<b>排除测验</b>（要求不使用记忆）。</li>
<li>遗忘曲线的测量方法是<b>节省法</b>，不是再认率。</li>
<li>DRM 表明记忆是<b>建构性</b>的；闪光灯记忆“生动且自信”≠“准确”。</li>
</ol>
<div class="foot"><b>考法</b>：选择（系统特性、效应归属）· 简答（部分报告法逻辑、内隐记忆证据、遗忘理论）· 设计题（如何用加工分离说检验内隐记忆）。</div>
</div>

<template id="doc-exp-12" data-subject="exp"><div class="doc" data-title="情绪 · 注意 · 思维实验"><h2>导图 · 情绪</h2>
<div class="mm"><div class="root">情绪实验</div>
<ul>
<li><b>指标三类</b>★：生理（心率、皮电、肌电、EEG/ERP、fMRI）· 表情（FACS）· 主观报告与行为；<b>三类常不一致</b></li>
<li><b>范式</b>：情绪诱导（图片/影片/音乐/想象/虚假反馈）· 情绪 Stroop · IAPS · 情绪启动</li>
<li>理论（詹姆斯—兰格 · 坎农—巴德 · 沙赫特—辛格 · 拉扎鲁斯）<b>○ 各记一句话</b></li>
</ul></div>
<h2>导图 · 注意</h2>
<div class="mm"><div class="root">注意实验</div>
<ul>
<li><b>1 · 选择性注意三模型</b>★
<ul class="less">
<li><b>过滤器</b>（布罗德本特）：早期、全或无</li>
<li><b>衰减</b>（特瑞斯曼）：早期、但非全或无而是<b>衰减</b>；自己的名字仍可通过</li>
<li><b>后期选择</b>（多伊奇）：全部信息都加工，选择在反应阶段</li>
<li>多阶段选择模型：选择可发生在不同阶段</li>
</ul></li>
<li><b>2 · 资源与容量</b>：注意资源有限（卡尼曼）· 双任务 · 心理不应期（中枢瓶颈/资源分配）</li>
<li><b>3 · 特征整合理论</b>（特瑞斯曼）★：特征平行加工、客体需集中注意整合；整合失败→<b>错觉性结合</b>；解释<b>特征搜索快、联合搜索慢</b></li>
<li><b>4 · 经典范式</b>★：双耳分听/追随 · Stroop · 线索化（含<b>返回抑制</b>）· 视觉搜索 · RSVP（注意瞬脱）· 负启动 · 持续注意（警戒）</li>
</ul></div>
<h2>导图 · 思维</h2>
<div class="mm"><div class="root">思维实验</div>
<ul>
<li><b>概念形成</b>：假设检验说（布鲁纳）· 样例/原型学习说</li>
<li><b>问题解决</b>★：手段—目的分析（河内塔）· 功能固着（邓克尔蜡烛）· 定势（陆钦斯量水）· 顿悟（苛勒）· 专家—新手</li>
<li><b>推理</b>：三段论 · 沃森选择任务（证伪倾向、内容效应）</li>
<li><b>决策</b>★：启发式（可用性/代表性/锚定）· <b>框架效应</b>与前景理论（参照点、损失厌恶）</li>
</ul></div>
<h2>选择性注意三模型对比</h2>
<table>
<thead><tr><th>模型</th><th>选择位置</th><th>核心主张</th><th>关键证据</th></tr></thead>
<tbody>
<tr><td class="k">过滤器</td><td>早期（知觉前）</td><td>未被注意通道被完全阻断</td><td>双耳分听：几乎报告不出非追随耳内容</td></tr>
<tr><td class="k">衰减</td><td>早期，非全或无</td><td>非追随耳被衰减，重要刺激阈限低仍可突破</td><td>非追随耳中的<b>自己的名字</b>（鸡尾酒会效应）</td></tr>
<tr><td class="k">后期选择</td><td>反应阶段</td><td>全部信息都被加工，选择在于输出</td><td>非追随耳信息也能产生语义启动</td></tr>
</tbody></table>
<h3>易错点</h3>
<ol class="err">
<li>鸡尾酒会效应支持的是<b>衰减模型</b>，不是过滤器模型——最高频的对应关系。</li>
<li>特征整合理论中<b>特征搜索平行（斜率≈0）</b>，联合搜索需序列扫描（斜率&gt;0）。</li>
<li>返回抑制（IOR）：长 SOA 时对已注意位置<b>反应变慢</b>——抑制而非促进。</li>
<li>“动景/诱发”见 E10；此处“返回抑制/注意瞬脱”都属时间维度限制，别混。</li>
<li>框架效应属<b>决策</b>研究；沃森选择任务才是推理。</li>
<li>功能固着讲“受阻的原因”，顿悟讲“突破的形式”，都属问题解决。</li>
</ol>
<div class="foot"><b>收口</b>：E6–E8 是“方法层”（怎么测），E9–E12 是“现象层”（测出了什么）。<b>大题更爱考方法层的逻辑，选择题更爱考现象层的对应关系</b>——按此分配记忆精度。</div>
</div></div></template>
<template id="doc-exp-e13-0" data-subject="exp"><div class="doc" data-title="实验设计大题八段式模板"><p class="hd">用于 312 综合题「请设计一个实验验证××」　│　约 30 分　│　<b>按段作答，漏段直接扣分</b>　│　配合 E3 与 S5</p>

<h2>八段结构与采分点</h2>
<table>

<thead><tr><th>段</th><th>标题（照抄）</th><th>写什么 · 常见扣分</th><th>分值</th></tr></thead>
<tbody>
<tr><td class="c k">①</td><td class="k">问题与假设</td><td>一句研究问题＋一句<b>可检验</b>假设（H₁），有方向时写方向性假设。<br><span>扣分：写成文献综述；假设不可检验。</span></td><td class="c">3</td></tr>
<tr><td class="c k">②</td><td class="k">变量</td><td><b>自变量</b>（名称＋水平数＋<b>操作定义</b>）；<b>因变量</b>（指标＋测量方式＋为何选它）；<b>控制变量</b> 3–4 个。<br><span>扣分：只写变量名不写操作定义（最常扣）。</span></td><td class="c">6</td></tr>
<tr><td class="c k">③</td><td class="k">被试</td><td>人数来源、纳入排除标准、<b>随机分配的具体方式</b>、知情同意。<br><span>扣分：不写随机分配→被判为准实验。</span></td><td class="c">3</td></tr>
<tr><td class="c k">④</td><td class="k">设计类型</td><td>明确写「采用 <b>2×2 混合设计</b>，××为被试间因素、××为被试内因素」，并给一句选择理由。<br><span>扣分：混合设计不点明哪个间哪个内＝没答。</span></td><td class="c">4</td></tr>
<tr><td class="c k">⑤</td><td class="k">实验程序</td><td>分组→指导语→练习→正式试验（<b>试次数、呈现顺序、平衡方式</b>）→休息→测量。<br><span>扣分：不写平衡方式，顺序效应无法排除。</span></td><td class="c">5</td></tr>
<tr><td class="c k">⑥</td><td class="k">额外变量控制</td><td><b>逐条对应②的控制变量</b>，给控制方法（随机化／恒定／平衡／抵消／双盲）。<br><span>扣分：与②不对应，出现“无源控制”。</span></td><td class="c">4</td></tr>
<tr><td class="c k">⑦</td><td class="k">统计方法</td><td>设计↔检验＋<b>误差项</b>＋前提检验＋事后检验＋简单效应，写成完整一句。<br><span>扣分：只写“用方差分析”，不写误差项。</span></td><td class="c">3</td></tr>
<tr><td class="c k">⑧</td><td class="k">预期与效度</td><td>预期方向＋若有交互如何解释＋<b>内部、外部效度各一条威胁与对策</b>。<br><span>扣分：只写“结果显著”，不写效度。</span></td><td class="c">2</td></tr>
</tbody>
</table>

<h2>万能句式（可背，按题替换）</h2>
<div class="tip">
<b>①</b> 本研究探讨＿＿对＿＿的影响，假设：＿＿条件下的＿＿显著高于／低于＿＿条件。<br><br>
<b>②</b> 自变量为＿＿，分＿＿个水平（＿＿、＿＿），操作定义为＿＿；因变量为＿＿，以＿＿为指标，因该指标具备有效性、客观性与数量化；控制变量包括＿＿、＿＿、＿＿。<br><br>
<b>③</b> 选取＿＿名被试，随机分配至＿＿组，每组＿＿人，实验前签署知情同意书。<br><br>
<b>④</b> 采用＿＿（被试间／被试内／混合）设计，其中＿＿为被试间因素、＿＿为被试内因素，理由是该因素＿＿。<br><br>
<b>⑤</b> 被试先完成＿＿次练习，随后进入正式试验，共＿＿试次，＿＿顺序采用＿＿（ABBA／拉丁方／随机化）平衡，试次间休息＿＿秒。<br><br>
<b>⑥</b> ＿＿通过随机化控制，＿＿通过恒定法控制，＿＿通过平衡法控制，主试与被试均不知晓实验条件（双盲）。<br><br>
<b>⑦</b> 采用＿＿检验（＿＿为被试间因素、＿＿为被试内因素），以＿＿为误差项；先检验＿＿前提，若交互显著则做简单效应分析，并对主效应做事后检验。<br><br>
<b>⑧</b> 预期＿＿；内部效度上＿＿可能构成威胁，通过＿＿排除；外部效度上＿＿限制推广，通过＿＿改善。
</div>

<h2>三种题型变形的重心</h2>
<table>

<thead><tr><th>题型</th><th>重心段</th><th>注意</th></tr></thead>
<tbody>
<tr><td class="k">验证某效应／假设</td><td>②④⑤⑦</td><td>操作定义与平衡方式是主要采分点</td></tr>
<tr><td class="k">比较两种方法／条件</td><td>②③④⑦</td><td>须说明为何用被试间或被试内，及样本量估算</td></tr>
<tr><td class="k">改进已有设计</td><td>⑥⑧</td><td>先指出效度威胁，再给修改方案（<b>一一对应</b>）</td></tr>
</tbody>
</table>

<h2>答完自检六问</h2>
<ol>
<li>八段标题是否都写了？<b>漏一段＝丢 2–4 分</b>。</li>
<li>②的每个变量是否都有<b>操作定义</b>？因变量是否写了“为什么选这个指标”？</li>
<li>④是否明确点出<b>哪个因素被试间、哪个被试内</b>？是否识别出准实验情形？</li>
<li>⑤是否写了<b>平衡／抵消的具体方式</b>（不是“随机呈现”四个字了事）？有无操纵检查？</li>
<li>⑥的控制方法是否与②的变量<b>一一对应</b>？是否写了双盲或自动化？</li>
<li>⑦是否写到了<b>误差项</b>？混合设计是否写了两个误差项？</li>
</ol>

<div class="tip"><b>时间分配（30 分钟题）</b>：审题 3′｜①②③④ 10′｜⑤⑥ 12′｜⑦⑧ 5′。<br>
<b>动笔顺序</b>：先写④设计类型，再回头写②③——先定设计，变量与控制才有落点。</div>


<div class="chap"></div></template>
<template id="doc-exp-e13-1" data-subject="exp"><div class="doc" data-title="设计八段式例题 12 道 · 评分要点"><p class="hd">11/20–11/30 每天 1 题，每题 <b>20 分钟闭卷</b>，按 E13 八段全写　│　<b>本页只给“该写什么”，不给范文</b></p>

<div class="tip"><b>用法</b>：先只看「题干」，闭卷写完八段；再对照「评分要点」逐条勾。要点里没勾到的，就是当天该补的采分点。<b>不写满八段不算完成</b>，宁可写短也要八段齐全。<br>
<b>题号对应</b>《设计识别 58 题》，可对照答案页核设计类型。</div>

<div class="it">
<p class="top"><span class="no">#12</span><span class="qt">同一批被试分别在有／无音乐条件下完成打字任务，顺序平衡。</span><span class="ty">单因素被试内 2 水平</span></p>
<p class="pt"><b>②</b> 因变量必须写两个指标：<b>打字速度</b>（字/分钟）＋<b>错误率</b>，并说明理由（速度—准确性权衡，只报速度无法解释）。<br>
<b>②</b> 额外变量：键盘熟悉度（测基线或恒定同一键盘）、音乐音量（恒定 60dB）、曲目熟悉度（选未听过的曲目）、每条件时长（各 10 分钟）。<br>
<b>⑤</b> 必须写 <b>ABBA 平衡</b>：一半被试先有后无，一半反之。<br>
<b>⑦</b> 统计写 <b>配对样本 t</b>，<b>df＝对数−1</b>——不是 ANOVA（只有两水平）、不是独立样本 t（同一批被试）。<br>
<b>⑧</b> 威胁：顺序／练习效应（ABBA）；外部效度限于曲目类型单一。</p>
</div>

<div class="it">
<p class="top"><span class="no">#30</span><span class="qt">用影片诱导愉快／悲伤／中性三种情绪，随机分配被试，随后测风险决策。</span><span class="ty">单因素被试间 3 水平</span></p>
<p class="pt"><b>②</b> 情绪诱导要写<b>操作定义</b>：片段来源、时长、情绪效价与唤醒度评分。<br>
<b>②</b> 因变量：冒险方案选择比例或气球充气次数（要具体到“怎么算冒险”）。<br>
<b>⑤</b> 必须加<b>操纵检查</b>：诱导前后测情绪自评量表，确认三组情绪确实不同——<b>这是本题的核心采分点，漏了直接扣</b>。<br>
<b>⑦</b> 统计：<b>单因素完全随机 ANOVA＋事后检验</b>（三水平必须事后）。<br>
<b>⑧</b> 构念效度：影片引发的是“真情绪”还是“表演性表情”？给一条对策。</p>
</div>

<div class="it">
<p class="top"><span class="no">#49</span><span class="qt">随机分两组做冷压任务，一组看喜剧、一组看中性风景；测坚持时间与疼痛评分；先测基线疼痛阈限。</span><span class="ty">单因素被试间＋协变量</span></p>
<p class="pt"><b>②</b> 两个因变量都要写：<b>坚持时间</b>（行为指标）＋<b>主观疼痛评分</b>（自评），并说明为何要两个。<br>
<b>②</b> 冷压任务的标准化：水温、时限上限、手部位置。<br>
<b>⑤</b> <b>基线疼痛阈限先测</b>，写明用途：分层随机或作协变量。<br>
<b>⑦</b> 统计：<b>以基线为协变量的 ANCOVA</b>，或“按基线分层随机后做 ANOVA”——二选一写清。<br>
<b>⑥</b> 期望效应：告知“研究疼痛耐受”而非研究喜剧；实验者效应：双盲。</p>
</div>

<div class="it">
<p class="top"><span class="no">#08</span><span class="qt">所有被试在字体大小（12/18pt）×光照（强/弱）四个条件下各读 20 分钟。</span><span class="ty">2×2 全被试内</span></p>
<p class="pt"><b>④</b> 必须写“<b>2×2 被试内设计，两因素均为被试内</b>”，并给出选被试内的理由（剔除个体差异、省被试）。<br>
<b>⑤</b> <b>拉丁方平衡 4 个条件的顺序</b>，并指出被试数应为 4 的倍数。<br>
<b>②</b> 因变量：主观疲劳量表＋眨眼率或阅读速度下降量（两个指标）。<br>
<b>②</b> 额外变量：材料等值（同一篇或等值文本）、屏幕亮度恒定、条件间休息。<br>
<b>⑦</b> 统计：<b>两因素重复测量 ANOVA</b>，<b>先检验球形性</b>；交互显著→<b>简单效应</b>。</p>
</div>

<div class="it">
<p class="top"><span class="no">#43</span><span class="qt">所有被试在面孔种族（同族/异族）×呈现时间（短/长）下完成再认，用 d′ 分析。</span><span class="ty">2×2 全被试内＋d′</span></p>
<p class="pt"><b>②</b> 因变量用 <b>d′</b> 而非正确率，<b>必须给理由</b>：分离感受性与判断标准。<br>
<b>②</b> 算子写清信号与噪音各是什么（旧面孔＝信号，新面孔＝噪音），以及每个条件的<b>试次数（≥50）</b>。<br>
<b>②</b> 额外变量：面孔吸引力与熟悉度匹配、呈现时间由计算机精确控制。<br>
<b>⑦</b> 统计：对 d′ 做<b>重复测量 ANOVA</b>；若再加报 β 需说明它测的是标准不是感受性。<br>
<b>⑧</b> 外部效度：静态面孔图片与真实交往情境的差距。</p>
</div>

<div class="it">
<p class="top"><span class="no">#23</span><span class="qt">外语水平（高/低）×文本难度（易/难）对阅读时间的影响，随机分配至四种组合。</span><span class="ty">名义 2×2 被试间<br>实为准实验</span></p>
<p class="pt"><b>④</b> <b>本题是陷阱题</b>：外语水平属<b>被试特点变量，不能随机分配</b>，题干“随机分配”实际做不到——必须在④里指出它<b>不是真实验</b>。<br>
<b>④</b> 给出一条改造方案：把“外语水平”改为<b>可操纵的自变量</b>（如词汇频率高／低），才能真正随机分配。<br>
<b>⑦</b> 统计：两因素完全随机 ANOVA，交互显著做简单效应。<br>
<b>⑧</b> 内部效度：<b>选择偏差</b>（高低水平者本身在阅读习惯、词汇量上就不同）。<br>
<b>⑥</b> 控制：文本长度、生词密度、阅读目的（是否需要答题）。</p>
</div>

<div class="it">
<p class="top"><span class="no">#04</span><span class="qt">咖啡因（0／200mg）×任务难度（易/难）对反应时的影响；剂量被试间，两种难度均须完成。</span><span class="ty">2×2 混合<br>两个误差项</span></p>
<p class="pt"><b>②</b> 咖啡因的操作定义要写到：<b>安慰剂对照、双盲、给药后等待 30–45 分钟</b>才开始测试。<br>
<b>②</b> 额外变量：<b>咖啡因耐受性</b>（筛查常饮者）、前夜睡眠、剂量按体重（mg/kg）。<br>
<b>②</b> 因变量：RT＋错误率。<br>
<b>⑦</b> <b>本节最重要</b>：混合设计 ANOVA，<b>咖啡因主效应用“误差(被试)”项，难度主效应与交互用“误差(残差)”项</b>——必须分别写出。<br>
<b>⑧</b> 交互若显著：咖啡因只改善难任务 → 做<b>简单效应</b>。</p>
</div>

<div class="it">
<p class="top"><span class="no">#16</span><span class="qt">教材（A/B）×测验形式（选择/简答）对成绩的影响；每班用一种教材，两种测验形式都做。</span><span class="ty">2×2 混合<br>班级为单位</span></p>
<p class="pt"><b>④</b> 写“教材为被试间、测验形式为被试内”，并<b>指出随机化单位是班级而非学生</b>。<br>
<b>⑦</b> 统计：混合 ANOVA，但须提一句<b>学生嵌套于班级</b>（可用班级为随机因素，或聚合到班均值再分析）。<br>
<b>②</b> 额外变量：教师水平（同一教师或随机分配）、学生基线（前测作协变量）、教材实施时长。<br>
<b>⑤</b> 两种测验形式的<b>顺序需平衡</b>（ABBA）。<br>
<b>⑧</b> 教材效应与教师效应混淆（构念效度）。</p>
</div>

<div class="it">
<p class="top"><span class="no">#55</span><span class="qt">训练组做 20 天 n-back，对照组做等时长填字游戏，前后各测流体智力。</span><span class="ty">单因素被试间<br>＋前后测</span></p>
<p class="pt"><b>③</b> 对照组的设置必须写<b>“等时长、等期望”</b>（填字而非空等），以排除霍桑与安慰剂效应。<br>
<b>⑤</b> 前后测的威胁：<b>前测敏感化</b>——给出对策（所罗门四组，或取消前测改后测-only）。<br>
<b>②</b> 因变量区分<b>近迁移</b>（n-back 本身）与<b>远迁移</b>（流体智力测验），并说明哪个才是研究目的。<br>
<b>⑦</b> 统计：<b>2×2 混合 ANOVA（组×时间）</b>，<b>交互显著即训练效应</b>。<br>
<b>⑥</b> 主试不知分组（双盲）或全程计算机化施测。</p>
</div>

<div class="it">
<p class="top"><span class="no">#51</span><span class="qt">同一批被试在实验室两晚：一晚正常睡眠、一晚剥夺，每晚后看情绪图片并做再认，顺序随机。</span><span class="ty">被试内或多因素</span></p>
<p class="pt"><b>⑤</b> 核心采分点：<b>两晚之间必须有洗脱期（≥1 周）</b>，且顺序随机平衡——漏写直接扣。<br>
<b>②</b> 睡眠剥夺的操作定义：保持清醒时长、监督方式、光照、活动安排（不能只说“不让睡”）。<br>
<b>②</b> 因变量：负性／中性图片再认率（或 d′）＋情绪唤醒评分；<b>材料须在效价与唤醒度上匹配</b>。<br>
<b>⑥</b> 控制<b>昼夜节律</b>：两晚在同一时间点测试。<br>
<b>⑦</b> 统计：若只比较两晚→配对 t；若再分情绪效价→<b>2×2 被试内 ANOVA</b>。</p>
</div>

<div class="it">
<p class="top"><span class="no">#56</span><span class="qt">被试玩 Cyberball，随机分至被排斥／被接纳条件，随后完成 Stroop 与 n-back。</span><span class="ty">单因素被试间<br>＋多因变量</span></p>
<p class="pt"><b>②</b> Cyberball 的操作定义：传球次数比例、包容／排斥参数（写具体数字）。<br>
<b>②</b> 两个因变量（Stroop 干扰量、n-back 正确率）——须说明<b>分别检验还是 MANOVA</b>，以及是否<b>校正多重比较</b>。<br>
<b>⑤</b> 操纵检查：归属感／控制感量表，确认排斥生效。<br>
<b>⑥</b> 额外变量：拒绝敏感性人格、先前人际关系状态。<br>
<b>⑧</b> <b>伦理</b>：排斥引发负性情绪，须充分事后解释并确认状态恢复。</p>
</div>

<div class="it">
<p class="top"><span class="no">#52</span><span class="qt">随机抽两个班，告知 A 班教师其学生“有潜力”，B 班不告知，学期末比较成绩。</span><span class="ty">被试间<br>班级为随机化单位</span></p>
<p class="pt"><b>④</b> 指出<b>随机化单位是班级，不是学生</b>；样本量与效力按<b>班级数</b>而非学生数计算。<br>
<b>⑦</b> 统计须提<b>嵌套结构</b>：多层线性模型，或聚合到班均值后做独立样本 t。<br>
<b>⑤</b> 操纵检查：教师<b>是否相信</b>“有潜力”这一信息（不信则操纵无效）。<br>
<b>⑥</b> 额外变量：教师水平（同质化或随机）、学生基线成绩（前测作协变量）。<br>
<b>⑧</b> 构念效度：期望通过什么途径传递（表扬、提问机会、反馈方式）？霍桑效应如何排除。</p>
</div>

<h2>写完自评：八段逐项打勾</h2>

<thead><tr><th>段</th><th>标题</th><th>自检问句（有一条答“否”即扣分）</th><th>分</th></tr></thead>

<tr><td class="c k">①</td><td class="k">问题与假设</td><td>是否写成了一句可检验的假设，而不是复述题干？有方向时写了方向性假设？</td><td class="c">3</td></tr>
<tr><td class="c k">②</td><td class="k">变量</td><td>自变量是否给了<b>水平数＋操作定义</b>？因变量是否写了<b>指标＋为何选它</b>？控制变量有 3–4 个？</td><td class="c">6</td></tr>
<tr><td class="c k">③</td><td class="k">被试</td><td>人数、来源、纳入排除标准、<b>随机分配的具体方式</b>、知情同意，是否齐全？</td><td class="c">3</td></tr>
<tr><td class="c k">④</td><td class="k">设计类型</td><td>是否明确到“××为被试间、××为被试内”？给了选择理由？识别出准实验情形？</td><td class="c">4</td></tr>
<tr><td class="c k">⑤</td><td class="k">实验程序</td><td>试次数、<b>平衡／抵消的具体方式</b>、休息安排、操纵检查，是否都写了？</td><td class="c">5</td></tr>
<tr><td class="c k">⑥</td><td class="k">额外变量控制</td><td>是否与②的每个控制变量<b>一一对应</b>？写了双盲或自动化？</td><td class="c">4</td></tr>

<tr><td class="c k">⑧</td><td class="k">预期与效度</td><td>写了预期方向？交互如何解释？<b>内部、外部效度各一条威胁与对策</b>？</td><td class="c">2</td></tr>
</tbody>
</table>

<div class="tip"><b>三轮回炉</b>：第一轮（11/20–11/30）12 题全写；第二轮（12/05–12/08）只重写<b>自评不过 24 分的题</b>，限时 15 分钟；第三轮（12/16–12/18）只看本页评分要点，在脑中过一遍八段，不落笔。</div>

<div class="tip"><b>四处最易失分</b>：#23 是陷阱题（名义 2×2 被试间，实为准实验）；#04 与 #16 是混合设计（两个误差项）；#52 的随机化单位是班级。这四处是 312 综合题最常见的失分点。</div>
</div>

<template id="doc-stat-1" data-subject="sm"><div class="doc" data-title="描述统计"><p class="hd">统计第一层　│　目标：三类量数能默写公式并手算，偏态与三量数方向不出错</p>

<h2>集中量数</h2>
<p><span class="k">算术平均数 M</span>　利用全部信息、最稳定。性质：<b>Σ(X−M)＝0</b>；离均差平方和最小。缺点：<b>受极端值影响大</b>。</p>
<p><span class="k">中数 Md</span>　排序后位于 50% 处的值。稳健，不受极端值影响；但只用位置信息，不利用全部数据。</p>
<p><span class="k">众数 Mo</span>　出现次数最多的值，可有多个，也可能没有。不稳定，受分组方式影响。</p>

<div class="fm"><b>三者关系</b>：正态分布 M＝Md＝Mo；<b>正偏（右偏，长尾在右）M＞Md＞Mo</b>；<b>负偏（左偏）M＜Md＜Mo</b>。<br>
原因：平均数被极端值拉向长尾一侧，中数只由位置决定，众数落在峰顶。</div>

<h2>差异量数</h2>
<p><span class="k">全距 R</span>　最大值−最小值。粗糙，只用两个极端值。</p>
<p><span class="k">四分差 Q</span>　<span class="fx">Q＝(Q₃−Q₁)/2</span>，中间 50% 数据的半宽，稳健。</p>
<p><span class="k">平均差 AD</span>　<span class="fx">AD＝Σ|X−M|/n</span>。</p>
<p><span class="k">方差与标准差</span>　总体 <span class="fx">σ²＝SS/N</span>；样本 <span class="fx">s²＝SS/(n−1)</span>，其中 <span class="fx">SS＝Σ(X−M)²</span>。<br>
<b>标准差与原数据同单位</b>，便于解释；<b>方差具有可加性</b>，便于运算。</p>
<p><span class="k">差异系数 CV</span>　<span class="fx">CV＝σ/M×100%</span>。只在<b>单位不同</b>或<b>均值水平相差很大</b>时用来比较相对离散程度。</p>

<h2>相对量数</h2>
<table>

<thead><tr><th>指标</th><th>公式 · 性质</th></tr></thead>
<tbody>
<tr><td class="k">z 分数</td><td><span class="fx">z＝(X−M)/SD</span>。均值 0、标准差 1；可正可负；<b>线性变换不改变分布形状</b>。</td></tr>
<tr><td class="k">T 分数</td><td><span class="fx">T＝10z＋50</span>。均值 50、标准差 10；作用是消除负号与小数。</td></tr>
<tr><td class="k">百分等级 PR</td><td>低于某分数者占总人数的百分比。<b>PR 是名次，百分位数是分数</b>，二者互为反函数。</td></tr>
</tbody>
</table>

<h2>相关</h2>
<p><span class="k">积差相关</span>　<span class="fx">r＝Sxy／√(Sxx·Syy)</span>，|r|≤1。条件：<b>两变量均为等距／比例数据、线性关系、成对且样本较大</b>。</p>
<p><span class="k">等级相关</span>　<span class="fx">r<sub>s</sub>＝1−6ΣD²／[n(n²−1)]</span>，D 为秩次差。用于<b>等级数据</b>或原始数据不满足积差条件时。</p>
<p><span class="k">点二列相关</span>　一个变量是<b>真正的二分变量</b>，另一个连续。常用于项目分析（答对／答错与总分的相关）。</p>
<div class="fm"><b>r 的三条正确解读</b>：①只表示<b>线性</b>关系的强度与方向；②<b>r² 才是解释率</b>；③<b>相关不等于因果</b>，可能是第三变量或反向因果。</div>

<h2>例题</h2>
<div class="ex">
<p class="q">10 名被试得分：2, 4, 4, 4, 5, 5, 7, 7, 9, 13。求 M、Md、Mo、SS、σ、s、CV；判断偏态；求 X＝13 的 z、T、PR。</p>
<p class="s"><b>① 集中量数</b>　ΣX＝60，n＝10 → <span class="a">M＝6</span>。排序后第 5、6 位都是 5 → <span class="a">Md＝5</span>。4 出现 3 次最多 → <span class="a">Mo＝4</span>。</p>
<p class="s"><b>② 离均差平方和</b>　X−M 分别为 −4,−2,−2,−2,−1,−1,1,1,3,7 → SS＝16+4+4+4+1+1+1+1+9+49＝<span class="a">90</span>。</p>
<p class="s"><b>③ 方差与标准差</b>　σ²＝90/10＝9 → <span class="a">σ＝3</span>；s²＝90/9＝10 → <span class="a">s≈3.16</span>。</p>
<p class="s"><b>④ 差异系数</b>　CV＝3/6×100%＝<span class="a">50%</span>。</p>
<p class="s"><b>⑤ 偏态判断</b>　M(6)＞Md(5)＞Mo(4) → <span class="a">正偏态（右偏，长尾在右侧高分段）</span>。</p>
<p class="s"><b>⑥ 相对量数</b>（X＝13）　z＝(13−6)/3＝<span class="a">2.33</span>；T＝10×2.33+50＝<span class="a">73.3</span>；查正态表 z＝2.33 对应面积 0.9901 → <span class="a">PR≈99</span>。</p>
<p class="cm">此处用总体 σ；若只给样本 s，则用 s 计算，并说明是样本标准化。</p>
</div>

<h2>易错点</h2>
<p class="err"><b>1.</b> 样本方差分母是 <b>n−1</b>；用 n 会系统性低估，样本越小偏差越大。</p>
<p class="err"><b>2.</b> 单位相同、均值接近时比标准差就够，滥用 CV 反而丢信息。</p>
<p class="err"><b>3.</b> 偏态方向看<b>长尾</b>：长尾在右＝正偏，此时均值被拉高。</p>
<p class="err"><b>4.</b> r＝0 只说明<b>无线性关系</b>，不排除 U 形等曲线关系。</p>
<p class="err"><b>5.</b> 百分等级与百分位数是反函数，须看清问“名次”还是“分数”。</p>
<p class="err"><b>6.</b> z 分数不等于“正态化”，标准化不改变分布形状。</p>

<h3>考法</h3>
<p>计算（M、SS、s、z、CV）· 选择（偏态与三量数关系、CV 适用条件）· 简答（为什么样本方差除以 n−1）。</p>

<template id="doc-stat-2" data-subject="sm"><div class="doc" data-title="概率与抽样分布"><p class="hd">统计第二层　│　目标：标准误与中心极限定理能讲清、z 表会查　│　★这是 t、F 检验的地基</p>

<h2>概率基础</h2>
<p><span class="k">古典定义</span>　基于“各结果等可能”的先验计算。<b>统计（频率）定义</b>　大量重复试验中频率的稳定值——心理学研究多用后者。</p>
<p><span class="k">加法法则</span>　两个<b>互斥</b>事件：P(A 或 B)＝P(A)+P(B)。<br>
<span class="k">乘法法则</span>　两个<b>独立</b>事件：P(A 且 B)＝P(A)×P(B)。</p>
<div class="fm">互斥与独立是两个不同概念：<b>互斥</b>指不能同时发生，<b>独立</b>指互不影响概率。</div>

<h2>正态分布</h2>
<p>单峰、对称、钟形；M＝Md＝Mo；曲线下总面积＝1；由 μ 与 σ 完全决定；拐点在均值 ±1σ 处。</p>
<table>

<thead><tr><th>区间</th><th>包含面积</th></tr></thead>
<tbody>
<tr><td class="k">±1σ</td><td>≈ 68.26%</td></tr>
<tr><td class="k">±1.96σ</td><td>≈ 95%</td></tr>
<tr><td class="k">±2.58σ</td><td>≈ 99%</td></tr>
</tbody>
</table>
<p>任意正态 → <span class="fx">z＝(X−μ)/σ</span> → 标准正态（μ＝0，σ＝1）→ 查表求面积。</p>
<p><b>单侧临界值</b>：z＝1.645 以上 5%；1.96 以上 2.5%；2.58 以上 0.5%。</p>

<h2>抽样分布</h2>
<p><span class="k">总体分布</span>　总体中所有个体的分数分布。<br>
<span class="k">样本分布</span>　一次抽样所得 n 个分数的分布。<br>
<span class="k">抽样分布</span>　反复抽样所得<b>统计量</b>（如均值）的分布——推断统计研究的是第三种。</p>

<h2>标准误</h2>
<p><span class="k">均值标准误</span>　<span class="fx">SE＝σ／√n</span>，σ 未知时用 s 代替。<br>
<span class="k">比例标准误</span>　<span class="fx">SE＝√[p(1−p)／n]</span>。</p>
<div class="fm"><b>标准差 vs 标准误</b>：s 描述“个体之间有多分散”；<b>SE 描述“样本均值有多不稳定”</b>，随 n 增大而减小，关系为 SE＝s/√n。</div>
<p><b>n 增大 4 倍，SE 才减半</b>——靠加样本缩小误差，收益递减。</p>

<h2>中心极限定理</h2>
<div class="tip">从任意分布的总体中抽取容量 n 的样本，<b>当 n 足够大（经验值 n≥30）时，样本均值的抽样分布近似正态</b>，其均值＝μ、标准差＝σ/√n。<br>
这是 z、t、F 检验成立的根本依据。<b>它说的是“均值的分布”趋于正态，不是原始数据变正态。</b></div>

<h2>自由度与 t 分布</h2>
<p><span class="k">自由度</span>　能自由变化的观测个数。因 <b>Σ(X−M)＝0</b> 的约束，n 个离均差只有 n−1 个可自由取值，故估计均值后 <b>df＝n−1</b>。</p>
<p><span class="k">t 分布</span>　用样本标准差 s 代替 σ 后的抽样分布，是<b>由 df 决定形状的一族曲线</b>。<b>df 越小，尾部越厚、临界值越大</b>；df→∞ 时趋近正态。</p>
<p>σ 未知时必须用 t，因为<b>用 s 估计 σ 引入了额外不确定性</b>，t 分布把这种估计误差计入了临界值。</p>

<h2>例题</h2>
<div class="ex">
<p class="q">总体 μ＝100、σ＝15，随机抽取 n＝25，样本均值 M＝106。（1）求标准误；（2）求 M≥106 的概率与双尾概率；（3）求 95% 置信区间；（4）若 n＝100，SE 为多少？</p>
<p class="s"><b>① 标准误</b>　SE＝15/√25＝15/5＝<span class="a">3</span>。</p>
<p class="s"><b>② 求 z</b>　z＝(106−100)/3＝<span class="a">2.00</span>。</p>
<p class="s"><b>③ 查概率</b>　z＝2.00 上侧面积＝<span class="a">0.0228</span>；双尾 p＝2×0.0228＝<span class="a">0.0456</span>。</p>
<p class="s"><b>④ 95% 置信区间</b>　106±1.96×3＝106±5.88 → <span class="a">[100.12, 111.88]</span>。</p>
<p class="s"><b>⑤ n＝100 时</b>　SE＝15/10＝<span class="a">1.5</span>，恰为原来的 1/2。</p>
<p class="cm">本题 σ 已知故用 z；若 σ 未知而用 s，须用 t 分布与 df＝n−1 的临界值（见 S3、S4）。</p>
</div>

<h2>易错点</h2>
<p class="err"><b>1.</b> 把标准误当样本标准差——<b>SE 描述“均值有多不稳”，s 描述“个体有多分散”</b>。</p>
<p class="err"><b>2.</b> 中心极限定理解释的是<b>均值分布</b>，原始数据偏态时并不变正态。</p>
<p class="err"><b>3.</b> “n≥30 就能用正态近似”是经验说法，<b>总体极偏时需更大样本</b>。</p>
<p class="err"><b>4.</b> 1.96 只在大样本或 σ 已知时用；小样本用 t 临界值。</p>
<p class="err"><b>5.</b> 双侧 5% 用 1.96、单侧 5% 用 1.645，两者不可混。</p>

<h3>考法</h3>
<p>计算（SE、z、概率、置信区间）· 选择（SE 与 n 的关系、中心极限定理表述）· 简答（标准误与标准差的区别、中心极限定理的意义）。</p>
</div>

<template id="doc-stat-3" data-subject="sm"><div class="doc" data-title="参数估计与假设检验"><p class="hd">统计第三层　│　目标：五步流程能背、两类错误与效力能说清</p>

<h2>点估计三性质</h2>
<p><span class="k">无偏性</span>　估计量的期望等于真值（样本方差除以 n−1 才无偏）。</p>
<p><span class="k">有效性</span>　<b>无偏前提下方差越小越有效</b>。</p>
<p><span class="k">一致性</span>　n→∞ 时估计量趋近真值。</p>

<h2>区间估计</h2>
<p>σ 已知：<span class="fx">M±z·SE</span>；σ 未知：<span class="fx">M±t·SE</span>。</p>
<div class="fm"><b>95% 置信区间的正确解释</b>：反复抽样所构造的许多 95% 区间中，约有 95% 会包含总体参数。<br>
<b>不能说</b>“总体参数有 95% 概率落在这个区间内”——参数固定，随机的是区间。</div>
<p>置信度↑ 区间变宽；n↑ 变窄；σ↑ 变宽。</p>

<h2>假设检验五步</h2>
<div class="tip">
<b>①</b> 提出 H₀ 与 H₁（H₀ 为“无差异／无效应”假设）<br>
<b>②</b> 选定检验统计量与显著性水平 α<br>
<b>③</b> 确定临界值与拒绝域（单侧 1.645／双侧 1.96）<br>
<b>④</b> 计算统计量的实际值<br>
<b>⑤</b> 与临界值比较，作出“拒绝／不拒绝 H₀”的结论
</div>
<p>逻辑是<b>反证法＋小概率原理</b>：先假设 H₀ 成立，若观测结果出现概率极小，则怀疑 H₀。<br>
<b>结论只能“拒绝”或“不拒绝”，不能说“接受 H₀”。</b></p>

<h2>两类错误与统计效力</h2>
<table>

<thead><tr><th>错误</th><th>含义</th></tr></thead>
<tbody>
<tr><td class="k">α（弃真）</td><td>H₀ 为真却拒绝。<b>α 由研究者事先设定</b>，不由数据决定。</td></tr>
<tr><td class="k">β（取伪）</td><td>H₀ 为假却保留。</td></tr>
<tr><td class="k">统计效力</td><td><b>效力＝1−β</b>，即 H₀ 为假时能正确检出的概率。常规要求 ≥0.80。</td></tr>
</tbody>
</table>
<div class="fm"><b>α 与 β 的关系</b>：n 固定时，<b>α 减小则 β 增大</b>。<br>
要同时减小，只能<b>增大样本量</b>或<b>增大效应量（减小误差变异）</b>。</div>
<p><b>影响效力的因素</b>：效应量↑、n↑、α↑、改用单侧、误差变异↓ → 效力↑。</p>

<h2>p 值与效应量</h2>
<p><span class="k">p 值</span>　在 H₀ 为真的前提下，得到当前观测结果或更极端结果的概率。<b>p 不是“H₀ 为真的概率”</b>，也不是“结论错误的概率”，更不是效应大小。</p>
<p><span class="k">效应量 d</span>　<span class="fx">d＝(M−μ)／σ</span>，表示相差几个标准差。<b>0.2 小、0.5 中、0.8 大</b>。</p>
<div class="fm"><b>显著 ≠ 重要</b>：p 同时受效应量与样本量影响——样本很大时微小差异也能显著，样本很小时大效应也可能不显著。故<b>必须同时报告效应量（d、η²、r²）</b>。</div>

<h2>例题</h2>
<div class="ex">
<p class="q">全校 μ₀＝100、σ＝15。某班 n＝25，M＝106。α＝.05，问新教法是否显著提高成绩？并求效应量与置信区间。</p>
<p class="s"><b>① 假设</b>　H₀：μ≤100；H₁：μ＞100（<b>有方向预期，用单侧</b>）。</p>
<p class="s"><b>② 统计量与水平</b>　σ 已知 → z 检验；α＝.05 单侧。</p>
<p class="s"><b>③ 临界值</b>　单侧 z<sub>0.05</sub>＝<b>1.645</b>，拒绝域 z＞1.645（双侧则为 ±1.96）。</p>
<p class="s"><b>④ 计算</b>　SE＝15/5＝3；z＝(106−100)/3＝<span class="a">2.00</span>。</p>
<p class="s"><b>⑤ 结论</b>　2.00＞1.645 → <span class="a">拒绝 H₀</span>，新教法显著提高了成绩（单侧 p≈0.0228）。</p>
<p class="s"><b>⑥ 效应量</b>　d＝6/15＝<span class="a">0.40</span>，属小到中等效应——<b>显著但效应中等</b>，答题要点出。</p>
<p class="s"><b>⑦ 95% CI</b>　106±1.96×3＝<span class="a">[100.12, 111.88]</span>，下限＞100，与检验结论一致。</p>
<p class="cm">对照 S2：同一组数据，S2 只算概率，S3 加上假设与决策。“假设、临界值、结论”三件必须写全。</p>
</div>

<h2>易错点</h2>
<p class="err"><b>1.</b> 写“接受 H₀”是错的，应写“<b>不拒绝 H₀</b>”或“无充分证据表明……”。</p>
<p class="err"><b>2.</b> p＜.05 不等于效应大；大样本时 1 分差异也可能显著，必须报效应量。</p>
<p class="err"><b>3.</b> 单双侧选错会直接改临界值；<b>方向性假设一经确定不能事后改</b>。</p>
<p class="err"><b>4.</b> α 与 β 不能同时减小（n 固定），这是简答的标准采分点。</p>
<p class="err"><b>5.</b> 置信区间不含 H₀ 值 ⇔ 双尾 α＝.05 显著；但小样本用 t 时 CI 也要换成 t 临界值。</p>
<p class="err"><b>6.</b> 区间越宽说明<b>越不确定</b>，不是“估计得越准”。</p>

<h3>考法</h3>
<p>完整假设检验计算（含单双侧）· 选择（α/β/效力关系、p 值含义）· 简答（两类错误的关系、显著性与效应量的区别）。</p>
</div>

<template id="doc-stat-4" data-subject="sm"><div class="doc" data-title="t 检验"><p class="hd">统计第四层　│　目标：三种 t 会选会算、df 会定、t²＝F 能推</p>

<h2>三种 t 的选择</h2>
<p><span class="k">单样本 t</span>　一个样本均值与已知总体均值比较。　<span class="fx">t＝(M−μ₀)／SE</span>，<span class="fx">SE＝s/√n</span>，<b>df＝n−1</b>。</p>
<p><span class="k">独立样本 t</span>　两组互不相关的被试比较。　<span class="fx">t＝(M₁−M₂)／SE<sub>diff</sub></span>，<b>df＝n₁+n₂−2</b>。</p>
<p><span class="k">配对样本 t</span>　同一批被试的两次测量（或配对组）比较。　<span class="fx">t＝M<sub>D</sub>／(s<sub>D</sub>/√n)</span>，<b>df＝对数−1</b>。<br>
本质是<b>对差值 D 做单样本 t 检验</b>（μ₀＝0）。</p>

<h2>独立样本的关键公式</h2>
<p><span class="k">合并方差</span>　<span class="fx">s<sub>p</sub>²＝(SS₁+SS₂)／(df₁+df₂)</span>，即两组方差的<b>加权平均</b>（大样本组权重大）。</p>
<p><span class="k">差值标准误</span>　<span class="fx">SE<sub>diff</sub>＝√[s<sub>p</sub>²(1/n₁＋1/n₂)]</span>。</p>
<p><span class="k">三个前提</span>　<b>独立性 · 正态性 · 方差齐性</b>。<br>
<b>配对／重复测量设计不要求“独立”</b>（数据本身相关），但要求差值的正态性。</p>
<p><span class="k">方差不齐时</span>　两组样本量相等或接近时 t 检验较稳健，可继续使用；<b>样本量悬殊且方差不齐时改用 Welch 校正（df 取小数）</b>。</p>

<h2>t 与 F 的关系</h2>
<div class="tip"><b>两组比较时二者等价：t²＝F</b>。<br>
独立样本 t 的平方 ＝ 单因素完全随机 ANOVA 的 F；<br>
<b>配对 t 的平方 ＝ 单因素重复测量 ANOVA 的 F</b>。<br>
这说明 t 检验是 F 检验在“两水平”时的特例。</div>

<h2>效应量</h2>
<p><span class="k">d</span>　<span class="fx">d＝(M₁−M₂)／s<sub>p</sub></span>。<b>d 不随 n 变化</b>，而 t 值随 n 增大——这是“t 大不等于效应大”的根源。</p>
<p><span class="k">r²</span>　<span class="fx">r²＝t²／(t²＋df)</span>，可把 t 结果转换为解释率。</p>

<h2>例题</h2>
<div class="ex">
<p class="q">实验组 n₁＝6、M₁＝18、SS₁＝30；对照组 n₂＝6、M₂＝14、SS₂＝30。α＝.05 双尾，检验差异是否显著，并求效应量。</p>
<p class="s"><b>① 假设</b>　H₀：μ₁＝μ₂；H₁：μ₁≠μ₂（双尾）。</p>
<p class="s"><b>② 合并方差</b>　df₁＝df₂＝5 → s<sub>p</sub>²＝(30+30)/10＝<span class="a">6</span>。</p>
<p class="s"><b>③ 差值标准误</b>　SE<sub>diff</sub>＝√[6(1/6+1/6)]＝√2＝<span class="a">1.414</span>。</p>
<p class="s"><b>④ 计算 t</b>　t＝(18−14)/1.414＝<span class="a">2.83</span>；df＝6+6−2＝<b>10</b>。</p>
<p class="s"><b>⑤ 临界值与结论</b>　t<sub>0.05(2),10</sub>＝2.228；2.83＞2.228 → <span class="a">拒绝 H₀</span>，两组差异显著。</p>
<p class="s"><b>⑥ 效应量</b>　d＝4/√6＝<span class="a">1.63</span>（大效应）；t²＝2.83²＝8.0，恰等于同数据单因素 ANOVA 的 F。</p>
<p class="cm">规范写法：<b>t(10)＝2.83，p＜.05，d＝1.63</b>。自由度必须跟着 t 值写，这是统计题的格式分。</p>
</div>

<h2>易错点</h2>
<p class="err"><b>1.</b> 独立样本用 <b>n₁+n₂−2</b>，配对用 <b>对数−1</b>，两处 df 最易混。</p>
<p class="err"><b>2.</b> 合并方差用 <b>SS 与 df</b>，不是把两个标准差直接平均。</p>
<p class="err"><b>3.</b> 把“同批被试的前后测”错用独立样本 t——既浪费效力，也算错 df。</p>
<p class="err"><b>4.</b> t 值大不等于效应大；<b>n 增大 t 变大，d 不变</b>。</p>
<p class="err"><b>5.</b> 样本量悬殊且方差不齐时，须提“用 Welch 校正”，是加分点。</p>
<p class="err"><b>6.</b> 选择独立还是配对，判据是<b>“两组数据是否相关”</b>，不是“人数是否相同”。</p>

<h3>考法</h3>
<p>独立样本 t 全流程 · 配对 t · 选择（该用哪种 t、df 多少）· 简答（t 检验前提、t 与 F 的关系）。</p>
</div>

<template id="doc-stat-5" data-subject="sm"><div class="doc" data-title="方差分析"><p class="hd">统计最高频章　│　目标：变异分解走通、两因素与混合设计的误差项能分清　│　<b>11/14 会师的核心工具</b></p>

<h2>基本思想</h2>
<p>把总变异分解为「处理引起的<b>组间变异</b>」与「误差引起的<b>组内变异</b>」，用 <b>F＝MS<sub>组间</sub>／MS<sub>组内</sub></b> 判断组间差异是否超出误差范围。<br>
<b>F 接近 1 说明处理效应不存在</b>；F 无负值，值域从 0 起。</p>
<div class="fm"><b>MS＝SS／df</b>，即“平均变异”。<b>不能用 SS 直接相除</b>——因为 SS 的大小受自由度影响，组间与组内的 df 不同，只有一个公平的比较基础，那就是均方。</div>

<h2>四种设计的变异分解</h2>
<table>

<thead><tr><th>设计</th><th>分解 · 自由度 · 误差项</th></tr></thead>
<tbody>
<tr><td class="k">单因素<br>完全随机</td><td>SS<sub>总</sub>＝SS<sub>组间</sub>＋SS<sub>组内</sub><br>
df<sub>组间</sub>＝k−1，<b>df<sub>组内</sub>＝N−k</b>，df<sub>总</sub>＝N−1<br>
误差项＝<b>MS<sub>组内</sub></b>；前提：独立、正态、方差齐性</td></tr>
<tr><td class="k">单因素<br>重复测量</td><td>SS<sub>总</sub>＝SS<sub>被试间</sub>＋SS<sub>处理</sub>＋SS<sub>残差</sub><br>
SS<sub>残差</sub>＝SS<sub>组内</sub>−SS<sub>被试间</sub><br>
误差项＝<b>MS<sub>残差</sub></b>（不是组内均方）；前提增加<b>球形性</b></td></tr>
<tr><td class="k">两因素<br>完全随机</td><td>SS<sub>总</sub>＝SS<sub>A</sub>＋SS<sub>B</sub>＋SS<sub>A×B</sub>＋SS<sub>误差</sub><br>
<b>三个 F（A、B、A×B）共用一个误差项</b></td></tr>
<tr><td class="k">两因素<br>混合</td><td>间层：A ＋ 误差(A)；内层：B ＋ A×B ＋ 误差(B)<br>
<b>两个误差项，各自对应</b>：A 的 F 用“被试／组间”误差，B 与 A×B 用残差</td></tr>
</tbody>
</table>

<h2>为什么重复测量更有力</h2>
<p>因为<b>个体差异（SS<sub>被试间</sub>）被单独分离出去，不再计入误差项</b>，残差均方明显小于组内均方。同样大小的处理效应会得到更大的 F。<br>
<b>效力高来自“剔除个体差异”，不是“样本量更大”。</b></p>

<h2>球形性</h2>
<p>任意两个水平之间差值的方差相等。<b>只在被试内因素有 3 个及以上水平时成为前提。</b><br>
违反会使 F <b>偏大</b>、I 类错误率升高；处理：用 <b>Greenhouse-Geisser 校正</b>自由度后重新查表。</p>

<h2>交互作用</h2>
<p>一个因素的效应随另一个因素水平的不同而改变，即两因素影响不是简单相加。</p>
<div class="fm"><b>交叉式交互</b>（两线交叉）：主效应可能互相抵消，此时“主效应显著”往往没有实际意义，应只看简单效应。<br>
<b>非交叉式交互</b>（方向一致）：主效应仍可解释，交互只说明效应大小不同。<br>
<b>交互显著时必须进一步做简单效应分析</b>，不能停留在“存在交互作用”。</div>

<h2>事后检验</h2>
<p>F 显著只说明“至少有一对均值不等”，未指出是哪几对。<b>F 不显著时一般不做（也不应做）事后检验。</b></p>
<p>比较次数：<b>k(k−1)／2</b>（4 组 6 次、5 组 10 次）。</p>
<p><b>保守程度：LSD 最宽松 ＜ N-K（q 检验）＜ Tukey HSD 最保守。</b></p>

<h2>效应量</h2>
<p><span class="fx">η²＝SS<sub>组间</sub>／SS<sub>总</sub></span>，表示因变量变异中被处理解释的比例（<b>用 SS 而非 MS</b>）。参考：约 .01 小、.06 中、.14 大。<b>与 d 一样不随样本量变化。</b></p>

<h2>例题</h2>
<div class="ex">
<p class="q">三种教学方法各 4 名被试。A 组 2,4,6,8；B 组 7,9,11,13；C 组 12,14,16,18。α＝.05，作单因素完全随机方差分析，并说明事后检验结果。</p>
<p class="s"><b>① 各组均值</b>　M<sub>A</sub>＝5，M<sub>B</sub>＝10，M<sub>C</sub>＝15；总均值 10；N＝12。</p>
<p class="s"><b>② 组内平方和</b>　每组离均差平方和均为 20 → SS<sub>组内</sub>＝<span class="a">60</span>，df<sub>组内</sub>＝12−3＝<b>9</b>。</p>
<p class="s"><b>③ 组间平方和</b>　SS<sub>组间</sub>＝4[(5−10)²＋0＋(15−10)²]＝<span class="a">200</span>，df<sub>组间</sub>＝3−1＝<b>2</b>。</p>
<p class="s"><b>④ 均方与 F</b>　MS<sub>组间</sub>＝200/2＝100；MS<sub>组内</sub>＝60/9＝6.67；<b>F＝100/6.67＝<span class="a">15.00</span></b>。</p>
<p class="s"><b>⑤ 结论</b>　F<sub>0.05(2,9)</sub>＝4.26；15.00＞4.26 → <span class="a">拒绝 H₀</span>，三种教法至少有一对存在显著差异。η²＝200/260＝<span class="a">0.77</span>（大效应）。</p>
<p class="s"><b>⑥ 事后检验（LSD）</b>　LSD＝2.262×√(2×6.67/4)＝2.262×1.826＝<span class="a">4.13</span>。三对差值分别为 5、5、10，<b>均＞4.13 → 三对全显著</b>。</p>
<p class="cm">若改用 Tukey HSD：HSD＝3.95×√(6.67/4)＝3.95×1.291＝5.10，此时差值恰为 5 的两对处于临界——这正是“LSD 宽松、HSD 保守”的具体体现。</p>
</div>

<h2>易错点</h2>
<p class="err"><b>1.</b> df 三件套：组间 k−1、组内 N−k、总 N−1；<b>三者必须相加吻合</b>，这是最快的自查法。</p>
<p class="err"><b>2.</b> F 显著只说明“有差异”，<b>不能直接说“A 优于 B”</b>，必须做事后检验。</p>
<p class="err"><b>3.</b> 重复测量若不剔除被试间变异，个体差异会算进误差，<b>效力被人为压低</b>。</p>
<p class="err"><b>4.</b> 混合设计两个误差项最易错：<b>被试内因素的 F 用残差 MS</b>，不能一律取 MS<sub>组内</sub>。</p>
<p class="err"><b>5.</b> 球形性只在被试内（≥3 水平）时是前提；完全随机设计不涉及。</p>
<p class="err"><b>6.</b> 对 4 组做 6 次 t 检验会使族系 I 类错误率膨胀到约 26%，故须先用总体 F 控制 α。</p>

<h3>考法</h3>
<p>ANOVA 摘要表填空（给 SS、df 求 MS、F）· 完整计算 · 判断“该用哪种 ANOVA”· 简答（为什么重复测量效力更高）。<b>11/14 会师时与 E3、附录 B 并排使用。</b></p>
</div>

<template id="doc-stat-6" data-subject="sm"><div class="doc" data-title="回归 · 卡方 · 非参数"><p class="hd">统计收尾层　│　目标：回归会算会解释、χ² 会用、非参数会选</p>

<h2>一元线性回归</h2>
<p><span class="k">方程</span>　<span class="fx">ŷ＝a＋bx</span></p>
<p><span class="k">回归系数</span>　<span class="fx">b＝Sxy／Sxx</span>，表示 <b>x 每增加 1 单位，y 平均变化 b 个单位</b>。<b>b 带单位</b>（y 的单位／x 的单位）。</p>
<p><span class="k">截距</span>　<span class="fx">a＝ȳ−b·x̄</span>（最小二乘法）。</p>
<p><span class="k">r 与 b</span>　<span class="fx">b＝r·(S<sub>y</sub>／S<sub>x</sub>)</span>。r 是<b>无单位的标准化斜率</b>，b 是<b>有单位的原始斜率</b>；|r|≤1，b 可大于 1 或为负。</p>
<p><span class="k">决定系数</span>　<span class="fx">r²＝SS<sub>回归</sub>／SS<sub>总</sub></span>，即 <b>y 的变异中被 x 解释的比例</b>。</p>
<p><span class="k">显著性检验</span>　F 检验（df＝1, n−2）或对 b 做 t 检验（df＝n−2），<b>二者等价：t²＝F</b>。</p>

<div class="fm"><b>相关 vs 回归</b>：相关<b>对称</b>——x 与 y 地位对等，只描述共变强度；回归<b>不对称</b>——区分自变量与因变量，可<b>由一个变量预测另一个</b>。<br>
r²＝0.30 只表示解释 30%，不能说“x 决定 y”。回归宜内插，<b>外推需谨慎</b>。</div>

<h2>χ² 检验</h2>
<p><span class="k">公式</span>　<span class="fx">χ²＝Σ(O−E)²／E</span>，除的是 <b>E</b> 不是 O。</p>
<p><span class="k">期望次数</span>　<span class="fx">E＝(行合计×列合计)／N</span>——分母是 <b>N（总人数）</b>，不是格子数。</p>
<p><span class="k">自由度</span>　拟合优度 <b>df＝k−1</b>；独立性 <b>df＝(r−1)(c−1)</b>，2×2 表 df＝1。</p>
<p><span class="k">单尾</span>　χ² 恒为正、只反映偏离大小，<b>拒绝域只在右端，没有左侧拒绝域</b>。关联方向要看实际比例。</p>
<p><span class="k">期望次数过小</span>　某格 <b>E＜5</b> 时近似不可靠 → 合并相邻类别、增大样本量，或改用 Fisher 精确检验。</p>

<h2>非参数检验</h2>
<table>

<thead><tr><th>方法</th><th>适用设计</th><th>对应的参数检验</th></tr></thead>
<tbody>
<tr><td class="k">符号检验</td><td>配对，最粗糙（只用正负）</td><td>配对 t</td></tr>
<tr><td class="k">Wilcoxon 符号秩</td><td>配对，<b>利用差值大小</b>，效力更高</td><td>配对 t</td></tr>
<tr><td class="k">Mann-Whitney U</td><td>两独立样本</td><td>独立样本 t</td></tr>
<tr><td class="k">Kruskal-Wallis H</td><td>多独立样本</td><td>单因素 ANOVA</td></tr>
<tr><td class="k">Friedman</td><td>多相关样本</td><td>重复测量 ANOVA</td></tr>
</tbody>
</table>
<p><span class="k">何时用</span>　等级数据 · 分布严重偏态或未知 · 样本极小 · 有无法剔除的极端值 · 方差不齐且无法校正。</p>
<div class="fm"><b>优先参数检验</b>：满足前提时参数检验效力更高（利用了均值与方差信息），非参数只用秩次或符号，<b>信息损失导致效力较低</b>（通常需多 5%–15% 样本）。<b>非参数是前提不满足时的替代，不是“更高级”的方法。</b></div>

<h2>例题</h2>
<div class="ex">
<p class="q"><b>题 1（回归）</b>：(x,y)＝(1,2),(2,3),(3,5),(4,6)。求回归方程、r、r²，预测 x＝5 时的 y。</p>
<p class="s">n＝4，x̄＝2.5，ȳ＝4；Sxx＝30−4×6.25＝5，Syy＝74−4×16＝10，Sxy＝47−4×2.5×4＝7。</p>
<p class="s">b＝7/5＝<span class="a">1.4</span>；a＝4−1.4×2.5＝<span class="a">0.5</span> → <b>ŷ＝0.5＋1.4x</b>。</p>
<p class="s">r＝7/√(5×10)＝7/7.07＝<span class="a">0.99</span>；r²＝<span class="a">0.98</span>，即 y 的变异 98% 可由 x 解释。</p>
<p class="s">预测：ŷ(5)＝0.5＋1.4×5＝<span class="a">7.5</span>。</p>
<p class="q"><b>题 2（χ² 独立性）</b>：2×2 表，A 组 20/30（共 50），B 组 30/20（共 50），N＝100，α＝.05。</p>
<p class="s">E＝50×50/100＝<span class="a">25</span>（四格均为 25）。</p>
<p class="s">χ²＝Σ(O−E)²/E＝(20−25)²/25×4＝1×4＝<span class="a">4.00</span>；df＝(2−1)(2−1)＝<b>1</b>。</p>
<p class="s">χ²<sub>0.05(1)</sub>＝3.84；4.00＞3.84 → <span class="a">拒绝 H₀</span>，两变量存在显著关联。</p>
<p class="cm">若同一数据用两组比例 z 检验，z＝2.00、z²＝4.00＝χ²——与 S4 的 t²＝F 同属“检验统一性”的例子。</p>
</div>

<h2>易错点</h2>
<p class="err"><b>1.</b> <b>b 有单位、r 无单位</b>；不要把回归的截距斜率与标准分公式混。</p>
<p class="err"><b>2.</b> r 高不等于因果，也不等于预测准；<b>回归宜内插，外推需谨慎</b>。</p>
<p class="err"><b>3.</b> χ² 期望次数的分母是 <b>N</b>，不是格数；独立性 df 用 (r−1)(c−1)。</p>
<p class="err"><b>4.</b> χ² 是单尾检验，<b>没有左侧拒绝域</b>；关联方向看实际比例。</p>
<p class="err"><b>5.</b> 非参数并非“更好”，<b>是同等条件下效力更低的替代方案</b>。</p>
<p class="err"><b>6.</b> 符号检验只用差值正负、丢掉大小信息，效力最低，不能与 Wilcoxon 混用。</p>
<p class="err"><b>7.</b> 合并类别会改变 df，须一并说明；不能为“通过检验”随意合并。</p>

<h3>考法</h3>
<p>回归计算（b、a、r²、预测）· χ² 计算（含 df）· 选择（相关与回归的区别、非参数方法配对）· 简答（r 与 b 的关系、何时用非参数）。</p>
</div></div></template>
<template id="doc-meas-1" data-subject="sm"><div class="doc" data-title="经典测验理论（CTT）与信度"><p class="sub">测量第一层　│　目标：真分数模型与信度五类能默写、斯—布朗与 SE 会算　│　★★★</p>
<h2>导图</h2>
<div class="mm"><div class="root">CTT 与信度</div><ul>
<li><b>1 · 真分数模型</b>★：<span class="fx">X＝T＋E</span>（观测＝真分数＋误差）；<b>方差分解 <span class="fx">S<sub>X</sub>²＝S<sub>T</sub>²＋S<sub>E</sub>²</span></b></li>
<li><b>2 · 三条假设</b>★：①误差的期望为 0（E(E)＝0）②真分数与误差独立 ③不同测量的误差之间独立</li>
<li><b>3 · 信度定义</b>★：<span class="fx">r<sub>xx</sub>＝S<sub>T</sub>²/S<sub>X</sub>²＝1−S<sub>E</sub>²/S<sub>X</sub>²</span>，即真分数方差占观测分数的比例</li>
<li><b>4 · 误差两类</b>★：<b>随机误差 → 影响信度；系统误差 → 影响效度，不影响信度</b></li>
<li><b>5 · 信度的五类估计</b>★
<ul class="less">
<li><b>重测信度</b>（稳定性）：同一测验施测两次，间隔通常 2–4 周</li>
<li><b>复本信度</b>（等值性）：两个平行复本，可即时或间隔施测</li>
<li><b>分半信度</b>（内部一致性）：奇偶分半求相关 r<sub>hh</sub>，再经<b>斯皮尔曼—布朗校正</b></li>
<li><b>同质信度</b>：<b>KR-20</b>（0/1 计分）· KR-21（难度相近）· <b>α 系数</b>（多重计分／李克特）</li>
<li><b>评分者信度</b>：两名以上评分者的一致性（相关或 Kappa）</li>
</ul></li>
<li><b>6 · 影响因素</b>★：样本团体的<b>异质性</b>（越大信度越高）· 测验长度（越长越高）· 难度（中等、分布广→高）· 时间间隔（越长重测越低）· 内容同质性 · 施测条件 · 被试状态</li>
<li><b>7 · 测量标准误</b>★：<span class="fx">SE＝S<sub>X</sub>√(1−r<sub>xx</sub>)</span>
<ul class="less"><li>用于对<b>个体分数</b>作区间解释：X±1.96SE</li></ul></li>
<li><b>8 · 信度与效度</b>★：信度是效度的<b>必要非充分</b>条件；<b>效度 ≤ √信度</b></li>
</ul></div>
<h2>关键概念</h2>
<table>
<thead><tr><th>概念</th><th>公式 / 一句话</th><th>易错 / 考点</th></tr></thead><tbody>
<tr><td class="k">斯—布朗校正</td><td><span class="fx">r<sub>xx</sub>＝2r<sub>hh</sub>/(1＋r<sub>hh</sub>)</span></td><td>分半信度只是<b>半个测验</b>的信度，必须校正到全长；<b>校正后必然升高</b></td></tr>
<tr><td class="k">KR-20 与 α</td><td>KR-20 用于 0/1 计分；α 用于多重计分</td><td>α 是<b>内部一致性下限</b>，题目异质时 α 会偏低</td></tr>
<tr><td class="k">重测信度</td><td>同一测验两次施测的相关</td><td>间隔太短有<b>记忆效应</b>，太长有<b>成长效应</b>，故取 2–4 周</td></tr>
<tr><td class="k">复本信度</td><td>两个平行复本的相关</td><td>须先保证<b>复本等值</b>（内容、难度、区分度相当）</td></tr>
<tr><td class="k">样本异质性</td><td>团体分数分布越宽，信度越高</td><td><b>同一测验用于同质团体时信度会明显下降</b></td></tr>
<tr><td class="k">SE</td><td><span class="fx">S<sub>X</sub>√(1−r<sub>xx</sub>)</span></td><td>用<b>观测分数标准差 S<sub>X</sub></b>，不是真分数的 S<sub>T</sub></td></tr>
<tr><td class="k">信效度关系</td><td>效度 ≤ √信度</td><td>信度低时效度必然低；<b>信度高时效度不一定高</b></td></tr>
</tbody></table>
<h2>例题</h2>
<div class="ex">
<div class="q"><b>题</b>：某 40 题测验奇偶分半相关 r<sub>hh</sub>＝0.60，观测分数标准差 S<sub>X</sub>＝12。求分半信度、校正后信度与测量标准误；某生得 80 分，求其真分数的 95% 置信区间。</div>
<div class="s"><b>①</b> 分半信度＝r<sub>hh</sub>＝<span class="a">0.60</span>（仅代表半个测验）。</div>
<div class="s"><b>②</b> 斯—布朗校正：r<sub>xx</sub>＝2×0.60/(1＋0.60)＝1.20/1.60＝<span class="a">0.75</span>。</div>
<div class="s"><b>③</b> SE＝S<sub>X</sub>√(1−0.75)＝12×√0.25＝12×0.5＝<span class="a">6</span>。</div>
<div class="s"><b>④</b> 真分数区间：80±1.96×6＝80±11.76 → <span class="a">[68.24, 91.76]</span>。</div>
<div class="cm">若把两半题目都算进去但忘了校正，会报 0.60，<b>系统性低估信度</b>——这是本题的主要采分点。</div>
</div>
<h3>易错点</h3>
<ol class="err">
<li><b>随机误差影响信度，系统误差影响效度而不影响信度</b>——最高频的一处辨析。</li>
<li>分半信度必须做斯—布朗校正，校正后<b>一定高于</b>原始 r<sub>hh</sub>。</li>
<li>同一测验在不同团体中信度不同：<b>团体越异质，信度越高</b>。</li>
<li>KR-20 只适用 0/1 计分，李克特量表要用 α。</li>
<li>SE 公式里用 <b>S<sub>X</sub></b>；SE 越小，说明分数越可靠。</li>
<li>信度是效度的必要条件：<b>信度为 0 时效度必为 0</b>。</li>
</ol>
<div class="foot"><b>考法</b>：计算（斯—布朗、α、KR-20、SE、真分数区间）· 选择（哪种信度测什么、影响因素）· 简答（信度与效度的关系、系统误差与随机误差的区别）。</div>
</div>


<div class="sec"></div></template>
<template id="doc-meas-2" data-subject="sm"><div class="doc" data-title="效度"><p class="sub">测量第二层　│　目标：三类效度能区分、效度上限会算　│　★★★</p>
<h2>导图</h2>
<div class="mm"><div class="root">效度</div><ul>
<li><b>1 · 定义</b>★：测验能测出<b>所要测的心理特质</b>的程度；<b>效度是相对于特定用途而言的</b>，没有抽象的“高效度测验”</li>
<li><b>2 · 内容效度</b>
<ul class="less">
<li>题目对所要测内容范围的<b>代表性</b>；靠专家判断与<b>双向细目表</b>，属逻辑分析而非统计</li>
<li>适用于<b>成就测验、教育测验</b>；不适用于能力倾向与人格测验</li>
</ul></li>
<li><b>3 · 结构效度（构想效度）</b>★
<ul class="less">
<li>测验是否真的测到某个理论构念；验证是<b>累积过程</b>，无单一指标</li>
<li>证据类型：<b>会聚效度与区分效度</b> · 因素分析 · 发展变化（随年龄增长）· 实验操作（训练后提高）· 内部一致性 · 与其他测验的相关</li>
</ul></li>
<li><b>4 · 效标关联效度</b>★
<ul class="less">
<li>测验分数与<b>效标</b>的关联程度，用相关系数表示（效度系数）</li>
<li><b>同时效度</b>：与当前效标（如现有诊断）· <b>预测效度</b>：与未来效标（如学业成绩）</li>
<li>效标须可靠：警惕<b>效标污染</b>（效标含测验本身信息）与<b>效标缺陷</b>（效标未涵盖全部标准）</li>
</ul></li>
<li><b>5 · 效度与信度</b>★：<b>效度 ≤ √信度</b>；信度是必要非充分条件</li>
<li><b>6 · 影响因素</b>：测验本身（题目质量、长度、难度）· 样本（异质性、代表性）· 效标（可靠性）· 施测条件 · 被试状态</li>
<li><b>7 · 提高效度</b>：明确测验目的 · 合理选题与组卷 · 提高信度 · 选好效标 · 控制施测条件 · 扩大样本异质性</li>
</ul></div>
<h2>关键概念</h2>
<table>
<thead><tr><th>概念</th><th>含义 / 公式</th><th>易错 / 考点</th></tr></thead><tbody>
<tr><td class="k">效度系数</td><td>测验分与效标分的相关系数 r<sub>xy</sub></td><td>r<sub>xy</sub>² 才是<b>解释率</b>（效标变异中被测验解释的比例）</td></tr>
<tr><td class="k">效度上限</td><td><span class="fx">r<sub>xy</sub> ≤ √r<sub>xx</sub></span></td><td>信度 0.81 → 效度最高只有 0.90，<b>不可能达到 1</b></td></tr>
<tr><td class="k">衰减校正</td><td><span class="fx">r<sub>c</sub>＝r<sub>xy</sub>/√(r<sub>xx</sub>·r<sub>yy</sub>)</span></td><td>校正的是<b>测量误差造成的低估</b>，校正后可能 &gt; 原值</td></tr>
<tr><td class="k">内容效度</td><td>题目的代表性</td><td>靠专家与细目表，<b>不用相关系数</b></td></tr>
<tr><td class="k">会聚/区分</td><td>与同类构念高相关、与异类低相关</td><td>两者必须<b>同时具备</b>才支持结构效度</td></tr>
<tr><td class="k">同时 vs 预测</td><td>效标在当下 vs 在未来</td><td>区别只在<b>时间关系</b>，不在效标类型</td></tr>
<tr><td class="k">效标污染</td><td>效标本身含测验信息</td><td>会使效度<b>虚高</b>，与效标缺陷方向相反</td></tr>
</tbody></table>
<h2>例题</h2>
<div class="ex">
<div class="q"><b>题</b>：某能力测验施测于 100 人，与效标的积差相关 r<sub>xy</sub>＝0.50；已知该测验信度 r<sub>xx</sub>＝0.80，效标信度 r<sub>yy</sub>＝0.90。（1）求效度系数的理论上限；（2）求经衰减校正后的效度；（3）说明 r<sub>xy</sub>² 的意义。</div>
<div class="s"><b>①</b> 上限＝√r<sub>xx</sub>＝√0.80＝<span class="a">0.894</span>；实测 0.50 未超上限，合理。</div>
<div class="s"><b>②</b> r<sub>c</sub>＝0.50/√(0.80×0.90)＝0.50/√0.72＝0.50/0.849＝<span class="a">0.589</span>。</div>
<div class="s"><b>③</b> r<sub>xy</sub>²＝0.25，即<b>效标变异的 25% 可由测验分数解释</b>，其余为误差与其他因素。</div>
<div class="cm">注意区分：0.50 是观测到的效度系数；0.589 是扣除双方测量误差后的“真”关联；<b>报效度时通常报前者并说明后者</b>。</div>
</div>
<h3>易错点</h3>
<ol class="err">
<li>效度不是测验固有的属性，<b>“这个测验有效”必须补上“用于什么目的、对什么群体”</b>。</li>
<li>信度高时效度不一定高（可能系统性地测错了东西）；<b>信度低时效度必然低</b>。</li>
<li>内容效度靠专家判断与双向细目表，<b>不是统计指标</b>。</li>
<li>结构效度没有单一验证方法，是<b>多类证据累积</b>的结果。</li>
<li><b>效标污染</b>使效度虚高，<b>效标缺陷</b>使效度虚低，方向相反。</li>
<li>r<sub>xy</sub>＝0.50 说明解释率仅 25%，<b>不能说“预测很准”</b>。</li>
</ol>
<div class="foot"><b>考法</b>：计算（效度上限、衰减校正、解释率）· 选择（三类效度的适用情境、会聚与区分）· 简答（信度与效度的关系、效标污染与缺陷）。</div>
</div>


<div class="sec"></div></template>
<template id="doc-meas-3" data-subject="sm"><div class="doc" data-title="项目分析 · 常模与分数解释"><p class="sub">测量第三层　│　目标：难度与区分度会算会判、常模与标准分会转换　│　★★★</p>
<h2>导图 · 项目分析</h2>
<div class="mm"><div class="root">项目分析</div><ul>
<li><b>1 · 难度 P</b>★
<ul class="less">
<li><span class="fx">P＝答对人数/总人数</span>（0–1，<b>P 越大题目越容易</b>）</li>
<li>极端分组法：<span class="fx">P＝(P<sub>H</sub>＋P<sub>L</sub>)/2</span>（高、低分组各取 <b>27%</b>）</li>
<li>选择题须校正猜测：<span class="fx">CP＝(KP−1)/(K−1)</span>（K 为选项数）</li>
</ul></li>
<li><b>2 · 区分度 D</b>★
<ul class="less">
<li><b>鉴别指数</b> <span class="fx">D＝P<sub>H</sub>−P<sub>L</sub></span>；标准：≥0.40 很好 / 0.30–0.39 良好 / 0.20–0.29 尚可需修改 / &lt;0.19 淘汰</li>
<li><b>项目—总分相关</b>：点二列相关（答对/错 vs 总分）、二列相关</li>
</ul></li>
<li><b>3 · 难度与区分度的关系</b>★：<b>P＝0.50 时 D 最大</b>；P 接近 0 或 1 时 D 趋近 0</li>
<li><b>4 · 项目筛选流程</b>：难度分布合理（多为中等）→ 区分度达标 → 选项分析（干扰项是否有效）→ 内容代表性 → 定稿</li>
</ul></div>
<h2>导图 · 常模与分数解释</h2>
<div class="mm"><div class="root">常模与分数解释</div><ul>
<li><b>1 · 常模团体</b>★：标准化样本，须<b>代表</b>目标总体（分层随机抽样）；<b>常模只对相应团体有效</b></li>
<li><b>2 · 常模类型</b>★
<ul class="less">
<li><b>发展常模</b>：年龄当量（智龄）· 年级当量</li>
<li><b>组内常模</b>：百分等级 · 标准分数（z、T、离差智商、标准九）</li>
</ul></li>
<li><b>3 · 标准分换算</b>★
<ul class="less">
<li><span class="fx">z＝(X−M)/SD</span>；<span class="fx">T＝10z＋50</span></li>
<li><b>离差智商 IQ＝100＋15z</b>（韦氏，SD＝15）；斯坦福—比奈用 SD＝16</li>
<li>标准九：均值 5、标准差 2</li>
</ul></li>
<li><b>4 · 分数解释</b>★：<b>常模参照</b>（相对位置，看排名）vs <b>标准参照</b>（绝对水平，看达标与否，不需常模）</li>
<li><b>5 · 测验等值</b>：不同版本分数可比化的过程（铆题设计等）</li>
<li><b>6 · 用 SE 解释个体分数</b>：X±1.96SE 给真分数区间</li>
</ul></div>
<h2>关键概念</h2>
<table>
<thead><tr><th>概念</th><th>公式 / 含义</th><th>易错 / 考点</th></tr></thead><tbody>
<tr><td class="k">难度 P</td><td>通过率</td><td><b>P 越大越容易</b>（与“难度”字面相反，最易错）</td></tr>
<tr><td class="k">校正难度 CP</td><td><span class="fx">(KP−1)/(K−1)</span></td><td>仅用于选择题；K＝1 时无意义</td></tr>
<tr><td class="k">鉴别指数 D</td><td><span class="fx">P<sub>H</sub>−P<sub>L</sub></span></td><td>是<b>通过率之差</b>，不是之比；高低分组各取 <b>27%</b></td></tr>
<tr><td class="k">点二列相关</td><td>二分变量与连续变量的相关</td><td>项目—总分相关用它；题量少时易低估</td></tr>
<tr><td class="k">百分等级</td><td>低于该分者所占百分比</td><td>属<b>顺序量表</b>，不能加减、不能平均</td></tr>
<tr><td class="k">离差智商</td><td><span class="fx">100＋15z</span>（韦氏）</td><td>韦氏 SD＝15；斯—比 SD＝16，别混</td></tr>
<tr><td class="k">标准参照</td><td>对照既定标准判断达标</td><td><b>不需要常模</b>，与常模参照相对</td></tr>
</tbody></table>
<h2>例题</h2>
<div class="ex">
<div class="q"><b>题</b>：某测验 200 人，高分组（27%，54 人）与低分组某题通过率分别为 0.80 与 0.40。（1）求难度与鉴别指数并判断质量；（2）若该题为五选一选择题，求校正难度；（3）某生 z＝1.2，求其离差智商与 T 分数。</div>
<div class="s"><b>①</b> P＝(0.80＋0.40)/2＝<span class="a">0.60</span>。</div>
<div class="s"><b>②</b> D＝0.80−0.40＝<span class="a">0.40</span>，达“很好”水平，<b>题目质量优良</b>。</div>
<div class="s"><b>③</b> CP＝(5×0.60−1)/(5−1)＝(3−1)/4＝<span class="a">0.50</span>，校正后接近理想难度。</div>
<div class="s"><b>④</b> IQ＝100＋15×1.2＝<span class="a">118</span>；T＝10×1.2＋50＝<span class="a">62</span>。</div>
<div class="cm">若该题 P＝0.95、D＝0.05，则属“过易且无区分力”，应予淘汰或修改——这是筛选题的典型判断。</div>
</div>
<h3>易错点</h3>
<ol class="err">
<li><b>难度 P 越大表示越容易</b>；说“难度高”其实指 P 小，答题时用“通过率”表述最稳。</li>
<li>鉴别指数是<b>通过率之差</b>（0.80−0.40），不是比值（2.0）。</li>
<li>极端分组各取 <b>27%</b>（不是 50%），这是标准做法。</li>
<li>猜测校正公式中 K 是<b>选项数</b>；四选一 K＝4。</li>
<li>百分等级是顺序量表，<b>PR 60 与 PR 50 的差距不等于能力差距</b>。</li>
<li>离差智商 SD：韦氏 15、斯—比 16，题目常在此设陷。</li>
<li>标准参照测验不需要常模，别把两者混为一谈。</li>
</ol>
<div class="foot"><b>考法</b>：计算（P、CP、D、IQ、T、PR）· 选择（难度与区分度关系、常模类型）· 简答（如何筛选项目、常模团体的要求、常模参照与标准参照的区别）。</div>
</div>

<template id="doc-meas-4" data-subject="sm"><div class="doc" data-title="测验编制与常见心理测验"><p class="sub">测量收尾层　│　目标：编制流程能背、常见测验到“名片级”（定位＋结构＋关键数字）　│　★★</p>
<h2>导图 · 编制与标准化</h2>
<div class="mm"><div class="root">测验编制</div><ul>
<li><b>1 · 编制程序</b>★：确定目的与对象 → 制定<b>双向细目表</b> → 编制题目 → 预测与项目分析 → 合成测验（选题、编排）→ <b>标准化</b>（指导语、施测、评分、常模、信效度）→ 编写测验手册</li>
<li><b>2 · 题目编制原则</b>：内容取样有代表性 · 难度分布合理（多为中等）· 题干简明无暗示 · 干扰项有效 · 避免歧义与文化偏向</li>
<li><b>3 · 标准化三要素</b>★：<b>施测标准化 · 评分标准化 · 常模</b>（+信度效度证据）</li>
</ul></div>
<h2>导图 · 常见测验（名片级）</h2>
<div class="mm"><div class="root">常见心理测验</div><ul>
<li><b>智力测验</b>★
<ul class="less">
<li>比奈—西蒙（1905）：<b>第一个智力量表</b>；比率智商 <span class="fx">IQ＝MA/CA×100</span></li>
<li>斯坦福—比奈（推孟修订）：比率智商→<b>离差智商</b>，SD＝16</li>
<li>韦氏（WPPSI／WISC／WAIS）：<b>离差智商 SD＝15</b>；分<b>言语量表与操作量表</b>，可算总智商与各分测验</li>
<li>瑞文推理（SPM）：<b>非言语、图形推理、文化公平性较好</b>，可团体施测</li>
</ul></li>
<li><b>人格测验 — 自陈量表</b>★
<ul class="less">
<li><b>MMPI</b>：明尼苏达多相人格调查表；<b>4 个效度量表（L、F、K、？）＋10 个临床量表</b>；用于精神科辅助诊断</li>
<li><b>16PF</b>：卡特尔 16 种人格因素；因素分析法编制</li>
<li><b>EPQ</b>：艾森克；<b>E（内外向）、N（神经质）、P（精神质）＋L（说谎）</b></li>
</ul></li>
<li><b>人格测验 — 投射测验</b>★
<ul class="less">
<li><b>罗夏墨迹测验</b>：10 张墨迹图（5 黑白、2 黑白红、3 彩色）</li>
<li><b>TAT</b>（主题统觉测验，默里）：约 30 张图片，编故事，测需要与动机</li>
<li>其他：词语联想 · 句子完成 · 房树人绘画</li>
<li>特点：<b>刺激意义模糊、反应自由、解释依赖主试经验、信效度较低</b></li>
</ul></li>
<li><b>兴趣与态度测验</b>
<ul class="less"><li>兴趣：斯特朗—坎贝尔（SCII）· 霍兰德职业兴趣（SDS）</li><li>态度：<b>李克特总加量表</b>（5 点式）· 瑟斯顿等距量表 · 博格达斯社会距离量表</li></ul></li>
<li><b>使用伦理</b>：资格限制 · 保密 · 不滥用分数 · 结合多源信息解释</li>
</ul></div>
<h2>关键概念</h2>
<table>
<thead><tr><th>概念</th><th>含义</th><th>易错 / 考点</th></tr></thead><tbody>
<tr><td class="k">双向细目表</td><td>教学内容 × 认知层次的二维表</td><td>保证<b>内容效度</b>的核心工具，编制第一步就要有</td></tr>
<tr><td class="k">比率智商</td><td><span class="fx">MA/CA×100</span></td><td>随年龄增长失效（成人智龄不再增长）→ 被离差智商取代</td></tr>
<tr><td class="k">离差智商</td><td><span class="fx">100＋15z</span></td><td>韦氏用 15；斯—比用 16</td></tr>
<tr><td class="k">MMPI</td><td>4 效度量表＋10 临床量表</td><td>效度量表是 L、F、K（＋？），<b>不是临床量表</b></td></tr>
<tr><td class="k">EPQ</td><td>E、N、P＋L</td><td>L 是<b>效度（掩饰）量表</b>，不计入人格维度</td></tr>
<tr><td class="k">投射测验</td><td>罗夏、TAT、房树人</td><td><b>信效度普遍低于自陈量表</b>，解释主观性大</td></tr>
<tr><td class="k">标准化三要素</td><td>施测、评分、常模</td><td>缺一不可；仅有常模不算标准化测验</td></tr>
</tbody></table>
<h2>例题</h2>
<div class="ex">
<div class="q"><b>题</b>：某研究者要比较不同文化背景、不同识字水平儿童的一般推理能力；（a）应选哪个测验，为什么？（b）若改用 MMPI 是否合适？（c）若用某新编量表，编制流程中最能保证内容效度的一步是哪一步？</div>
<div class="s"><b>（a）</b><span class="a">瑞文推理测验</span>：非言语、图形材料，<b>对语言与文化背景依赖小</b>，可团体施测，适合跨文化比较。</div>
<div class="s"><b>（b）</b><span class="a">不合适</span>：MMPI 是<b>人格自陈量表</b>，用于精神科辅助诊断，测的不是推理能力，且需一定识字与语言理解水平。</div>
<div class="s"><b>（c）</b><span class="a">制定双向细目表</span>并据此取样编题——它直接保证题目对内容范围的<b>代表性</b>，是内容效度的关键。</div>
<div class="cm">这类“选测验＋说理由”的题，采分点常在<b>测验的适用条件</b>（言语/非言语、个体/团体、年龄范围、施测资格），而不是测验的编制者姓名。</div>
</div>
<h3>易错点</h3>
<ol class="err">
<li><b>比率智商</b>是智龄／实龄×100，随年龄增长而失真，故现代智力测验用离差智商。</li>
<li>MMPI 的 <b>L、F、K、？ 是效度量表</b>，不是临床量表——最常见的对应错误。</li>
<li>EPQ 的 <b>L 是掩饰（效度）量表</b>，不属 PEN 三维度。</li>
<li>瑞文测的是<b>一般推理／流体能力</b>，不是“文化公平到毫无文化影响”，表述要留余地。</li>
<li>投射测验并非“更深入所以更好”，其<b>信效度通常低于自陈量表</b>。</li>
<li>标准化＝施测＋评分＋常模三者齐备，单有常模不够。</li>
</ol>
<div class="foot"><b>考法</b>：选择（测验与编制者/结构的对应、智商类型）· 简答（编制流程、标准化含义、投射测验的优缺点、比率智商为何被取代）· 应用题（给定情境选测验并说明理由）。</div>
</div></div></template>
